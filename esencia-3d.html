<title>Esencia・香境</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* 單一深色場景：雨後森林的苔金調 */
  :root{
    color-scheme:dark;
    --bg:#080a07; --ink:#f1f0e6; --ink-2:#b5b59c; --muted:#7a7c66;
    --gold:#c4bd7e; --gold-lt:#e4e2b4; --line:rgba(196,189,126,.3); --panel:rgba(14,17,11,.78);
    --serif:"Playfair Display","Noto Serif TC",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
  }
  /* iOS 26 Safari 會拿貼邊、滿版的 fixed 元素顏色把狀態列／網址列塗成色塊；這頁不用 fixed，
     改成上下各多畫一段（--bt／--bb）、開場捲到 --bt，讓狀態列與網址列底下透出真正的場景 */
  html,body{margin:0;background:var(--bg);color:var(--ink-2);font-family:var(--sans);overflow:hidden;}
  body{position:relative;height:calc(var(--vh,100vh) + var(--bt,0px) + var(--bb,0px));}
  #stage{position:absolute;left:0;top:0;width:100%;height:100%;}
  #stage canvas{display:block;touch-action:none;}
  .hud{position:absolute;pointer-events:none;z-index:5;}
  .hud *{pointer-events:auto;}
  .top{top:var(--bt,0px);left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 16px) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;}
  .back{white-space:nowrap;font-size:12.5px;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:6px 14px;background:var(--panel);backdrop-filter:blur(6px);}
  .back:hover,.back:focus-visible{color:var(--gold);border-color:var(--gold);outline:none;}
  .title{text-align:right;text-shadow:0 1px 12px rgba(0,0,0,.7),0 0 3px rgba(0,0,0,.45);}
  .brand{font-family:var(--serif);font-size:10.5px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;}
  .name{font-family:var(--serif);font-size:30px;color:var(--ink);line-height:1.1;margin-top:4px;}
  .meta{font-size:11.5px;color:#efe6d2;line-height:1.6;margin-top:4px;letter-spacing:.5px;}
  .tiers{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(var(--bb,0px) + env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:6px;}
  .tier{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);padding:6px 12px 6px 8px;border-radius:18px;border:1px solid transparent;background:var(--panel);backdrop-filter:blur(6px);}
  .tier b{font-family:var(--serif);font-weight:500;color:var(--ink);font-size:13px;letter-spacing:1px;}
  .tier .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);}
  .tier.on{border-color:var(--c);}
  .tier:focus-visible{outline:1px solid var(--gold);}
  .hint{right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--bb,0px) + env(safe-area-inset-bottom,0px) + 22px);font-size:11px;color:var(--muted);text-align:right;line-height:1.7;max-width:46vw;}
  .card{position:absolute;left:50%;bottom:calc(var(--bb,0px) + env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,20px);opacity:0;transition:opacity .25s,transform .25s;
    width:min(360px,calc(100vw - 36px));background:rgba(14,17,11,.9);border:1px solid var(--line);border-radius:16px;padding:16px 18px;z-index:6;backdrop-filter:blur(8px);pointer-events:none;}
  .card.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  .card .k{font-size:10.5px;letter-spacing:3px;color:var(--c,var(--gold));}
  .card .n{font-family:var(--serif);font-size:22px;color:var(--ink);margin-top:4px;}
  .card .n span{font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-left:8px;}
  .card p{margin:8px 0 0;font-size:13px;line-height:1.7;color:var(--ink-2);}
  .card button{all:unset;position:absolute;top:10px;right:12px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:4px;}
  .card.show ~ .tiers,.card.show ~ .hint{opacity:0;pointer-events:none;}
  .lbl{font-family:var(--sans);text-align:center;white-space:nowrap;transition:opacity .3s;pointer-events:auto;cursor:pointer;background:rgba(12,15,9,.55);padding:5px 11px 6px;border-radius:10px;backdrop-filter:blur(3px);}
  .lbl .z{font-size:12.5px;color:var(--ink);letter-spacing:1px;}
  .lbl .e{font-size:9.5px;color:var(--gold-lt);letter-spacing:1.5px;text-transform:uppercase;opacity:.8;}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:9;background:var(--bg);transition:opacity .6s;}
  #loading .brand{font-size:11px}
  #loading .bar{width:120px;height:1px;background:var(--line);overflow:hidden;position:relative;}
  #loading .bar::after{content:"";position:absolute;inset:0;width:40%;background:var(--gold);animation:ld 1.2s ease-in-out infinite;}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  #err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;background:var(--bg);color:var(--ink-2);font-size:14px;line-height:1.8;}
  @media (max-width:520px){ .name{font-size:24px} .hint{display:none} }
  @media (prefers-reduced-motion:reduce){ #loading .bar::after{animation:none} }
</style>

</script>

</div>

</div>

// ---------- 場景設定：依香水的季節、時段與香材產地 ----------
// Esencia：春夏秋・白天（Fragrantica 投票：春最多，白天多於夜晚）｜場景取春季雨後清晨｜LOEWE 官方以「蕨類」為這支香水的意象（外盒上的蕨葉嫩芽），木質、苔蘚、大地的西普調
// → 春雨後清晨的蕨類森林空地：新芽捲曲舒展、嫩綠新葉：霧、光束、孢子、杜松與胡椒木、長青苔的化石石灰岩台座

  sunDir: new THREE.Vector3(-.5,.5,-.7).normalize(),
  sunColor: C('#ffe6bc'), sunIntensity: 3.0,
  zenith: C('#7f9aa3'), horizon: C('#cfd3c0'), sunGlow: C('#ffe0a6'),

// ---------- 小工具 ----------
const loader = new THREE.TextureLoader();
function tex(src, srgb=true){ const t = loader.load(src); if(srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; }
function canvasTex(w,h,draw,srgb=true){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
function rng(seed){ let s=seed>>>0||1; return ()=>{ s=Math.imul(s^(s>>>15),2246822507); s=Math.imul(s^(s>>>13),3266489909); s^=s>>>16; return (s>>>0)/4294967296; }; }
function hash3(x,y,z){ let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(z,1274126177); h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967295; }
function noise3(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z); const xf=x-xi,yf=y-yi,zf=z-zi;
  const s=t=>t*t*(3-2*t); const u=s(xf),v=s(yf),w=s(zf); let r=0;
  for(let a=0;a<2;a++)for(let b=0;b<2;b++)for(let c=0;c<2;c++){ r+=hash3(xi+a,yi+b,zi+c)*(a?u:1-u)*(b?v:1-v)*(c?w:1-w); }
  return r*2-1;
}
function fbm(x,y,z,o=4){ let a=.5,f=1,r=0; for(let i=0;i<o;i++){ r+=a*noise3(x*f,y*f,z*f); f*=2.03; a*=.5; } return r; }
function displace(geo, amp, freq, oct=4, seed=0, mask){
  const p=geo.attributes.position, n=new THREE.Vector3(), v=new THREE.Vector3();
  geo.computeVertexNormals(); const nr=geo.attributes.normal;
  for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); n.fromBufferAttribute(nr,i);
    const k = mask?mask(v):1; const d = fbm(v.x*freq+seed, v.y*freq+seed*1.7, v.z*freq-seed, oct)*amp*k;
    p.setXYZ(i, v.x+n.x*d, v.y+n.y*d, v.z+n.z*d); }
  p.needsUpdate=true; geo.computeVertexNormals(); return geo;
}
function noiseCanvas(w,h,{base='#888',dots=0,dotCol='#000',dotR=[1,3],alpha=.3,seed=1}={}){
  return (g)=>{ g.fillStyle=base; g.fillRect(0,0,w,h); const r=rng(seed);
    for(let i=0;i<dots;i++){ g.globalAlpha=alpha*r(); g.fillStyle=dotCol; g.beginPath(); g.arc(r()*w,r()*h,dotR[0]+r()*(dotR[1]-dotR[0]),0,7); g.fill(); } g.globalAlpha=1; };
}

function petalGeometry(o){
  const { len=1, wid=.4, segL=16, segW=8, profile=(t)=>Math.pow(Math.sin(Math.PI*Math.min(1,t*.92+.08)),.75),
    cup=.15, curl=.15, droop=0, frill=0, frillFreq=10, frillTip=false, twist=0, base='#ffffff', tip='#ffffff', edge=null, seed=1 } = o;
  const pos=[], col=[], uv=[], idx=[]; const cb=C(base), ct=C(tip), ce=edge?C(edge):null, tmp=new THREE.Color();
  for(let i=0;i<=segL;i++){ const t=i/segL; const w=wid*profile(t);
    for(let j=0;j<=segW;j++){ const u=j/segW-.5;
      let x=t*len, z=u*w, y=cup*w*(4*u*u) + curl*len*t*t - droop*len*t*t;
      if(frill){ const e=frillTip ? Math.pow(t,3)*(.6+.4*Math.abs(2*u)) : Math.pow(Math.abs(2*u),2)*.7 + Math.pow(t,6); y += frill*Math.sin(frillFreq*(u*3.1+t*1.7)+seed)*e + frill*.6*noise3(u*9,t*9,seed)*e; }
      if(twist){ const a=twist*t; const yy=y*Math.cos(a)-z*Math.sin(a), zz=y*Math.sin(a)+z*Math.cos(a); y=yy; z=zz; }
      pos.push(x,y,z); uv.push(j/segW,t);
      tmp.copy(cb).lerp(ct, Math.pow(t,.8)); if(ce) tmp.lerp(ce, Math.pow(Math.abs(2*u),3)*.6*t);
      col.push(tmp.r,tmp.g,tmp.b);
    } }
  for(let i=0;i<segL;i++)for(let j=0;j<segW;j++){ const a=i*(segW+1)+j, b=a+segW+1; idx.push(a,b,a+1, b,b+1,a+1); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
function petalMat(o={}){ return new THREE.MeshPhysicalMaterial(Object.assign({ vertexColors:true, side:THREE.DoubleSide, roughness:.5, sheen:1, sheenRoughness:.5, sheenColor:C('#ffffff'), }, o)); }
function place(mesh, {yaw=0, elev=0, roll=0, x=0, y=0}={}){ const g=new THREE.Group(); g.rotation.y=yaw; g.position.y=y; mesh.rotation.z=elev; mesh.rotation.x=roll; mesh.position.x=x; g.add(mesh); return g; }
function stemCurve(pts){ return new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p))); }
function tube(curve, r, mat, seg=48){ return new THREE.Mesh(new THREE.TubeGeometry(curve, seg, r, 8, false), mat); }
// 沿莖生長的葉片（InstancedMesh）
function leavesAlong(curve, geo, mat, { count=20, perNode=2, elev=.9, yawStep=Math.PI/2, from=.1, to=.98, scale=(t)=>1, jitter=.1, seed=3 }={}){
  const n=count*perNode, im=new THREE.InstancedMesh(geo, mat, n); const r=rng(seed);
  const up=new THREE.Vector3(0,1,0), q=new THREE.Quaternion(), m=new THREE.Matrix4(), e=new THREE.Euler(), qq=new THREE.Quaternion(), s=new THREE.Vector3();
  let k=0;
  for(let i=0;i<count;i++){ const t=from+(to-from)*i/(count-1||1); const p=curve.getPointAt(t), tg=curve.getTangentAt(t);
    q.setFromUnitVectors(up, tg);
    for(let j=0;j<perNode;j++){ const yaw=i*yawStep + j*2*Math.PI/perNode + (r()-.5)*jitter*3;
      e.set(0,yaw,0); qq.setFromEuler(e); const q2=q.clone().multiply(qq);
      e.set(0,0,elev+(r()-.5)*jitter); qq.setFromEuler(e); q2.multiply(qq);
      const sc=scale(t)*(1+(r()-.5)*jitter); s.set(sc,sc,sc); m.compose(p,q2,s); im.setMatrixAt(k++,m); } }
  im.instanceMatrix.needsUpdate=true; return im;
}
function fitTo(group, size){ const b=new THREE.Box3().setFromObject(group), s=new THREE.Vector3(), c=new THREE.Vector3(); b.getSize(s); b.getCenter(c);
  const k=size/Math.max(s.x,s.y,s.z); const wrap=new THREE.Group(); group.position.sub(c); wrap.add(group); wrap.scale.setScalar(k); return wrap; }


const windU = { value:0 };
function windMaterial(opts, amp=1){
  const m=new THREE.MeshStandardMaterial(Object.assign({ color:0xffffff, vertexColors:true, roughness:.75, side:THREE.DoubleSide }, opts));
  m.onBeforeCompile=(sh)=>{ sh.uniforms.uWind=windU; sh.vertexShader='uniform float uWind;\n'+sh.vertexShader.replace('#include <begin_vertex>',
    `#include <begin_vertex>
     vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
     float gust = sin(uWind*.6 + ip.x*.05)*.5+.5;
     float sway = (sin(uWind*1.7 + ip.x*.35 + ip.z*.22) * .6 + sin(uWind*3.1 + ip.z*.7 + ip.x*.2)*.25) * (.5+gust) * ${amp.toFixed(3)};
     float hh = max(position.y,0.); transformed.x += sway * hh*hh * .28; transformed.z += sway*hh*hh*.12;`); };
  m.customProgramCacheKey=()=>'wind'+amp;
  return m;
}

// ---------- 天空（共用 GLSL）：雨後清晨的霧光 ----------
const SKY_GLSL = `
uniform vec3 uZenith, uHorizon, uSunGlow, uSunDir, uSunCol;
float h3(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm3(vec3 p){ float a=.5,r=0.; for(int i=0;i<5;i++){ r+=a*vn(p); p*=2.02; a*=.5; } return r; }
vec3 skyColor(vec3 d){
  float h = max(d.y, -0.05);
  vec3 c = mix(uHorizon, uZenith, pow(smoothstep(-.02, .55, h), .8));
  float s = max(dot(d, uSunDir), 0.);
  c += uSunGlow * (pow(s, 5.)*.45 + pow(s, 40.)*.8);
  c += uSunCol * smoothstep(.9993, .9998, s) * 12.;
  vec2 q = d.xz/(d.y+.18);
  float cl = smoothstep(.45, .85, fbm3(vec3(q*1.2, 7.))) * smoothstep(.02,.15,d.y);
  c = mix(c, mix(vec3(.93,.94,.92), uSunGlow+.35, pow(s,3.)), cl*.55);
  return c;
}`;
function skyMaterial(){
  return new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{ uZenith:{value:SCENE_CFG.zenith}, uHorizon:{value:SCENE_CFG.horizon}, uSunGlow:{value:SCENE_CFG.sunGlow}, uSunDir:{value:SCENE_CFG.sunDir}, uSunCol:{value:SCENE_CFG.sunColor} },
    vertexShader:`varying vec3 vD; void main(){ vD = normalize(position); vec4 p = projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position = p.xyww; }`,
    fragmentShader: SKY_GLSL + `varying vec3 vD; void main(){ gl_FragColor = vec4(skyColor(normalize(vD)),1.); }`
  });
}

// ---------- 地形：森林地面，遠處緩緩升起 ----------
function terrainH(x,z){
  const d=Math.hypot(x,z);
  return -1.25 + fbm(x*.05,0,z*.05,4)*1.6*Math.min(1,Math.max(0,d-8)/14) + Math.pow(Math.max(0,d-40)/120,1.6)*14;
}

// ---------- 蕨葉（羽狀複葉）幾何：主軸拱起、兩側羽片由大到小 ----------
function frondGeometry({ len=3, pinnae=26, pinnaLen=.7, pinnaWid=.13, arch=.55, lobes=true, seed=1, droop=0, seg=null, TS=14, RS=3 }={}){
  const parts=[]; const r=rng(seed);
  const pt=(t)=>new THREE.Vector3(len*(t*.42 + t*t*arch*.75), len*(Math.sin(t*Math.PI*.5)*.95 - t*t*(arch*.55+droop)), 0);
  const cv=new THREE.CatmullRomCurve3([0,.15,.3,.45,.6,.75,.9,1].map(pt));
  const rach=new THREE.TubeGeometry(cv, TS, len*.012, RS, false);
  { const p=rach.attributes.position; for(let i=0;i<=TS;i++){ const c=cv.getPointAt(i/TS); const k=1-.75*(i/TS); for(let j=0;j<=RS;j++){ const id=i*(RS+1)+j; p.setXYZ(id, c.x+(p.getX(id)-c.x)*k, c.y+(p.getY(id)-c.y)*k, c.z+(p.getZ(id)-c.z)*k); } } rach.computeVertexNormals(); }
  rach.deleteAttribute('uv'); const rc=new Float32Array(rach.attributes.position.count*3); for(let i=0;i<rc.length;i+=3){ rc[i]=.42; rc[i+1]=.5; rc[i+2]=.24; } rach.setAttribute('color',new THREE.BufferAttribute(rc,3)); parts.push(rach);
  const up=new THREE.Vector3(0,0,1);
  for(let i=0;i<pinnae;i++){ const t=.12+.86*(i/(pinnae-1)); const p=cv.getPointAt(t), tg=cv.getTangentAt(t);
    const sizeK = Math.sin(Math.PI*Math.min(1,(t-.05)*1.05))*.85+.15;
    for(const side of [-1,1]){
      const g=petalGeometry({ len:pinnaLen*sizeK*(.9+r()*.2), wid:pinnaWid*sizeK, segL:seg||(lobes?7:4), segW:2, cup:.12, curl:-.05, frill:lobes?.018:0, frillFreq:lobes?22:6, frillTip:false,
        profile:(u)=>Math.pow(Math.sin(Math.PI*Math.min(1,u*.9+.1)),.6)*(1-.55*u), base:'#ffffff', tip:'#f4f8ec', seed:i*2+(side>0?1:0) });
      g.deleteAttribute('uv');
      // 羽片沿 +X 生長：轉到與主軸垂直的 ±Z 方向，並稍微朝葉尖傾斜
      const m=new THREE.Matrix4(); const q=new THREE.Quaternion();
      const outDir=new THREE.Vector3().crossVectors(tg, new THREE.Vector3(0,0,1)).normalize(); // 平面內法向（不用）
      const dir=new THREE.Vector3(0,0,side).addScaledVector(tg,.35).normalize();
      q.setFromUnitVectors(new THREE.Vector3(1,0,0), dir);
      const roll=new THREE.Quaternion().setFromAxisAngle(dir, side*.25); q.premultiply(roll);
      m.compose(p, q, new THREE.Vector3(1,1,1)); g.applyMatrix4(m); parts.push(g); } }
  return mergeGeometries(parts.map(g=>g.index?g.toNonIndexed():g));
}

// ---------- 環境（畫面、反射探針與 PMREM 共用） ----------
function buildWorld(target, detailed){
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 64, 32), skyMaterial()); sky.renderOrder=-10; sky.frustumCulled=false; target.add(sky);
  // 森林地面：泥土、青苔，去年殘留的少量深色落葉
  const ring = new THREE.RingGeometry(0, 260, detailed?150:50, detailed?80:24); ring.rotateX(-Math.PI/2);
  const rp=ring.attributes.position, col=[]; const cSoil=C('#54442f'), cMoss=C('#4f6a2a'), cLeaf=C('#5e4a2c'), tmp=new THREE.Color();
  for(let i=0;i<rp.count;i++){ const x=rp.getX(i), z=rp.getZ(i); rp.setY(i, terrainH(x,z));
    const n=fbm(x*.06,2,z*.06,3), n2=fbm(x*.15,5,z*.15,2); tmp.copy(cSoil).lerp(cMoss, Math.min(1,Math.max(0,n*1.6+.78))).lerp(cLeaf, Math.max(0,n2*1.5)*.22); col.push(tmp.r,tmp.g,tmp.b); }
  ring.setAttribute('color', new THREE.Float32BufferAttribute(col,3)); ring.computeVertexNormals();
  const floorTex=canvasTex(1024,1024,(g,w,h)=>{ g.fillStyle='#7c8656'; g.fillRect(0,0,w,h); const r=rng(31);
    for(let i=0;i<14000;i++){ g.fillStyle=`rgba(${r()<.5?'60,45,30':'150,135,110'},${r()*.3})`; g.fillRect(r()*w,r()*h,1+r()*3,1+r()*2); }
    const leafCols=['#6e4e2c','#5a4228','#7a5a34','#4e3e26','#665634','#5a5030'];
    for(let i=0;i<380;i++){ const x=r()*w, y=r()*h, s=6+r()*16, a=r()*6.28; g.save(); g.translate(x,y); g.rotate(a); g.fillStyle=leafCols[(r()*leafCols.length)|0]; g.globalAlpha=.55+r()*.4;
      g.beginPath(); g.moveTo(-s,0); g.quadraticCurveTo(0,-s*.45,s,0); g.quadraticCurveTo(0,s*.45,-s,0); g.fill(); g.globalAlpha=.4; g.strokeStyle='rgba(60,35,15,.6)'; g.lineWidth=.8; g.beginPath(); g.moveTo(-s,0); g.lineTo(s,0); g.stroke(); g.restore(); }
    g.globalAlpha=1; for(let i=0;i<520;i++){ g.fillStyle=`rgba(${80+r()*40|0},${115+r()*45|0},${40},${.25+r()*.4})`; g.beginPath(); g.ellipse(r()*w,r()*h,6+r()*28,4+r()*16,r()*3,0,7); g.fill(); }
    for(let i=0;i<120;i++){ g.strokeStyle=`rgba(70,50,30,${.3+r()*.4})`; g.lineWidth=1+r()*2; g.beginPath(); let x=r()*w,y=r()*h; g.moveTo(x,y); for(let k=0;k<4;k++){ x+=(r()-.5)*40; y+=(r()-.5)*40; g.lineTo(x,y);} g.stroke(); } });
  floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping; floorTex.repeat.set(80,80);
  const ground = new THREE.Mesh(ring, new THREE.MeshStandardMaterial({ vertexColors:true, map:floorTex, bumpMap:floorTex, bumpScale:1.6, roughness:.9 }));
  ground.receiveShadow=true; target.add(ground);
  if(!detailed){ // 反射探針用：遠景樹幹剪影
    const tm=new THREE.MeshStandardMaterial({ color:C('#3a3328'), roughness:.9 }); const r=rng(3);
    for(let i=0;i<40;i++){ const a=r()*6.28, d=70+r()*80; const t=new THREE.Mesh(new THREE.CylinderGeometry(.6,1.1,40,8),tm); t.position.set(Math.cos(a)*d, terrainH(Math.cos(a)*d,Math.sin(a)*d)+20, Math.sin(a)*d); target.add(t); }
    const fm=new THREE.MeshStandardMaterial({ color:C('#2e4426'), roughness:.9 }); for(let i=0;i<60;i++){ const a=r()*6.28, d=70+r()*80; const s=new THREE.Mesh(new THREE.SphereGeometry(6+r()*5,10,8),fm); s.position.set(Math.cos(a)*d, 22+r()*14, Math.sin(a)*d); target.add(s); }
    return { sky, ground };
  }

  const r=rng(5); const V=THREE.Vector3;
  const barkTex=canvasTex(256,512,(g,w,h)=>{ g.fillStyle='#5d5245'; g.fillRect(0,0,w,h); const rr=rng(9);
    for(let i=0;i<180;i++){ g.strokeStyle=`rgba(${rr()<.55?'30,25,20':'140,132,115'},${.2+rr()*.45})`; g.lineWidth=1+rr()*4; g.beginPath(); let x=rr()*w; g.moveTo(x,0); for(let y=0;y<=h;y+=18){ x+=(rr()-.5)*7; g.lineTo(x,y);} g.stroke(); }
    for(let i=0;i<120;i++){ g.fillStyle=`rgba(${90+rr()*40|0},${120+rr()*40|0},${60},${.15+rr()*.35})`; g.beginPath(); g.ellipse(rr()*w,rr()*h,3+rr()*12,6+rr()*30,0,0,7); g.fill(); } });
  barkTex.wrapS=barkTex.wrapT=THREE.RepeatWrapping; barkTex.repeat.set(1,4);
  const barkM=new THREE.MeshStandardMaterial({ map:barkTex, bumpMap:barkTex, bumpScale:2.5, roughness:.95 });
  const branches=[];
  const tubeTaper=(pts,rad,tipK,seg=8,rs=7)=>{ const cv=new THREE.CatmullRomCurve3(pts); const g=new THREE.TubeGeometry(cv,seg,rad,rs,false); const p=g.attributes.position;
    for(let i=0;i<=seg;i++){ const c=cv.getPointAt(i/seg); const k=1-(1-tipK)*(i/seg); for(let j=0;j<=rs;j++){ const idx=i*(rs+1)+j; p.setXYZ(idx, c.x+(p.getX(idx)-c.x)*k, c.y+(p.getY(idx)-c.y)*k, c.z+(p.getZ(idx)-c.z)*k); } }
    g.computeVertexNormals(); branches.push(g); return cv; };
  const inst={}; const addI=(key,geo,m4,color)=>{ (inst[key]||(inst[key]={geo,xf:[],cl:[]})).xf.push(m4); inst[key].cl.push(color); };
  const m4=()=>new THREE.Matrix4(); const q=new THREE.Quaternion(), e=new THREE.Euler(), sc=new V();
  const placeRing=(minD,maxD,count,fn)=>{ for(let i=0;i<count;i++){ const a=r()*6.28, d=minD+r()*(maxD-minD); const x=Math.cos(a)*d, z=Math.sin(a)*d; fn(new V(x,terrainH(x,z)-.15,z), r(), a); } };

  // 雪松：分層水平枝，枝上成簇的針葉
  const tuft=(()=>{ const parts=[]; for(let i=0;i<5;i++){ const n=new THREE.CylinderGeometry(.01,.02,.6,3,1,true); n.translate(0,.3,0); n.rotateZ(.5+r()*.5); n.rotateY(i/5*6.28); n.deleteAttribute('uv'); parts.push(n.toNonIndexed()); }
    const g=mergeGeometries(parts); const c=new Float32Array(g.attributes.position.count*3).fill(1); g.setAttribute('color',new THREE.BufferAttribute(c,3)); return g; })();
  // 主枝從樹幹表面長出、根部粗，先微微上揚、中段下垂、梢頭再翹起；每根主枝再分出水平小枝，針葉沿枝條成層覆蓋
  const cedarCols=['#2a4028','#33482c','#243a22','#3d5233'].map(C);
  const tuftAt=(c,s)=>{ e.set((r()-.5)*.5,r()*6.28,(r()-.5)*.5); q.setFromEuler(e); addI('tuft',tuft,m4().compose(c,q,sc.set(s,s*(.7+r()*.4),s)), cedarCols[(r()*4)|0]); };
  placeRing(62,140,72,(p,k)=>{ const H=26+k*14; const tR=1.1+k*.5; tubeTaper([p.clone(), p.clone().add(new V(.3,H*.5,.2)), p.clone().add(new V(-.2,H,.1))], tR, .12, 10, 9);
    const tiers=Math.floor(14+k*8); for(let i=0;i<tiers;i++){ const t=.32+.66*(i/tiers); const y=p.y+H*t; const R=(9+k*4)*(1-t*.75); const tr=tR*(1-.88*t);
      const nb=4; for(let b=0;b<nb;b++){ const a=b/nb*6.28+i*1.3+r()*.7; const dir=new V(Math.cos(a),0,Math.sin(a)); const b0=new V(p.x,y,p.z).addScaledVector(dir,tr*.6);
        const P=(u,lift)=>b0.clone().addScaledVector(dir,R*u).add(new V(0,lift,0));
        const pts=[b0.clone(), P(.3,R*.07), P(.62,R*.02), P(1,R*.09)]; const rad=Math.max(.06,tr*.45);
        const cv=tubeTaper(pts, rad, .22, 7, 5);
        const n=Math.floor(R*1.5); for(let j=0;j<n;j++){ const u=.12+.88*r(); const c=cv.getPointAt(u).add(new V((r()-.5)*R*.12,(r()-.2)*.5,(r()-.5)*R*.12)); tuftAt(c, 2.3+r()*1.3); }
        // 水平小枝
        for(let m=0;m<3;m++){ const u=.3+.55*(m/2)+(r()-.5)*.1; const st=cv.getPointAt(u); const side=(m%2?1:-1)*(.7+r()*.4);
          const sd=dir.clone().applyAxisAngle(new V(0,1,0),side); const L=R*.32*(1-u*.4);
          const sp=[st.clone(), st.clone().addScaledVector(sd,L*.5).add(new V(0,-.1,0)), st.clone().addScaledVector(sd,L).add(new V(0,.08,0))];
          const sc2=tubeTaper(sp, rad*.4, .3, 4, 4);
          for(let j=0;j<Math.floor(L*1.6)+2;j++){ tuftAt(sc2.getPointAt(.2+.8*r()).add(new V((r()-.5)*.4,(r()-.2)*.35,(r()-.5)*.4)), 2+r()*1.1); } } } }
  });

  // 樹蕨：纖維質樹幹往上漸粗，頂端有膨大的生長點；新葉斜向上再拱出，老葉低垂，最下面掛著一圈枯黃的舊葉
  const bigFrond=frondGeometry({ len:5.2, pinnae:24, pinnaLen:1.3, pinnaWid:.24, arch:.75, seed:7, seg:3 });
  const oldFrond=frondGeometry({ len:4.6, pinnae:22, pinnaLen:1.15, pinnaWid:.22, arch:1.0, droop:.7, seed:8, seg:3 });
  const deadFrond=frondGeometry({ len:3.0, pinnae:16, pinnaLen:.65, pinnaWid:.11, arch:.3, droop:.2, seed:12, seg:2, TS:8 });
  const fernBark=[];
  placeRing(56,80,38,(p,k)=>{ const H=4+k*4; const lx=(r()-.5)*.9, lz=(r()-.5)*.9;
    const pts=[p.clone(), p.clone().add(new V(lx*.25,H*.45,lz*.25)), p.clone().add(new V(lx*.7,H*.8,lz*.7)), p.clone().add(new V(lx,H,lz))];
    tubeTaper(pts, .5, 1.3, 10, 10);
    const top=pts[3].clone();
    const knob=new THREE.SphereGeometry(.68,12,9); knob.scale(1,.75,1); knob.translate(top.x,top.y+.05,top.z); fernBark.push(knob);
    const ring=(n,geo,key,tilt,off,dy,cols,sMin,sVar)=>{ for(let i=0;i<n;i++){ const a=i/n*6.28+r()*.35; const o=top.clone().add(new V(Math.cos(a)*off,dy,Math.sin(a)*off));
        e.set((r()-.5)*.15,-a,tilt+(r()-.5)*.18); q.setFromEuler(e); const s=sMin+r()*sVar; addI(key,geo,m4().compose(o,q,sc.set(s,s,s)), cols[(r()*cols.length)|0]); } };

    const bean=(seed,len)=>{ const geo=mergeVertices(new THREE.SphereGeometry(1,96,48)); const p=geo.attributes.position;
      for(let i=0;i<p.count;i++){ let x=p.getX(i), y=p.getY(i), z=p.getZ(i); const taper=1-.3*Math.max(0,x)**2; const bend=.12*(1-x*x);
        const ang=Math.atan2(z,y); const wr=Math.sin(ang*16 + fbm(x*2.5,seed,0,3)*7)*.5+.5; const k=1 - Math.pow(wr,3)*.09*(1-Math.abs(x)**4) - fbm(x*9,y*9+seed,z*9,2)*.03;
        p.setXYZ(i, x*len, (y*.36*taper*k)+bend, z*.42*taper*k); }
      geo.computeVertexNormals(); return geo; };
    [[0,0,0,0,1],[.45,-.18,.45,.9,.92],[-.5,-.22,.35,-.6,.88],[.2,-.28,-.5,2.2,.95],[-.15,.28,-.1,1.4,.85]].forEach(([x,y,z,a,l],i)=>{ const m=new THREE.Mesh(bean(i*3+1,l),mat); m.position.set(x,y,z); m.rotation.set((r()-.5)*.4,a,(r()-.5)*.5+(i===4?.3:0)); g.add(m); });
    // 表面析出的香豆素結晶（細白霜點）
    const fr=new THREE.InstancedMesh(new THREE.OctahedronGeometry(.012,0), new THREE.MeshStandardMaterial({ color:C('#f4efe2'), roughness:.3 }), 120);
    const mm=new THREE.Matrix4(); for(let i=0;i<120;i++){ const b=g.children[(r()*5)|0]; const v=new THREE.Vector3((r()-.5)*1.6,(r()<.5?1:-1)*.25,(r()-.5)*.5); v.applyEuler(b.rotation).add(b.position); mm.makeTranslation(v.x,v.y+.08,v.z); fr.setMatrixAt(i,mm); }
    g.add(fr);
    return g;
  },
};

const NOTES = [
  { tier:0, key:'juniper', zh:'杜松子', en:'Juniper Berries', d:'琴酒般清冽的松脂與漿果香，像走進清晨的針葉林。' },
  { tier:0, key:'lavender', zh:'薰衣草', en:'Lavender', d:'乾淨的草本花香，帶一點粉感，是芳香調的骨架。' },
  { tier:0, key:'pinkPepper', zh:'紅胡椒漿果', en:'Pink Pepper', d:'胡椒木結出的粉紅小漿果，辛香裡帶微甜果香，讓開場更明亮。' },
  { tier:1, key:'basil', zh:'羅勒', en:'Basil', d:'帶一點茴香感的綠葉，辛香又爽朗。' },
  { tier:1, key:'tarragon', zh:'龍蒿', en:'Tarragon', d:'細長的葉子散發微甜的大茴香氣息，綠意中帶辛香。' },
  { tier:1, key:'cedar', zh:'雪松', en:'Cedar', d:'乾燥、筆直的木質香，像雨後林間的樹幹。' },
  { tier:2, key:'vetiver', zh:'香根草', en:'Vetiver', d:'取自根部，有泥土、煙燻與濕潤大地的氣息。' },
  { tier:2, key:'sandalwood', zh:'檀香', en:'Sandalwood', d:'柔滑溫潤的乳香木質，讓尾韻圓潤綿長。' },
  { tier:2, key:'patchouli', zh:'廣藿香', en:'Patchouli', d:'乾燥葉片萃取的深沉泥土與苔蘚感，是西普調的靈魂。' },
  { tier:2, key:'tonka', zh:'零陵香豆', en:'Tonka Bean', d:'杏仁與乾草般的甜香，帶一點粉感，溫暖收尾。' },
];
const TIERS = [
  { zh:'前調', en:'TOP', y:12.7, r:8.6, speed:.10, color:'#a9b8e0' },
  { zh:'中調', en:'HEART', y:7.6, r:9.4, speed:-.075, color:'#9cc472' },
  { tier:2, zh:'後調', en:'BASE', y:2.6, r:8.9, speed:.06, color:'#c98a4a' },
];

const rings = TIERS.map(()=>{ const g=new THREE.Group(); scene.add(g); return g; });
const items = [];
NOTES.forEach((n)=>{
  const tierNotes = NOTES.filter(x=>x.tier===n.tier); const idx = tierNotes.indexOf(n); const T = TIERS[n.tier];
  const model = fitTo(BUILD[n.key](), 2.5);
  model.traverse(o=>{ if(o.isMesh){ o.userData.note=n; o.castShadow=true; } });
  const holder = new THREE.Group(); const spin = new THREE.Group(); spin.add(model); holder.add(spin);
  const a = idx/tierNotes.length*Math.PI*2 + n.tier*.45; holder.userData.a=a;
  const el=document.createElement('div'); el.className='lbl'; el.innerHTML=`<div class="z">${n.zh}</div><div class="e">${n.en}</div>`;
  el.setAttribute('role','button'); el.tabIndex=0; el.addEventListener('click',(ev)=>{ ev.stopPropagation(); show(n); }); el.addEventListener('keydown',(ev)=>{ if(ev.key==='Enter') show(n); });
  const lbl=new CSS2DObject(el); lbl.position.set(0,-1.55,0); holder.add(lbl);
  rings[n.tier].add(holder);
  items.push({ n, holder, spin, el, phase:Math.random()*6.28, focus:1 });
});
TIERS.forEach((T)=>{
  const ring=new THREE.Mesh(new THREE.TorusGeometry(T.r, .014, 6, 220), new THREE.MeshBasicMaterial({ color:C(T.color), transparent:true, opacity:.35, depthWrite:true, fog:false }));
  ring.rotation.x=Math.PI/2; ring.position.y=T.y; scene.add(ring); T.ringMesh=ring;
});
// 材質的環境反射強度微調
scene.traverse(o=>{ if(!o.isMesh) return; (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(m.isMeshStandardMaterial && m.envMapIntensity===1) m.envMapIntensity=.85; }); });

// ---------- 相機與互動 ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.06; controls.enablePan=false;
controls.minDistance=14; controls.maxDistance=80; controls.minPolarAngle=.95; controls.maxPolarAngle=1.52;
controls.autoRotate=!matchMedia('(prefers-reduced-motion: reduce)').matches; controls.autoRotateSpeed=.4;
const target=new THREE.Vector3(0,7.0,0), targetGoal=target.clone(); controls.target.copy(target);

function layout(k){
  items.forEach(it=>{ const T=TIERS[it.n.tier], a=it.holder.userData.a; it.holder.position.set(Math.cos(a)*T.r*k, T.y, Math.sin(a)*T.r*k); });
  TIERS.forEach(T=>T.ringMesh.scale.setScalar(k));
}
const RUNWAY = matchMedia('(pointer:coarse)').matches ? {t:110, b:150} : {t:0, b:0};   // 狀態列、網址列底下多畫的高度
function frame(){
  const w=innerWidth, h=innerHeight, H=h+RUNWAY.t+RUNWAY.b, rs=document.documentElement.style;
  rs.setProperty('--vh',h+'px'); rs.setProperty('--bt',RUNWAY.t+'px'); rs.setProperty('--bb',RUNWAY.b+'px');
  renderer.setSize(w,H); labelRenderer.setSize(w,H); camera.aspect=w/h;
  if(RUNWAY.t||RUNWAY.b) camera.setViewOffset(w,h,0,-RUNWAY.t,w,H); else camera.clearViewOffset();
  const dp=renderer.getPixelRatio(); sceneRT.setSize(Math.floor(w*dp), Math.floor(H*dp)); outRT.setSize(Math.floor(w*dp), Math.floor(H*dp)); outQuad.material.uniforms.uRes.value.set(Math.floor(w*dp), Math.floor(H*dp)); dofRT.setSize(Math.floor(w*dp), Math.floor(H*dp)); dofQuad.material.uniforms.uRes.value.set(Math.floor(w*dp), Math.floor(H*dp)); dofQuad.material.uniforms.uMaxR.value=DOF.maxR*dp;
  const k=THREE.MathUtils.clamp(camera.aspect*1.25,.6,1); layout(k);
  const vf=THREE.MathUtils.degToRad(camera.fov)/2, hf=Math.atan(Math.tan(vf)*camera.aspect);
  const dist=Math.max(10.6/Math.tan(vf), (9.4*k+1.3)/Math.tan(hf));
  camera.position.set(dist*.18, target.y+dist*.1, dist); camera.updateProjectionMatrix(); window.scrollTo(0,RUNWAY.t); controls.maxDistance=Math.max(56,dist*1.08); controls.minDistance=16;
}
frame(); addEventListener('resize', frame);
window.__dbg={camera,controls,target,targetGoal,THREE,items,bottle,rings,renderer,scene};

// 香調圖例
const tiersEl=document.getElementById('tiers'); let focusTier=-1;
TIERS.forEach((T,i)=>{ const b=document.createElement('button'); b.type='button'; b.className='tier'; b.style.setProperty('--c',T.color);
  b.innerHTML=`<span class="dot"></span><b>${T.zh}</b><span>${NOTES.filter(n=>n.tier===i).map(n=>n.zh).join('・')}</span>`;
  b.addEventListener('click',()=>{ focusTier = focusTier===i?-1:i; [...tiersEl.children].forEach((c,k)=>c.classList.toggle('on',k===focusTier)); targetGoal.y = focusTier<0?7.0:TIERS[i].y; });
  tiersEl.appendChild(b); });

// 點選香材
const card=document.getElementById('card'), ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let down=null, picked=null;
renderer.domElement.addEventListener('pointerdown',e=>{ down=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{ if(!down) return; const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]); down=null; if(moved>6) return;
  const cr=renderer.domElement.getBoundingClientRect(); ptr.set((e.clientX-cr.left)/cr.width*2-1, -((e.clientY-cr.top)/cr.height)*2+1); ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(rings,true).find(h=>h.object.userData.note);
  if(hit) show(hit.object.userData.note); else hide(); });
function show(n){ picked=n; const T=TIERS[n.tier]; card.style.setProperty('--c',T.color);
  document.getElementById('card-k').textContent=`${T.zh} ${T.en}`;
  document.getElementById('card-n').innerHTML=`${n.zh}<span>${n.en}</span>`;
  document.getElementById('card-p').textContent=n.d; card.classList.add('show'); }
function hide(){ picked=null; card.classList.remove('show'); }
document.getElementById('card-x').addEventListener('click',hide);

// ---------- 動畫與合成 ----------
const clock=new THREE.Clock(); const tmpV=new THREE.Vector3(), camDir=new THREE.Vector3();
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pp = pollen.geometry.attributes.position; const pBase = pp.array.slice();
let first=true;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  clockU.value=t; windU.value = still?0:t;
  rings.forEach((g,i)=>{ if(!still) g.rotation.y += TIERS[i].speed*dt; });
  if(!still){ for(let i=0;i<pp.count;i++){ pp.array[i*3]=pBase[i*3]+Math.sin(t*.3+i)*.8; pp.array[i*3+1]=(pBase[i*3+1]+t*.25*((i%5)/5+.3))%18; pp.array[i*3+2]=pBase[i*3+2]+Math.cos(t*.25+i*1.3)*.8; } pp.needsUpdate=true; }
  if(!still) shafts.forEach(s=>{ s.m.opacity = s.base*(.7+.3*Math.sin(t*.35+s.ph)); });
  target.lerp(targetGoal, .05); controls.target.copy(target);
  camera.getWorldDirection(camDir);
  items.forEach(it=>{
    if(!still){ it.spin.rotation.y += dt*.35; it.spin.position.y = Math.sin(t*.9+it.phase)*.18; }
    const on = (focusTier<0 || it.n.tier===focusTier) && (!picked || picked===it.n);
    it.focus += ((on?1:.55) - it.focus)*.08; it.spin.scale.setScalar(.75+.25*it.focus + (picked===it.n?.15:0));
    it.holder.getWorldPosition(tmpV); const behind = tmpV.clone().sub(target).dot(camDir) > 1.5;
    it.el.style.opacity = (behind?.2:1) * (on?1:.35);
  });
  TIERS.forEach((T,i)=>{ T.ringMesh.material.opacity = (focusTier<0||focusTier===i)?.35:.08; });
  controls.update();
  camera.updateMatrixWorld(); uViewProj.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  // 1) 不含玻璃的畫面 → 貼圖（香水水體在這一步已自行折射背景）
  renderer.shadowMap.needsUpdate = true; camera.layers.set(0); renderer.setRenderTarget(sceneRT); renderer.render(scene,camera);
  // 2) 貼回螢幕（含深度）  3) 玻璃取樣第 1 步的畫面做第二層折射
  renderer.setRenderTarget(outRT); renderer.render(blitScene, blitCam);
  renderer.autoClear=false; camera.layers.set(1); renderer.render(scene,camera); renderer.autoClear=true; camera.layers.set(0);
  // 4) 多重取樣畫布 → 螢幕（色調映射 + FXAA 在這一步）
  // 5) 景深：焦點 = 鏡頭到注視點的距離
  dofQuad.material.uniforms.uFocus.value = tmpV.copy(controls.target).sub(camera.position).dot(camDir);
  renderer.setRenderTarget(dofRT); renderer.render(dofScene, blitCam);
  renderer.setRenderTarget(null); renderer.render(outScene, blitCam);
  labelRenderer.render(scene,camera);
  if(first){ first=false; const L=document.getElementById('loading'); setTimeout(()=>{ L.style.opacity=0; setTimeout(()=>L.remove(),700); },250); }
});

</script>
