<title>Morning Star・香境</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* 單一深色場景：破曉前的靛藍夜空、晨星與金線 */
  :root{
    color-scheme:dark;
    --bg:#06070d; --ink:#eeeef6; --ink-2:#bec1d4; --muted:#8a8eaa;
    --gold:#e2c68c; --gold-lt:#f0e2c0; --line:rgba(226,198,140,.3); --panel:rgba(8,10,22,.78);
    --serif:"Playfair Display","Noto Serif TC",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
  }
  /* iOS 26 Safari 會拿貼邊、滿版的 fixed 元素顏色把狀態列／網址列塗成色塊；這頁不用 fixed，
     改成上下各多畫一段（--bt／--bb）、開場捲到 --bt，讓狀態列與網址列底下透出真正的場景 */
  html,body{margin:0;background:var(--bg);color:var(--ink-2);font-family:var(--sans);overflow:hidden;}
  body{position:relative;height:calc(var(--vh,100vh) + var(--bt,0px) + var(--bb,0px));}
  #stage{position:absolute;left:0;top:0;width:100%;height:100%;}
  #stage canvas{display:block;touch-action:none;}
  .hud{position:absolute;pointer-events:none;z-index:5;}
  .hud *{pointer-events:auto;}
  .top{top:var(--bt,0px);left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 16px) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;}
  .back{white-space:nowrap;font-size:12.5px;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:6px 14px;background:var(--panel);backdrop-filter:blur(6px);}
  .back:hover,.back:focus-visible{color:var(--gold);border-color:var(--gold);outline:none;}
  .title{text-align:right;text-shadow:0 1px 12px rgba(0,0,0,.7),0 0 3px rgba(0,0,0,.45);}
  .brand{font-family:var(--serif);font-size:10.5px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;}
  .name{font-family:var(--serif);font-size:30px;color:var(--ink);line-height:1.1;margin-top:4px;}
  .meta{font-size:11.5px;color:#efe6d2;line-height:1.6;margin-top:4px;letter-spacing:.5px;}
  .tiers{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(var(--bb,0px) + env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:6px;}
  .tier{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);padding:6px 12px 6px 8px;border-radius:18px;border:1px solid transparent;background:var(--panel);backdrop-filter:blur(6px);}
  .tier b{font-family:var(--serif);font-weight:500;color:var(--ink);font-size:13px;letter-spacing:1px;}
  .tier .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);}
  .tier.on{border-color:var(--c);}
  .tier:focus-visible{outline:1px solid var(--gold);}
  .hint{right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--bb,0px) + env(safe-area-inset-bottom,0px) + 22px);font-size:11px;color:var(--muted);text-align:right;line-height:1.7;max-width:46vw;}
  .card{position:absolute;left:50%;bottom:calc(var(--bb,0px) + env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,20px);opacity:0;transition:opacity .25s,transform .25s;
    width:min(360px,calc(100vw - 36px));background:rgba(8,10,22,.9);border:1px solid var(--line);border-radius:16px;padding:16px 18px;z-index:6;backdrop-filter:blur(8px);pointer-events:none;}
  .card.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  .card .k{font-size:10.5px;letter-spacing:3px;color:var(--c,var(--gold));}
  .card .n{font-family:var(--serif);font-size:22px;color:var(--ink);margin-top:4px;}
  .card .n span{font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-left:8px;}
  .card p{margin:8px 0 0;font-size:13px;line-height:1.7;color:var(--ink-2);}
  .card button{all:unset;position:absolute;top:10px;right:12px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:4px;}
  .card.show ~ .tiers,.card.show ~ .hint{opacity:0;pointer-events:none;}
  .lbl{font-family:var(--sans);text-align:center;white-space:nowrap;transition:opacity .3s;pointer-events:auto;cursor:pointer;background:rgba(8,10,22,.55);padding:5px 11px 6px;border-radius:10px;backdrop-filter:blur(3px);}
  .lbl .z{font-size:12.5px;color:var(--ink);letter-spacing:1px;}
  .lbl .e{font-size:9.5px;color:var(--gold-lt);letter-spacing:1.5px;text-transform:uppercase;opacity:.8;}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:9;background:var(--bg);transition:opacity .6s;}
  #loading .brand{font-size:11px}
  #loading .bar{width:120px;height:1px;background:var(--line);overflow:hidden;position:relative;}
  #loading .bar::after{content:"";position:absolute;inset:0;width:40%;background:var(--gold);animation:ld 1.2s ease-in-out infinite;}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  #err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;background:var(--bg);color:var(--ink-2);font-size:14px;line-height:1.8;}
  @media (max-width:520px){ .name{font-size:24px} .hint{display:none} }
  @media (prefers-reduced-motion:reduce){ #loading .bar::after{animation:none} }
</style>

</script>

</div>

// ---------- 場景設定：依香水的季節、時段與品牌故事 ----------
// Liquides Imaginaires Morning Star（2024，Louise Turner）。品牌說：破曉之初住著兩位光之兄弟——破曉使者 Éosphoros（Phosphoros，
// 手持火炬、每天清晨為母親 Eos 的馬車引路的「光之使者」）與黃昏守護者 Hesperos。為了宇宙的和諧，他們的道路永遠無法交會；
// 神明被他們感動，讓他們在極少數的時刻合而為一，成為同一顆星——晨星（金星）。品牌要的是破曉與黃昏的雙重性、古代神話與未來感。
// Fragrantica 投票：冬秋、日夜皆宜 → 晚秋入冬、日出前的高山湖：東邊天際是破曉的金粉色，金星低懸在地平線上；
// 西邊還是夜，滿天星斗與銀河，地平線上一道粉紫色的「金星帶」（晨昏時出現在太陽對面天空的光帶）。
// 湖面靜得像鏡子，倒映星空與晨光；瓶子立在伸進湖裡的一塊花崗岩岬角上，四周是覆霜的草與雪松林（後調雪松）。
// 台座是一塊青金石圓盤：深藍裡帶金色黃鐵礦星點，金線鑲著金星八年的「五瓣玫瑰」軌跡；旁邊一只青銅三足香爐燃著乳香，是 Phosphoros 的火炬。
const dirAzAlt=(az,alt)=>{ const a=THREE.MathUtils.degToRad(az), e=THREE.MathUtils.degToRad(alt); return new THREE.Vector3(-Math.sin(a)*Math.cos(e), Math.sin(e), -Math.cos(a)*Math.cos(e)); };   // az：從 -Z（東）往 -X 量的方位角
const SCENE_CFG = {
  sunDir: dirAzAlt(23,-9),                                   // 太陽還在地平線下 9°（航海曙暮光）
  venusDir: dirAzAlt(15.5,4.6),                              // 金星：預設視角裡在瓶蓋左上方
  sunColor: C('#b8b0e0'), sunIntensity: .55,                  // 主光：東邊天際的曙光（偏冷的粉紫），沒有直射的太陽
  zenith: C('#0b1230'), horizon: C('#1c2a55'), sunGlow: C('#ff9a5a'), horizonWarm: C('#ffb27a'),
  haze: C('#141b38'),
  waterDeep: C('#03060f'), waterShallow: C('#0c1424'),
  glassAbsorb: new THREE.Vector3(.02,.02,.02),
};
// 銀河：從西南方的地平線陡陡地升起（銀心在地平線上方不遠），另一端落在東北方被曙光蓋過
const MW = (()=>{ const H=dirAzAlt(212,0), P=new THREE.Vector3(-H.z,0,H.x); const T=new THREE.Vector3(0,1,0).multiplyScalar(Math.cos(.38)).addScaledVector(P,Math.sin(.38)).normalize();
  const N=new THREE.Vector3().crossVectors(H,T).normalize(); const GC=H.clone().multiplyScalar(Math.cos(.16)).addScaledVector(T,Math.sin(.16)).normalize(); return { N, GC }; })();
const WATER_Y = -3.2;
// 湖：以 (0,-118) 為中心、半徑約 165 的高山湖；瓶子所在的花崗岩岬角從北岸（+Z）伸進湖裡，岬角尖端在瓶子後方約 9
const LAKE = { cx:0, cz:-118, R:165 };
const lakeR=(a)=>LAKE.R*(1 + .08*Math.sin(2*a+.7) + .05*Math.sin(3*a+2.1) + .035*Math.sin(5*a+.4) + .03*Math.sin(9*a+1.7));
function penSD(x,z){ // 岬角：從 A(0,48) 到 B(0,-1.5) 的膠囊，越往湖心越窄
  const ax=0, az=48, bx=0, bz=-1.5; const t=Math.min(1,Math.max(0,((x-ax)*(bx-ax)+(z-az)*(bz-az))/((bx-ax)**2+(bz-az)**2)));
  const px=ax+(bx-ax)*t, pz=az+(bz-az)*t; const r=7.6+(1-t)*(1-t)*24 + 1.6*Math.sin(z*.21+1.3) + 1.1*Math.sin(z*.47+x*.1);
  return Math.hypot(x-px,z-pz)-r; }
function landSD(x,z){ const dx=x-LAKE.cx, dz=z-LAKE.cz; const a=Math.atan2(dz,dx); const lk=Math.hypot(dx,dz)-lakeR(a); return Math.max(lk, -penSD(x,z)); }   // >0 陸地、<0 湖

  const s=t=>t*t*(3-2*t); const u=s(xf),v=s(yf),w=s(zf); let r=0;
  for(let a=0;a<2;a++)for(let b=0;b<2;b++)for(let c=0;c<2;c++){ r+=hash3(xi+a,yi+b,zi+c)*(a?u:1-u)*(b?v:1-v)*(c?w:1-w); }

  for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); n.fromBufferAttribute(nr,i);
    const k = mask?mask(v):1; const d = fbm(v.x*freq+seed, v.y*freq+seed*1.7, v.z*freq-seed, oct)*amp*k;

// 花瓣（沿 +X 生長，花瓣面朝 +Y）
function petalGeometry(o){
  const { len=1, wid=.4, segL=16, segW=8, profile=(t)=>Math.pow(Math.sin(Math.PI*Math.min(1,t*.92+.08)),.75),
    cup=.15, curl=.15, droop=0, frill=0, frillFreq=10, frillTip=false, twist=0, base='#ffffff', tip='#ffffff', edge=null, seed=1 } = o;
  const pos=[], col=[], uv=[], idx=[]; const cb=C(base), ct=C(tip), ce=edge?C(edge):null, tmp=new THREE.Color();
  for(let i=0;i<=segL;i++){ const t=i/segL; const w=wid*profile(t);
    for(let j=0;j<=segW;j++){ const u=j/segW-.5;
      let x=t*len, z=u*w, y=cup*w*(4*u*u) + curl*len*t*t - droop*len*t*t;
      if(frill){ const e=frillTip ? Math.pow(t,3)*(.6+.4*Math.abs(2*u)) : Math.pow(Math.abs(2*u),2)*.7 + Math.pow(t,6); y += frill*Math.sin(frillFreq*(u*3.1+t*1.7)+seed)*e + frill*.6*noise3(u*9,t*9,seed)*e; }
      if(twist){ const a=twist*t; const yy=y*Math.cos(a)-z*Math.sin(a), zz=y*Math.sin(a)+z*Math.cos(a); y=yy; z=zz; }
      pos.push(x,y,z); uv.push(j/segW,t);
      tmp.copy(cb).lerp(ct, Math.pow(t,.8)); if(ce) tmp.lerp(ce, Math.pow(Math.abs(2*u),3)*.6*t);
      col.push(tmp.r,tmp.g,tmp.b);
    } }
  for(let i=0;i<segL;i++)for(let j=0;j<segW;j++){ const a=i*(segW+1)+j, b=a+segW+1; idx.push(a,b,a+1, b,b+1,a+1); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
function petalMat(o={}){ return new THREE.MeshPhysicalMaterial(Object.assign({ vertexColors:true, side:THREE.DoubleSide, roughness:.5, sheen:1, sheenRoughness:.5, sheenColor:C('#ffffff'), }, o)); }
function place(mesh, {yaw=0, elev=0, roll=0, x=0, y=0}={}){ const g=new THREE.Group(); g.rotation.y=yaw; g.position.y=y; mesh.rotation.z=elev; mesh.rotation.x=roll; mesh.position.x=x; g.add(mesh); return g; }

// 沿莖生長的葉片（InstancedMesh）
function leavesAlong(curve, geo, mat, { count=20, perNode=2, elev=.9, yawStep=Math.PI/2, from=.1, to=.98, scale=(t)=>1, jitter=.1, seed=3 }={}){
  const n=count*perNode, im=new THREE.InstancedMesh(geo, mat, n); const r=rng(seed);
  const up=new THREE.Vector3(0,1,0), q=new THREE.Quaternion(), m=new THREE.Matrix4(), e=new THREE.Euler(), qq=new THREE.Quaternion(), s=new THREE.Vector3();
  let k=0;
  for(let i=0;i<count;i++){ const t=from+(to-from)*i/(count-1||1); const p=curve.getPointAt(t), tg=curve.getTangentAt(t);
    q.setFromUnitVectors(up, tg);
    for(let j=0;j<perNode;j++){ const yaw=i*yawStep + j*2*Math.PI/perNode + (r()-.5)*jitter*3;
      e.set(0,yaw,0); qq.setFromEuler(e); const q2=q.clone().multiply(qq);
      e.set(0,0,elev+(r()-.5)*jitter); qq.setFromEuler(e); q2.multiply(qq);
      const sc=scale(t)*(1+(r()-.5)*jitter); s.set(sc,sc,sc); m.compose(p,q2,s); im.setMatrixAt(k++,m); } }
  im.instanceMatrix.needsUpdate=true; return im;
}

  const k=size/Math.max(s.x,s.y,s.z); const wrap=new THREE.Group(); group.position.sub(c); wrap.add(group); wrap.scale.setScalar(k); return wrap; }


const windU = { value:0 };

  m.onBeforeCompile=(sh)=>{ sh.uniforms.uWind=windU; sh.vertexShader='uniform float uWind;\n'+sh.vertexShader.replace('#include <begin_vertex>',

// ---------- 天空（共用 GLSL）：日出前的天空。東邊（-Z）地平線是一道金橘到粉金的曙光，往上漸漸轉成淡青、深藍；
// 西邊（+Z）還是夜：地平線上是地影（深藍灰）與上方粉紫的「金星帶」，再往上是滿天星斗與銀河 ----------
const SKY_GLSL = `
uniform vec3 uSunDir, uVenusDir, uMWN, uMWC; uniform float uSkyT;
float h3(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm3(vec3 p){ float a=.5,r=0.; for(int i=0;i<5;i++){ r+=a*vn(p); p*=2.02; a*=.5; } return r; }
// 曙光：依「離太陽方位角的角度」與高度決定，越低越暖、越靠近太陽方位越亮
vec3 dawnGlow(vec3 d){
  float hp=max(d.y,0.);
  vec2 S=normalize(uSunDir.xz), D=normalize(d.xz+vec2(1e-5,0.));
  float A=acos(clamp(dot(D,S),-1.,1.));
  float wA=exp(-A*A/1.6), wN=exp(-A*A/.32);
  return vec3(1.,.27,.07)*exp(-hp/.028)*(.28*wA+.85*wN)
       + vec3(1.,.52,.27)*exp(-hp/.07)*(.18*wA+.45*wN)
       + vec3(.55,.55,.56)*exp(-hp/.16)*(.07*wA+.13*wN)
       + vec3(.2,.28,.46)*exp(-hp/.4)*(.07*wA+.05*wN);
}
vec3 skyColor(vec3 d){
  float h=d.y, hp=max(h,0.);
  vec3 c = mix(vec3(.02,.03,.068), vec3(.004,.0065,.019), pow(smoothstep(0.,.6,hp),.7));   // 夜空：地平線深藍、天頂近黑的靛藍
  vec3 dw = dawnGlow(d); c += dw;
  // 太陽對面的天空：貼著地平線的地影（深藍灰），上方一道粉紫的金星帶
  vec2 S=normalize(uSunDir.xz), D=normalize(d.xz+vec2(1e-5,0.));
  float B=3.14159-acos(clamp(dot(D,S),-1.,1.)); float wB=exp(-B*B/2.2);
  float belt=smoothstep(.03,.075,hp)*(1.-smoothstep(.1,.27,hp));

  c = mix(c, vec3(.014,.02,.045), (1.-smoothstep(0.,.05,hp))*wB*.6);
  // 銀河：沿銀道的一條光帶，中間有暗黑的塵埃帶，銀心附近偏暖、最亮
  float g=dot(d,uMWN); float band=exp(-g*g/.02);
  float cd=acos(clamp(dot(d,uMWC),-1.,1.)); float core=exp(-cd*cd/.28);
  vec3 q=d*5.;
  float n=fbm3(q*1.3+11.)*.65+fbm3(q*4.2+3.)*.35;
  float dust=smoothstep(.44,.7,fbm3(q*2.7+7.))*exp(-g*g/.004)*(.45+.55*core);
  float mw=band*(.25+n*1.1)*(1.-.85*dust)*(.32+1.5*core) + exp(-g*g/.0018)*core*.5*(1.-dust);
  float dl=dot(dw,vec3(.3,.5,.2)); float nightK=1.-smoothstep(.004,.07,dl);
  c += mix(vec3(.45,.52,.78), vec3(1.,.8,.6), core*.8)*mw*.02*nightK*smoothstep(-.01,.12,h);
  c += vec3(.006,.011,.005)*exp(-pow((hp-.07)/.05,2.))*nightK;                  // 夜空的氣輝：地平線上淡淡的綠
  float v=max(dot(d,uVenusDir),0.);
  c += vec3(1.,.92,.8)*(pow(v,9000.)*.9 + pow(v,900.)*.05 + pow(v,120.)*.012); // 金星周圍被大氣散開的光暈
  c = mix(c, vec3(.008,.01,.022), smoothstep(0.,-.1,h));
  return c;
}`;
const skyUniforms = ()=>({ uSunDir:{value:SCENE_CFG.sunDir}, uVenusDir:{value:SCENE_CFG.venusDir}, uMWN:{value:MW.N}, uMWC:{value:MW.GC}, uSkyT:clockU });
function skyMaterial(){
  return new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms: skyUniforms(),
    vertexShader:`varying vec3 vD; void main(){ vD = normalize(position); vec4 p = projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position = p.xyww; }`,
    fragmentShader: SKY_GLSL + `varying vec3 vD; void main(){ gl_FragColor = vec4(skyColor(normalize(vD)),1.); }`

// 星星：約一萬五千顆（銀河附近更密），亮度依星等分布，顏色由藍白到橙；越靠近曙光與地平線越淡，會輕輕閃爍
function starField(){
  const r=rng(1977); const N=9000, NM=6500, pos=[], att=[], col=[]; const v=new THREE.Vector3();
  const push=(d,b)=>{ pos.push(d.x*1400,d.y*1400,d.z*1400); const t=r(); const c=t<.12?[1,.72,.48]:t<.42?[1,.93,.82]:t<.86?[.92,.95,1]:[.72,.82,1]; col.push(...c); att.push(b, r()*6.28); };
  for(let i=0;i<N;i++){ const y=-.04+r()*1.04, a=r()*6.28, s=Math.sqrt(1-y*y); v.set(Math.cos(a)*s,y,Math.sin(a)*s);
    push(v, .07 + .22*Math.pow(r(),3) + 2.6*Math.pow(r(),14)); }
  for(let i=0;i<NM;i++){ const y=-.04+r()*1.04, a=r()*6.28, s=Math.sqrt(1-y*y); v.set(Math.cos(a)*s,y,Math.sin(a)*s); const g=v.dot(MW.N); if(Math.abs(g)>.16*Math.sqrt(r())) { i--; continue; }
    push(v, .05 + .12*Math.pow(r(),3) + .8*Math.pow(r(),18)); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('aB',new THREE.Float32BufferAttribute(att,2)); g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  const m=new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false,
    uniforms:Object.assign(skyUniforms(),{ uDPR:{value:DPR}, uStill:{value:0} }),
    vertexShader: SKY_GLSL + `attribute vec2 aB; attribute vec3 color; uniform float uDPR, uStill; varying vec3 vC; varying float vS;
      void main(){ vec3 d=normalize(position); float b=aB.x;
        vec3 dw=dawnGlow(d); float lum=dot(dw,vec3(.3,.5,.2));
        b *= exp(-lum*55.) * smoothstep(-.005,.09,d.y) * (1.-.55*exp(-d.y*14.));            // 曙光蓋過星星；地平線附近被大氣減光
        float tw=.5+.5*sin(uSkyT*(1.7+aB.y*.9)+aB.y*11.)*sin(uSkyT*(2.9+aB.y*.4)+aB.y*5.);
        b *= mix(1., .55+.75*tw, (.35+.65*exp(-d.y*6.))*(1.-uStill));                       // 閃爍：越低越明顯
        float s=clamp(1.3+1.6*sqrt(b),1.2,4.6);
        vS=s*uDPR; vC=color*b*(1.6/(s*s))*6.;
        vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position=p.xyww; gl_PointSize=vS; }`,
    fragmentShader:`varying vec3 vC; varying float vS; void main(){ vec2 q=gl_PointCoord*2.-1.; float r2=dot(q,q); float a=exp(-r2*4.); if(a<.01) discard; gl_FragColor=vec4(vC*a,1.); }` });
  const pts=new THREE.Points(g,m); pts.frustumCulled=false; pts.renderOrder=-9; return pts;
}
// 金星：極亮的一點，周圍一圈光暈與四道細細的繞射芒（呼應品牌那張星空廣告照）
function venusSprite(){
  const m=new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false,
    uniforms:{ uSkyT:clockU, uPulse:{value:0} },
    vertexShader:`varying vec2 vQ; void main(){ vQ=position.xy; vec4 c=modelViewMatrix*vec4(0.,0.,0.,1.); c.xy+=position.xy*vec2(length(modelMatrix[0].xyz)); vec4 p=projectionMatrix*c; gl_Position=p.xyww; }`,
    fragmentShader:`uniform float uSkyT, uPulse; varying vec2 vQ;
      void main(){ vec2 q=vQ; float r=length(q);
        float core=exp(-r*r/.00035)*28.;
        float halo=exp(-r*r/.006)*1.1 + exp(-r/.09)*.22 + exp(-r/.32)*.05;
        float rot=.35; vec2 p=mat2(cos(rot),-sin(rot),sin(rot),cos(rot))*q;
        float rays=(exp(-abs(p.y)/.0035)*exp(-abs(p.x)*5.5) + exp(-abs(p.x)/.0035)*exp(-abs(p.y)*5.5))*.9
                 + (exp(-abs(p.x+p.y)/.005)*exp(-abs(p.x-p.y)*9.) + exp(-abs(p.x-p.y)/.005)*exp(-abs(p.x+p.y)*9.))*.25;
        float tw=.92+.08*sin(uSkyT*3.1)*sin(uSkyT*1.7+1.);
        vec3 c=vec3(1.,.95,.86)*(core+halo*(1.+uPulse*.8)+rays*(.8+uPulse))*tw;
        gl_FragColor=vec4(c*smoothstep(1.,.8,r),1.); }` });
  const s=new THREE.Mesh(new THREE.PlaneGeometry(2,2), m); s.scale.setScalar(1300*Math.tan(THREE.MathUtils.degToRad(3.2))); s.position.copy(SCENE_CFG.venusDir).multiplyScalar(1300); s.frustumCulled=false; s.renderOrder=-8; return s;
}
// 湖面：幾乎無風的鏡面。倒影取自鏡像相機畫好的畫面（星空、晨光、遠山、雪松、瓶子），細微的漣漪把倒影輕輕扭動；
// 金星在水面上拉出一道閃爍的光路；越遠越貼近地平線的霧色
const reflU = { tRefl:{ value:null }, uReflMat:{ value:new THREE.Matrix4() }, uReflRes:{ value:new THREE.Vector2(2,2) } };
function waterMaterial(){
  return new THREE.ShaderMaterial({
    fog:false, transparent:false,
    uniforms:Object.assign(skyUniforms(), reflU, { uDeep:{value:SCENE_CFG.waterDeep} }),
    vertexShader:`varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
    fragmentShader: SKY_GLSL + `uniform sampler2D tRefl; uniform mat4 uReflMat; uniform vec2 uReflRes; uniform vec3 uDeep; varying vec3 vW;
      float wh(vec2 p, float t){ return fbm3(vec3(p.x*.8 + t*.25, p.y*.8, t*.3))*.65 + .35*fbm3(vec3(p*2.9 + vec2(-t*.4, t*.2), t*.5)); }
      void main(){
        float dist=length(vW.xz-cameraPosition.xz);
        vec2 p=vW.xz*.11; float t=uSkyT*.25; float e=.015;
        float hA=wh(p,t), hX=wh(p+vec2(e,0.),t), hZ=wh(p+vec2(0.,e),t);
        float amp=.022*(1.-smoothstep(40.,260.,dist)*.7);
        vec3 n=normalize(vec3(-(hX-hA)/e*amp, 1., -(hZ-hA)/e*amp));
        vec3 v=normalize(cameraPosition-vW);
        float fres=.02+.98*pow(1.-max(dot(n,v),0.),5.);
        vec4 rc=uReflMat*vec4(vW,1.); vec2 uv=rc.xy/rc.w;
        uv += n.xz*vec2(.6,.9)*(.06/(1.+dist*.02));
        vec2 px=1./uReflRes;
        vec3 refl=texture2D(tRefl,uv).rgb*.4 + (texture2D(tRefl,uv+vec2(px.x,0.)).rgb + texture2D(tRefl,uv-vec2(px.x,0.)).rgb + texture2D(tRefl,uv+vec2(0.,px.y*1.5)).rgb + texture2D(tRefl,uv-vec2(0.,px.y*1.5)).rgb)*.15;
        vec3 rd=reflect(-v,n); rd.y=abs(rd.y);
        if(uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.) refl=skyColor(rd);
        vec3 c=mix(uDeep, refl, clamp(fres*1.05,0.,1.)*.96);
        // 金星的光路：漣漪把它拉長成一道上下閃爍的亮線
        float vs=max(dot(rd,uVenusDir),0.); c += vec3(1.,.93,.82)*(pow(vs,6000.)*14. + pow(vs,700.)*.25)*fres*smoothstep(-.02,.02,uVenusDir.y);
        float dl=dot(dawnGlow(normalize(vec3(rd.x,.0,rd.z))),vec3(.3,.5,.2)); c += vec3(1.,.55,.3)*pow(max(dot(rd,normalize(vec3(uSunDir.x,.02,uSunDir.z))),0.),80.)*dl*.8*fres;
        // 遠處的湖面貼近地平線的天色（晨霧）
        vec3 hz=skyColor(normalize(vec3(-v.x,.012,-v.z)));
        c=mix(c, hz*.95, smoothstep(90.,330.,dist)*.55);
        gl_FragColor=vec4(c,1.);
        #include <colorspace_fragment>
      }`
  });
}
// ---------- 地形：瓶子立在一塊伸進湖裡的花崗岩岬角上；岬角是一道低矮、被冰河磨圓的岩背，往北（+Z）接上湖岸；
// 湖的四周是長著雪松林的山坡，坡上冒出一塊塊花崗岩崖，再往外是一層層的高山 ----------
const sstep=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
const DISC_T = .72;                        // 青金石圓盤厚度（盤面 = 瓶底 = 0）
const SLAB_TOP = -DISC_T;                  // 花崗岩台石的頂面
const GROUND_Y = -1.95;                    // 台石四周的地面
const CRAGS = [];   // 花崗岩丘在夜裡只剩一團黑影，不放（遠山已經夠了）
// 近處的雪松（岬角根部與北岸，離瓶子 57 以上：相機轉一圈不會鑽進樹冠）：[x, z, 高]
const CEDARS_NEAR = [ [-26,52,30], [28,58,27], [-8,58,33], [14,64,30], [-38,62,28], [40,70,30], [0,74,34] ];
function lakeOut(x,z){ const dx=x-LAKE.cx, dz=z-LAKE.cz; return Math.hypot(dx,dz)-lakeR(Math.atan2(dz,dx)); }   // 離湖岸（大圓）多遠：>0 在湖外

function buildWorld(target, detailed){

    for(let j=0;j<NA;j++){ const a=(j+(i%2)*.5)/NA*Math.PI*2; const x=Math.cos(a)*rr, z=Math.sin(a)*rr; const y=terrainH(x,z); pos.push(x,y,z);
      const s=landSD(x,z), lk=lakeOut(x,z), n=fbm(x*.07,2,z*.07,3), n2=fbm(x*.31,5,z*.31,2);

    for(let i=0;i<400;i++){ const a=r()*6.28, d=LAKE.R*.9+r()*120; const x=LAKE.cx+Math.cos(a)*d, z=LAKE.cz+Math.sin(a)*d; if(landSD(x,z)<2) continue; const c=new THREE.Mesh(new THREE.ConeGeometry(3,14,6),m); c.position.set(x,terrainH(x,z)+6,z); target.add(c); }

  const r=rng(5); const V=THREE.Vector3;

  const m4=()=>new THREE.Matrix4(); const q=new THREE.Quaternion(), e=new THREE.Euler(), sc=new V();

  const branches=[];
  const tubeTaper=(pts,rad,tipK,seg=8,rs=7,list=branches)=>{ const cv=new THREE.CatmullRomCurve3(pts); const g=new THREE.TubeGeometry(cv,seg,rad,rs,false); const p=g.attributes.position;

  const near=(x,z,pad=0)=>Math.hypot(x,z)<6.3+pad;                            // 台石四周留空

  // ---------- 雪松（近景）：灰褐龜裂的粗樹幹，枝條幾乎水平地一層層伸出、末端微微上揚；
  // 每根枝條上排著一簇簇藍綠色的針葉（雪松特有的短枝針葉束），整棵樹是一層層平平的「雲」 ----------
  const sprayCols=['#ffffff','#e8f0ee','#d8e4e2','#f0f4f0','#c8d8d4'].map(C);
  const cedarTrunks=[];
  const cedar=(bx,bz,H,seed,detail=true)=>{ const cr=rng(seed); const y0=terrainH(bx,bz)-.4; const R0=H*.034;

          const yaw=-Math.atan2(sd.z,sd.x)+(cr()-.5)*.8; e.set((cr()-.5)*.25, yaw, (cr()-.5)*.2+.05); q.setFromEuler(e); const s0=(.75+cr()*.5)*(1.1-.3*u)*(H/26)*(detail?1:1.55);
          addI('spray', sprayGeo, m4().compose(cp,q,sc.set(s0,s0*(.8+cr()*.4),s0)), sprayCols[(cr()*5)|0]); } }

      { const tip=cv.getPointAt(1); e.set(0,-Math.atan2(dir.z,dir.x),.1); q.setFromEuler(e); const s0=(1+cr()*.4)*(H/26); addI('spray', sprayGeo, m4().compose(tip.clone().add(new V(0,.08,0)),q,sc.set(s0,s0,s0)), sprayCols[(cr()*5)|0]); } }

  { const tierCrown=(()=>{ const parts=[]; for(let k=0;k<3;k++){ const y=.22+k*.25, rr=.95-k*.27; const g=new THREE.ConeGeometry(rr,.42,7,1,true); g.deleteAttribute('uv'); g.translate(0,y+.21,0);

    const fc=['#ffffff','#e4ecea','#cad8d4','#b8c8c4','#f0eee8','#a8b8b0','#d4dcd8'].map(C);
    for(let i=0;i<16000;i++){ const a=r()*6.28, d=40+Math.pow(r(),.75)*330; const x=Math.cos(a)*d, z=Math.sin(a)*d;
      const s=landSD(x,z); if(s<2.5) continue; const lk=lakeOut(x,z); if(lk<1 && Math.hypot(x,z)<75) continue; if(cragD(x,z)<1.5) continue;

  // ---------- 岬角上的花崗岩：冰河留下的大圓石，覆著霜與地衣 ----------
  { const bg=mergeVertices(new THREE.IcosahedronGeometry(1,2)); bg.deleteAttribute('normal'); bg.deleteAttribute('uv'); displace(bg,.22,1.0,3,11); displace(bg,.06,4.2,3,12);
    { const p=bg.attributes.position; for(let i=0;i<p.count;i++){ const y=p.getY(i); if(y<0) p.setY(i,y*.6); } } bg.computeVertexNormals(); sphUV(bg,1.5);
    const bc=['#9a9a9e','#8a8a90','#a6a2a0','#7e7e84','#928c8a'].map(C);

    for(let i=0;i<70;i++){ const z=-8+r()*60, x=(r()-.5)*40; const s=landSD(x,z); if(s<-.5||s>14) continue; if(near(x,z,1.5)) continue; const k=.6+Math.pow(r(),2)*2.2; if(Math.hypot(x,z)>24 && Math.hypot(x,z)<62) continue; spots.push([x,z,k]); }   // 相機繞行的那一圈（離瓶子 24～62）不放大石，免得擋在鏡頭前
    for(let i=0;i<120;i++){ const a=r()*6.28, d=LAKE.R*(.97+r()*.1); const x=LAKE.cx+Math.cos(a)*d, z=LAKE.cz+Math.sin(a)*d; const k=1+r()*3; if(Math.hypot(x,z)>220 || Math.hypot(x,z)<62) continue; spots.push([x,z,k]); }
    spots.forEach(([x,z,k])=>{ e.set((r()-.5)*.4,r()*6.28,(r()-.5)*.3); q.setFromEuler(e);

  { const pg=mergeVertices(new THREE.IcosahedronGeometry(1,2)); pg.deleteAttribute('normal'); pg.deleteAttribute('uv'); displace(pg,.08,1.5,2,3); pg.scale(1,.5,.8); pg.computeVertexNormals();
    const pc=['#7a7a7e','#6a6a70','#8a8682','#5e5e64','#848088'].map(C);
    for(let i=0;i<5200;i++){ const z=-11+r()*70, x=(r()-.5)*56; const s=landSD(x,z); if(s<-.6||s>2.4) continue; if(near(x,z,.5)) continue;

  // ---------- 覆霜的草：秋末的乾草（麥稈色、赭色），葉尖結著白霜 ----------
  const blade=(()=>{ const pos=[], col=[], idx=[]; const N=5;
    for(let i=0;i<=N;i++){ const t=i/N, w=.028*(1-t*.9), z=.32*t*t, y=t*.9; pos.push(-w,y,z, w,y,z); const c=.4+.6*t; col.push(c,c,c, c,c,c); }

  const grassCols=['#8a7a50','#9c8a5a','#7a6c48','#6c6a44','#a89464','#b8b4a8','#c8ccd0','#5c6440'].map(C);
  const vr=rng(909);

function hide(){ picked=null; card.classList.remove('show'); }
document.getElementById('card-x').addEventListener('click',hide);

// ---------- 動畫與合成 ----------
const clock=new THREE.Clock(); const tmpV=new THREE.Vector3(), camDir=new THREE.Vector3();
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
if(world.stars) world.stars.material.uniforms.uStill.value=still?1:0;
const pp = pollen.geometry.attributes.position; const pBase = pp.array.slice();
let first=true;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  clockU.value=t; windU.value = still?0:t;
  rings.forEach((g,i)=>{ if(!still) g.rotation.y += TIERS[i].speed*dt; });
  if(!still){ for(let i=0;i<pp.count;i++){ pp.array[i*3]=pBase[i*3]+Math.sin(t*.3+i)*.8; pp.array[i*3+1]=((pBase[i*3+1]-t*.18*((i%5)/5+.3))%18+18)%18; pp.array[i*3+2]=pBase[i*3+2]+Math.cos(t*.25+i*1.3)*.8; } pp.needsUpdate=true; }
  if(!still) shafts.forEach(s=>{ s.m.opacity = s.base*(.7+.3*Math.sin(t*.35+s.ph)); });
  if(!still) fx.update(t,dt);
  target.lerp(targetGoal, .05); controls.target.copy(target);
  camera.getWorldDirection(camDir);
  items.forEach(it=>{
    if(!still){ it.spin.rotation.y += dt*.35; it.spin.position.y = Math.sin(t*.9+it.phase)*.18; }
    const on = (focusTier<0 || it.n.tier===focusTier) && (!picked || picked===it.n);
    it.focus += ((on?1:.55) - it.focus)*.08; it.spin.scale.setScalar(.75+.25*it.focus + (picked===it.n?.15:0));
    it.holder.getWorldPosition(tmpV); const behind = tmpV.clone().sub(target).dot(camDir) > 1.5;
    it.el.style.opacity = (behind?.2:1) * (on?1:.35);
  });
  TIERS.forEach((T,i)=>{ T.ringMesh.material.opacity = (focusTier<0||focusTier===i)?.35:.08; });
  controls.update();
  { const gy=Math.max(terrainH(camera.position.x,camera.position.z),WATER_Y)+2.5; if(camera.position.y<gy) camera.position.y=gy; }   // camera below terrain：轉到低角度時別鑽進地面
  camera.updateMatrixWorld(); uViewProj.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  // 0) 湖面倒影：鏡像相機先畫一張
  renderReflection();
  // 1) 不含玻璃的畫面 → 貼圖（香水水體在這一步已自行折射背景）
  renderer.shadowMap.needsUpdate = true; camera.layers.set(0); renderer.setRenderTarget(sceneRT); renderer.render(scene,camera);
  // 2) 貼回螢幕（含深度）  3) 玻璃取樣第 1 步的畫面做第二層折射
  renderer.setRenderTarget(outRT); renderer.render(blitScene, blitCam);
  renderer.autoClear=false; camera.layers.set(1); renderer.render(scene,camera); renderer.autoClear=true; camera.layers.set(0);
  // 4) 多重取樣畫布 → 螢幕（色調映射 + FXAA 在這一步）
  // 5) 景深：焦點 = 鏡頭到注視點的距離
  dofQuad.material.uniforms.uFocus.value = tmpV.copy(controls.target).sub(camera.position).dot(camDir);
  renderer.setRenderTarget(dofRT); renderer.render(dofScene, blitCam);
  renderer.setRenderTarget(null); renderer.render(outScene, blitCam);
  labelRenderer.render(scene,camera);
  if(first){ first=false; const L=document.getElementById('loading'); setTimeout(()=>{ L.style.opacity=0; setTimeout(()=>L.remove(),700); },250); }
});

</script>
</body>
</html>
