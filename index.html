<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Yoyo 的香調環</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme:dark;
    --bg:#0a0806; --surface:#14100b; --surface-2:#1d1811; --border:rgba(201,169,106,0.16);
    --border-strong:rgba(201,169,106,0.36); --gold:#c9a96a; --gold-lt:#ecd6a2; --gold-dk:#9c7b3c;
    --gold-grad:linear-gradient(135deg,#f2dfae 0%,#c9a96a 52%,#a8823f 100%);
    --text:#f4efe4; --text-2:#b3a892; --text-muted:#9a907a; --ink-on-gold:#150f06;
    --fs-xs:12px; --fs-sm:13px; --fs-base:14px; --fs-md:16px; --fs-lg:18px; --fs-xl:24px; --fs-2xl:34px;
    --serif:"Playfair Display","Noto Serif TC",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","微軟正黑體",sans-serif;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text-2);font-family:var(--sans);margin:0;padding:0 0 70px;
    background-image:radial-gradient(900px 420px at 50% -120px,rgba(201,169,106,0.14),transparent 70%),radial-gradient(600px 300px at 85% 8%,rgba(201,169,106,0.05),transparent 70%);
    background-repeat:no-repeat;}
  .page{max-width:1360px;margin:0 auto;padding:0 20px;box-sizing:border-box;overflow-x:clip;}
  header{text-align:center;padding:38px 0 8px;}
  .wordmark{font-family:var(--serif);letter-spacing:6px;font-size:var(--fs-sm);color:var(--gold);text-transform:uppercase;margin-bottom:14px;font-weight:500;}
  h1{font-family:var(--serif);font-weight:600;color:var(--text);margin:0 0 10px;font-size:var(--fs-2xl);letter-spacing:1px;}
  h1 .ital{font-style:italic;color:var(--gold-lt);font-weight:500;}
  .flourish{width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 12px;}
  .subtitle{color:var(--text-muted);font-size:var(--fs-sm);letter-spacing:0.3px;margin-bottom:22px;}

  .toolbar{max-width:720px;margin:0 auto 28px;}
  .modeswitch{display:flex;gap:8px;justify-content:center;margin-bottom:16px;}
  .mode-btn{background:var(--surface);border:1px solid var(--border-strong);color:var(--text-2);border-radius:30px;
    padding:8px 20px;font-size:var(--fs-sm);font-family:inherit;cursor:pointer;letter-spacing:1px;display:flex;align-items:center;gap:7px;}
  .mode-btn.active{background:var(--gold-grad);color:#150f06;font-weight:700;border-color:var(--gold);}
  .search-box{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(29,24,17,0.9),rgba(20,16,11,0.9));
    border:1px solid var(--border-strong);border-radius:999px;padding:0 9px 0 20px;min-height:52px;transition:box-shadow .25s,border-color .25s;}
  .search-box:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,106,0.14);}
  .search-box svg{width:18px;height:18px;color:var(--gold);flex-shrink:0;}
  .search-box input{flex:1;min-width:0;padding:14px 0;background:transparent;border:none;outline:none;color:var(--text);font-size:var(--fs-md);font-family:inherit;}
  .search-box input::placeholder{color:var(--text-muted);}
  .search-clear{position:relative;background:transparent;border:1px solid var(--border-strong);color:var(--text-2);border-radius:999px;height:32px;padding:0 14px;white-space:nowrap;flex-shrink:0;font-size:var(--fs-sm);cursor:pointer;display:none;letter-spacing:1px;}
  .search-clear:hover{color:var(--gold);border-color:var(--gold);}
  .search-hint{text-align:center;font-size:var(--fs-xs);color:var(--text-muted);margin-top:10px;letter-spacing:0.3px;}
  .search-hint b{color:var(--gold);font-weight:600;}

  /* 檢視列：全部收藏／詳細・總覽 */
  .viewbar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .vb-btn{background:var(--surface);border:1px solid var(--border-strong);color:var(--text-2);border-radius:30px;padding:7px 16px;font-size:var(--fs-sm);font-family:inherit;cursor:pointer;letter-spacing:1px;display:inline-flex;align-items:center;gap:7px;}
  .vb-btn b{color:var(--gold-lt);font-weight:600;}
  .vb-btn.active{background:var(--gold-grad);color:#150f06;border-color:var(--gold);font-weight:700;}
  .vb-btn.active b{color:#150f06;}
  .seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:999px;overflow:hidden;background:var(--surface);}
  .seg button{all:unset;cursor:pointer;padding:7px 15px;font-size:var(--fs-sm);color:var(--text-2);letter-spacing:1px;}
  .seg button.active{background:var(--gold-grad);color:#150f06;font-weight:700;}
  .seg button:focus-visible,.vb-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .center-hub{cursor:pointer;}
  /* 卡片縮圖：有香境（3D 世界）的用瓶身＋台座的渲染圖 */
  .card-head{display:flex;gap:14px;align-items:flex-start;}
  .card-head .ch-info{flex:1;min-width:0;}
  .thumb{flex-shrink:0;width:76px;height:101px;border-radius:var(--tr,8px);overflow:hidden;position:relative;background:linear-gradient(180deg,#f4efe6,#e2dacb);}
  .thumb img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;display:block;}
  .thumb.is3d{background:#0d0b08;}
  .thumb.is3d img{object-fit:cover;mix-blend-mode:normal;}
  .thumb .t3d{position:absolute;right:3px;bottom:3px;font-size:var(--fs-xs);font-weight:700;letter-spacing:1px;color:#150f06;background:var(--gold-grad);border-radius:max(1px,calc(var(--tr,8px) - 3px));padding:1px 5px;}
  /* 總覽模式：一列三支，只看縮圖、品牌、名稱、評分 */
  .cards.compact{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .cards.compact .card{--R:16px;--p:10px;padding:var(--p) var(--p) 12px;}
  .card.mini .thumb{width:100%;height:auto;aspect-ratio:3/4;}
  .card.mini .brand{margin-top:9px;font-size:var(--fs-xs);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card.mini .mini-name{font-family:var(--serif);font-size:var(--fs-base);color:var(--text);font-weight:600;line-height:1.25;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card.mini .mini-zh{font-size:var(--fs-xs);color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card.mini .mini-rate{font-size:var(--fs-xs);color:var(--gold-lt);margin-top:5px;letter-spacing:.5px;}
  @media (max-width:480px){ .cards.compact{gap:8px;} .cards.compact .card{--R:14px;--p:8px;padding:var(--p) var(--p) 10px;} .card.mini .mini-name{font-size:var(--fs-sm);} }
  .today-btns{display:flex;gap:6px;flex-shrink:0;}

  .layout{display:grid;grid-template-columns:500px 1fr;gap:40px;align-items:start;}
  @media (max-width:1000px){.layout{grid-template-columns:1fr;gap:26px;}.wheel-wrap{position:static !important;}}
  .layout.novial .wheel-wrap{display:flex;}
  .wheel-wrap{display:flex;flex-direction:column;align-items:center;position:sticky;top:18px;}
  .wheel-container{position:relative;width:clamp(280px,calc(100vw - 40px),470px);height:clamp(280px,calc(100vw - 40px),470px);border-radius:50%;display:flex;justify-content:center;align-items:center;margin:0 auto;}
  .circle-bg{position:absolute;width:100%;height:100%;border:1px dashed var(--border-strong);border-radius:50%;z-index:0;}
  .circle-bg::after{content:"";position:absolute;inset:26px;border:1px solid var(--border);border-radius:50%;}
  .node{position:absolute;width:clamp(66px,17vw,84px);height:clamp(66px,17vw,84px);
    background:radial-gradient(circle at 50% 35%,#211b13,#100c08);border:1.5px solid var(--node-color,var(--gold));
    border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;z-index:2;
    transition:transform .22s ease,box-shadow .22s ease,background .22s ease;box-shadow:0 6px 16px rgba(0,0,0,0.6);user-select:none;}
  .node-icon{line-height:0;}
  .node-icon svg{width:clamp(18px,4.4vw,23px);height:clamp(18px,4.4vw,23px);color:var(--node-color);}
  .node-name{font-size:clamp(11px,2.6vw,12.5px);font-weight:700;color:var(--text);margin-top:3px;line-height:1.15;letter-spacing:0.5px;}
  .node-count{font-size:var(--fs-xs);font-weight:400;color:var(--text-muted);margin-top:1px;}
  .node:hover{transform:scale(1.12);box-shadow:0 0 20px var(--node-glow);}
  .node.active{background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--node-color) 88%,#000),color-mix(in srgb,var(--node-color) 62%,#000));border-color:var(--gold-lt);transform:scale(1.13);box-shadow:0 0 24px var(--node-glow);}
  .node.active .node-icon svg{color:#120d07;}
  .node.active .node-name{color:#fff;}
  .node.active .node-count{color:rgba(255,255,255,0.7);}
  .center-hub{position:absolute;width:clamp(120px,31vw,168px);height:clamp(120px,31vw,168px);
    background:radial-gradient(circle at 50% 40%,#1a140d,#0b0805);border-radius:50%;z-index:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;border:1px solid var(--border-strong);padding:12px;box-shadow:inset 0 0 30px rgba(0,0,0,0.85),0 0 0 6px rgba(10,8,6,0.6);}
  .center-hub .hub-icon{line-height:0;margin-bottom:7px;}
  .center-hub .hub-icon svg{width:32px;height:32px;color:var(--hub-color,var(--gold));}
  .center-hub .hub-title{font-family:var(--serif);font-size:var(--fs-lg);color:var(--text);font-weight:600;}
  .center-hub .hub-sub{font-size:var(--fs-xs);color:var(--text-muted);margin-top:6px;line-height:1.5;letter-spacing:0.5px;}
  .legend-note{margin-top:24px;font-size:var(--fs-xs);color:var(--text-muted);text-align:center;max-width:430px;line-height:1.9;}

  .detail-panel{min-height:420px;}
  .detail-header{display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:22px;}
  .detail-header .hdr-icon{line-height:0;}
  .detail-header .hdr-icon svg{width:28px;height:28px;color:var(--fam-color,var(--gold));}
  .detail-header h2{font-family:var(--serif);font-size:var(--fs-xl);color:var(--text);font-weight:600;margin:0;letter-spacing:0.5px;}
  .detail-header .fam-count{font-size:var(--fs-sm);color:var(--text-muted);letter-spacing:1px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(345px,100%),1fr));gap:18px;}
  .card{--R:22px;--p:16px;background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-radius:var(--R);padding:var(--p);cursor:pointer;position:relative;overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s;}
  .card:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,0.5);}
  .card .brand{font-size:var(--fs-xs);letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;}
  .card .names{margin:4px 0 8px;}
  .card .name-en{font-family:var(--serif);font-size:var(--fs-lg);font-weight:600;color:var(--text);}
  .card .name-zh{font-size:var(--fs-sm);color:var(--text-2);margin-left:3px;}
  .fam-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center;}
  .fam-badge{font-size:var(--fs-xs);padding:2px 9px;border-radius:10px;color:#fff;font-weight:600;letter-spacing:0.5px;}
  .vial-badge{font-size:var(--fs-xs);padding:2px 9px;border-radius:10px;color:#150f06;font-weight:700;letter-spacing:1px;background:var(--gold-grad);display:inline-flex;align-items:center;gap:4px;}
  .stars{position:relative;display:inline-block;font-size:var(--fs-sm);letter-spacing:1px;line-height:1;}
  .stars-off{color:#3a3225;}
  .stars-on{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold);}
  .rating-num{color:var(--gold-lt);font-weight:700;font-size:var(--fs-sm);}
  .row{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap;}
  .votes{font-size:var(--fs-xs);color:var(--text-muted);}
  .no-rating{color:var(--text-muted);font-size:var(--fs-sm);}
  .accord-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px;}
  .accord-tag{font-size:var(--fs-xs);padding:2px 9px;border-radius:11px;background:color-mix(in srgb,var(--fam-color,var(--gold)) 20%,var(--surface-2));color:var(--text-2);border:1px solid color-mix(in srgb,var(--fam-color,var(--gold)) 42%,transparent);white-space:nowrap;}
  .accord-tag.hit{background:var(--gold-grad);color:#150f06;font-weight:700;border-color:var(--gold);}

  /* note chips with image + chinese */
  .note-label{font-size:var(--fs-xs);color:var(--gold);letter-spacing:0.5px;margin:2px 0 6px;}
  .note-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
  .note-chip{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 10px 3px 3px;}
  .note-chip img{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#241d13;}
  .note-chip .nc-zh{font-size:var(--fs-xs);color:var(--text);line-height:1.1;}
  .note-chip .nc-en{font-size:var(--fs-xs);color:var(--text-muted);line-height:1.1;}
  .note-chip.hit{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--surface-2));}
  .note-chip .nc-txt{display:flex;flex-direction:column;}
  .tier-row{margin-bottom:9px;}
  .tier-tag{display:inline-block;font-size:var(--fs-xs);letter-spacing:1px;color:#150f06;font-weight:700;background:var(--gold-grad);padding:2px 8px;border-radius:5px;margin-bottom:6px;}

  .perf-block{margin-bottom:11px;}
  .perf-row{display:flex;align-items:center;gap:9px;font-size:var(--fs-xs);color:var(--text-muted);margin-bottom:5px;}
  .perf-row .plabel{width:46px;flex-shrink:0;letter-spacing:0.5px;}
  .perf-bar-track{flex:1;height:6px;background:#2a2117;border-radius:3px;overflow:hidden;}
  .perf-bar-fill{height:100%;background:var(--gold-grad);border-radius:3px;}
  .perf-val{min-width:30px;text-align:right;font-size:var(--fs-xs);color:var(--gold-lt);flex-shrink:0;font-weight:600;white-space:nowrap;}
  .perf-word{font-weight:400;color:var(--text-2);margin-right:5px;font-size:var(--fs-xs);}
  .perf-dist{display:flex;flex-wrap:wrap;gap:4px 9px;font-size:var(--fs-xs);color:var(--text-muted);margin:-1px 0 8px 55px;}
  .perf-dist b{color:var(--text-2);font-weight:600;margin-left:3px;}
  .perf-na{font-size:var(--fs-xs);color:var(--text-muted);font-style:italic;}
  .perf-source{font-size:var(--fs-xs);color:var(--text-muted);margin-top:3px;overflow-wrap:anywhere;}
  .season-block{display:flex;align-items:center;gap:10px;font-size:var(--fs-xs);margin-bottom:4px;}
  .season-cells{display:flex;gap:4px;}
  .season-cell{width:27px;height:23px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);}
  .season-cell.on{background:color-mix(in srgb,var(--gold) 30%,var(--surface-2));color:var(--gold-lt);border-color:var(--gold-dk);font-weight:700;}
  .season-cell.voted{background:color-mix(in srgb,var(--gold) calc(var(--sv) * 0.34),var(--surface-2));flex-direction:column;line-height:1.05;}
  .season-cell small{font-size:var(--fs-xs);font-weight:400;color:var(--text-muted);}
  .modal-card .season-cell.voted{width:auto;min-width:38px;padding:0 5px;height:34px;}
  .dn-num{margin-left:6px;font-size:var(--fs-xs);color:var(--text-muted);}
  .daynight{font-size:var(--fs-xs);color:var(--text-muted);letter-spacing:0.5px;}
  .card-note{margin-top:11px;padding:9px 11px;background:rgba(201,169,106,0.07);border:1px solid rgba(201,169,106,0.28);border-radius:calc(var(--R,14px) - var(--p,8px) - 1px);font-size:var(--fs-xs);color:var(--gold-lt);line-height:1.65;}
  .card-cta{margin-top:12px;font-size:var(--fs-xs);color:var(--gold);letter-spacing:1px;display:flex;align-items:center;gap:6px;}
  .empty-state{display:flex;align-items:center;justify-content:center;height:320px;color:var(--text-muted);font-size:var(--fs-base);text-align:center;line-height:1.9;}

  .modal-backdrop{position:fixed;inset:14px 0;z-index:100;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .25s;}
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .modal-backdrop:not(.show){display:none;}
  .modal-card{background:linear-gradient(180deg,#191309,#0d0a06);border:1px solid var(--border-strong);border-radius:30px;max-width:900px;width:100%;max-height:100%;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,0.7);position:relative;overflow:hidden;transform:translateY(14px) scale(0.985);transition:transform .28s;}
  .modal-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
  .modal-actions{display:flex;flex-wrap:wrap;gap:10px;padding:10px 34px 34px;}
  @media (max-width:720px){.modal-actions{padding:10px 26px 28px;}}
  .modal-backdrop.open .modal-card{transform:none;}
  .modal-close{position:absolute;top:10px;right:10px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid var(--border-strong);background:rgba(10,8,6,0.6);color:var(--gold);font-size:var(--fs-lg);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .modal-close:hover{background:var(--gold);color:#120d07;}
  .modal-top{display:grid;grid-template-columns:300px 1fr;gap:4px;}
  @media (max-width:720px){.modal-top{grid-template-columns:1fr;}}
  .modal-bottle{position:relative;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:radial-gradient(closest-side at 50% 46%,rgba(201,169,106,0.22),rgba(201,169,106,0.05) 60%,transparent 78%);min-height:320px;}
  .modal-bottle img{max-height:320px;max-width:230px;object-fit:contain;filter:drop-shadow(0 18px 30px rgba(0,0,0,0.6));border-radius:6px;background:#fff2;}
  .modal-bottle .noimg{color:var(--text-muted);font-size:var(--fs-sm);text-align:center;line-height:1.8;}
  .modal-info{padding:40px 34px 30px 8px;}
  @media (max-width:720px){.modal-info{padding:6px 26px 30px;}}
  .modal-info .m-brand{font-size:var(--fs-xs);letter-spacing:2px;color:var(--gold);text-transform:uppercase;}
  .modal-info .m-name{font-family:var(--serif);font-size:var(--fs-xl);color:var(--text);font-weight:600;margin:6px 0 2px;line-height:1.2;}
  .modal-info .m-zh{font-size:var(--fs-md);color:var(--text-2);margin-bottom:12px;}
  .modal-rating{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .m-section-label{font-size:var(--fs-xs);letter-spacing:2.5px;color:var(--gold);text-transform:uppercase;margin:20px 0 10px;display:flex;align-items:center;gap:10px;}
  .m-section-label::after{content:"";flex:1;height:1px;background:var(--border);}
  .modal-block{padding:0 34px 8px 34px;}
  @media (max-width:720px){.modal-block{padding:0 26px 8px;}}
  .modal-perf-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  @media (max-width:500px){.modal-perf-grid{grid-template-columns:1fr;gap:10px;}}
  .m-link{display:inline-flex;align-items:center;gap:8px;margin:0;padding:11px 22px;background:var(--gold-grad);color:#150f06;font-weight:700;font-size:var(--fs-sm);letter-spacing:1px;border-radius:30px;text-decoration:none;}
  .m-link:hover{filter:brightness(1.07);}
  .m-link.m-ext{background:transparent;color:var(--gold-lt);border:1px solid var(--border-strong);padding:10px 20px;}
  .m-link.m-ext:hover{border-color:var(--gold);filter:none;}
  .m-note{margin:4px 34px 20px;padding:11px 14px;background:rgba(201,169,106,0.08);border:1px solid rgba(201,169,106,0.3);border-radius:10px;font-size:var(--fs-xs);color:var(--gold-lt);line-height:1.7;}
  footer{max-width:1320px;margin:54px auto 0;padding-top:22px;border-top:1px solid var(--border);font-size:var(--fs-xs);color:var(--text-muted);line-height:2;}
  footer b{color:var(--gold);font-weight:600;letter-spacing:1px;}
  /* 今日香氛 */
  .today{max-width:720px;margin:0 auto 30px;background:linear-gradient(180deg,rgba(29,24,17,0.92),rgba(20,16,11,0.92));
    border:1px solid var(--border-strong);border-radius:22px;padding:20px 22px;}
  .today-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .today-label{font-family:var(--serif);font-size:var(--fs-xs);letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
  .today-place{color:var(--text);font-size:var(--fs-lg);margin-top:6px;font-weight:600;}
  .today-time{color:var(--text-muted);font-size:var(--fs-sm);font-weight:400;margin-left:10px;}
  .today-btn{background:transparent;border:1px solid var(--border-strong);color:var(--text-2);border-radius:20px;padding:5px 14px;font-size:var(--fs-sm);font-family:inherit;cursor:pointer;flex-shrink:0;}
  .today-btn:hover,.today-btn:focus-visible{color:var(--gold);border-color:var(--gold);}
  .today-msg{color:var(--text-2);font-size:var(--fs-base);margin-top:10px;line-height:1.7;}
  .wx-row{display:flex;align-items:center;gap:22px;margin:16px 0 18px;flex-wrap:wrap;}
  .wx-big{font-family:var(--serif);font-size:46px;color:var(--text);line-height:1;display:flex;align-items:baseline;gap:10px;}
  .wx-big span{font-family:var(--sans);font-size:var(--fs-base);color:var(--gold-lt);}
  .wx-stats{display:grid;grid-template-columns:repeat(4,auto);gap:4px 18px;flex:1;min-width:0;}
  .wx-stats div{display:flex;flex-direction:column;gap:2px;}
  .wx-stats span{font-size:var(--fs-xs);color:var(--text-muted);letter-spacing:.5px;}
  .wx-stats b{font-size:var(--fs-md);color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
  @media (max-width:480px){.wx-stats{grid-template-columns:repeat(2,auto);}}
  .picks{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;}
  @media (max-width:700px){.picks{grid-template-columns:1fr;}}
  .pick{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:14px 16px;--R:16px;border-radius:var(--R);
    background:var(--surface);border:1px solid var(--border);transition:border-color .2s;min-width:0;}
  .pick:hover,.pick:focus-visible{border-color:var(--gold);}
  .pick-main{border-color:var(--border-strong);background:linear-gradient(160deg,rgba(201,169,106,0.14),var(--surface) 60%);}
  .pick-rank{font-size:var(--fs-xs);letter-spacing:2px;color:var(--gold);}
  .pick-brand{font-size:var(--fs-xs);letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-top:2px;}
  .pick-name{font-family:var(--serif);font-size:var(--fs-lg);color:var(--text);line-height:1.3;}
  .pick-main .pick-name{font-size:var(--fs-lg);}
  .pick-zh{font-family:var(--sans);font-size:var(--fs-sm);color:var(--text-2);}
  .pick-why{font-size:var(--fs-sm);color:var(--text-2);line-height:1.65;margin-top:4px;}
  .pick-why b{color:var(--gold-lt);font-weight:500;}
  .today-src{font-size:var(--fs-xs);color:var(--text-muted);margin-top:14px;line-height:1.7;}
  .city-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .city{background:var(--surface);border:1px solid var(--border);color:var(--text-2);border-radius:16px;padding:5px 12px;font-size:var(--fs-sm);font-family:inherit;cursor:pointer;}
  .city:hover,.city:focus-visible{border-color:var(--gold);color:var(--gold);}
  .city-picker[hidden]{display:none;}

  /* ---- 體檢修正 ---- */
  .card .brand::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--fam-color,var(--gold));margin-right:7px;vertical-align:1px;}
  .note-chip.more{padding:3px 11px;color:var(--text-muted);font-size:var(--fs-xs);font-variant-numeric:tabular-nums;}
  .ic{width:14px;height:14px;flex-shrink:0;}
  .card-note,.m-note{display:flex;gap:8px;align-items:flex-start;}
  .card-note .ic,.m-note .ic{margin-top:3px;color:var(--gold);}
  .modal-close svg{width:16px;height:16px;}
  .bottle-frame{border-radius:14px;padding:18px;background:linear-gradient(180deg,#f4efe6,#e2dacb);display:flex;align-items:center;justify-content:center;}
  .bottle-frame img{max-height:300px;max-width:210px;object-fit:contain;mix-blend-mode:multiply;display:block;}
  .bottle-frame.is3d{padding:0;background:#0d0b08;overflow:hidden;}
  .bottle-frame.is3d img{max-height:none;max-width:none;width:240px;height:320px;object-fit:cover;mix-blend-mode:normal;}
  /* 今日香氛：首選一張完整卡，其餘兩支是精簡列 */
  .today-title{font-family:var(--serif);font-size:var(--fs-lg);color:var(--gold-lt);margin:0;font-weight:600;letter-spacing:.5px;}
  .picks{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;}
  .picks-more{display:flex;flex-direction:column;gap:8px;min-width:0;}
  .picks-cap{font-size:var(--fs-sm);color:var(--text-muted);padding-left:2px;}
  .pick-alt{padding:11px 14px;gap:2px;}
  .pick-alt .pick-name{font-size:var(--fs-md);}
  .pick-alt .pick-why{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;}
  @media (max-width:700px){ .picks{grid-template-columns:1fr;} }
  /* 手機：香調環換成可橫向滑動的香調列（停在頂端，切換時不用往回滑） */
  .fam-strip{display:none;}
  .fam-chip{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border-strong);border-radius:30px;padding:0 14px;min-height:36px;font-size:var(--fs-sm);color:var(--text-2);font-family:inherit;cursor:pointer;white-space:nowrap;}
  .fam-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c);}
  .fam-chip b{font-weight:500;color:var(--text-muted);font-variant-numeric:tabular-nums;}
  .fam-chip.active{border-color:var(--c);color:var(--text);background:color-mix(in srgb,var(--c) 20%,var(--surface));}
  .fam-chip.active b{color:var(--text-2);}
  @media (max-width:640px){
    #viewbar{display:none;}
    .layout{gap:22px;}
    .toolbar{margin-bottom:16px;}
  }
  /* 觸控：手指操作的按鈕至少 44px 高 */
  .today-btn,.vb-btn,.seg button,.city,.search-clear{display:inline-flex;align-items:center;justify-content:center;}
  .today-btn,.city{min-height:32px;padding:0 14px;} .vb-btn{min-height:36px;}
  @media (pointer:coarse){ .search-clear::after{content:"";position:absolute;inset:-7px -4px;} }
  /* 瀏覽器外觀：選取、游標、捲軸、焦點框、數字 */
  ::selection{background:rgba(201,169,106,.38);color:#fff;}
  input{caret-color:var(--gold);}
  html{scrollbar-color:#3d3322 var(--bg);}
  ::-webkit-scrollbar{width:10px;height:10px;} ::-webkit-scrollbar-track{background:var(--bg);} ::-webkit-scrollbar-thumb{background:#3d3322;border-radius:10px;border:2px solid var(--bg);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .rating-num,.votes,.perf-val,.fam-count,.node-count,.mini-rate,.hub-sub,.season-cell small,.dn-num,.perf-dist b{font-variant-numeric:tabular-nums;}
  @media (prefers-reduced-motion:reduce){ .card:hover,.node:hover,.node.active,.modal-card{transform:none !important;} }
  .bottle-frame img{filter:none;background:none;border-radius:0;}
  .card-head{margin-bottom:12px;}
  .subtitle{text-wrap:balance;max-width:34em;margin-left:auto;margin-right:auto;}
  .picks{align-items:stretch;}
  .pick-main{flex-direction:row;align-items:center;gap:16px;padding:10px 16px 10px 10px;}
  .pick-main .thumb{width:96px;height:128px;--tr:calc(var(--R) - 11px);}
  .pick-body{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .search-hint,.today-src,.pick-why{text-wrap:pretty;}
  .search-hint{text-wrap:balance;}

  /* 浮動快捷列：排序列捲到上面之後才出現。一層膠囊，裡面的按鈕不再各自有框；
     離頂端 14px、最寬 82vw，避開 iOS 26 Safari 的狀態列取樣（貼邊、寬度 ≥ 90% 的 fixed 元素會被拿去塗狀態列） */
  .detail-col{min-width:0;}
  .sort-inline{transition:opacity .2s;}
  .sort-inline.tucked{opacity:0;pointer-events:none;}
  .fbar{--R:23px;--p:4px;position:fixed;top:14px;left:50%;z-index:40;display:flex;align-items:center;height:46px;max-width:82vw;padding:var(--p);border-radius:var(--R);
    background:rgba(22,17,11,.86);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--border-strong);box-shadow:0 10px 28px rgba(0,0,0,.5);
    transform:translate(-50%,-6px);opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s .2s;}
  .fbar.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:opacity .2s,transform .2s;}
  .fb-btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:calc(var(--R) - var(--p) - 1px);
    color:var(--text);font-size:var(--fs-sm);cursor:pointer;white-space:nowrap;min-width:0;transition:background .15s;}
  .fb-btn:hover,.fb-btn[aria-expanded="true"]{background:rgba(201,169,106,.15);}
  .fb-btn:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;}
  .fb-btn svg{width:16px;height:16px;color:var(--gold);flex-shrink:0;}
  .fb-fam svg{width:14px;height:14px;}
  .fb-fam #fam-label{overflow:hidden;text-overflow:ellipsis;}
  .fb-dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--gold));flex-shrink:0;}
  .fb-sep{width:1px;height:18px;background:var(--border-strong);margin:0 2px;flex-shrink:0;}
  .sort-btn .sb-cur{color:var(--gold-lt);}
  .sort-btn .sb-cur:empty{display:none;}
  .sort-btn:has(.sb-cur:not(:empty)) .sb-k{color:var(--text-muted);}
  .sort-btn .sb-dot{display:none;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:-2px;}
  @media (min-width:1001px){ .fb-fam,.fb-sep{display:none;} }
  @media (max-width:1000px){ .sort-btn .sb-cur{display:none;} .sort-btn.on .sb-dot{display:block;} }
  /* 香調環選取（快捷列的香調鈕打開） */
  .pw{--ws:min(340px,calc(100vw - 52px));position:relative;width:var(--ws);height:var(--ws);margin:6px auto 2px;}
  .pw::before{content:"";position:absolute;inset:2px;border:1px dashed var(--border-strong);border-radius:50%;}
  .pw-node{--s:clamp(54px,calc(var(--ws) * .19),64px);width:var(--s);height:var(--s);left:calc(50% - var(--s) / 2);top:calc(50% - var(--s) / 2);padding:0;font:inherit;color:inherit;
    translate:calc(cos(var(--a)) * (var(--ws) / 2 - var(--s) / 2 - 4px)) calc(sin(var(--a)) * (var(--ws) / 2 - var(--s) / 2 - 4px));}
  .pw-node .node-icon svg{width:16px;height:16px;}
  .pw-node .node-name{font-size:12px;margin-top:2px;}
  .pw-node .node-count{font-size:12px;}
  .pw-node:hover,.pw-node.active{transform:scale(1.06);}
  .pw-hub{all:unset;box-sizing:border-box;position:absolute;left:50%;top:50%;width:calc(var(--ws) * .36);height:calc(var(--ws) * .36);transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;background:radial-gradient(circle at 50% 40%,#1a140d,#0b0805);border:1px solid var(--border-strong);}
  .pw-hub svg{width:24px;height:24px;color:var(--gold);}
  .pw-hub b{font-family:var(--serif);font-weight:600;color:var(--text);font-size:var(--fs-md);}
  .pw-hub small{font-size:var(--fs-xs);color:var(--text-muted);}
  .pw-hub.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
  .pw-hub:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .sort-note{color:var(--gold-lt);}
  .detail-header{flex-wrap:wrap;row-gap:4px;}

  /* 排序面板：電腦是下拉面板，手機是底部抽屜（單手好按） */
  .sort-panel{--R:20px;--p:14px;--ir:calc(var(--R) - var(--p) - 1px);position:absolute;top:0;left:0;z-index:95;width:380px;max-width:calc(100vw - 32px);}
  .sp-body{padding:var(--p);border-radius:var(--R);background:#17120b;border:1px solid var(--border-strong);box-shadow:0 18px 44px rgba(0,0,0,.65);}
  .sort-panel[hidden],.sort-scrim[hidden]{display:none;}
  .sp-title{font-family:var(--serif);font-size:var(--fs-md);color:var(--text);margin:2px 2px 12px;font-weight:600;}
  .sp-label{font-size:var(--fs-sm);color:var(--text-muted);margin:14px 2px 8px;}
  .sp-title + .sp-label{margin-top:0;}
  .sort-metric{margin-top:6px;font-size:var(--fs-sm);color:var(--gold-lt);font-variant-numeric:tabular-nums;}
  .sp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;}
  .sp-opt,.sp-seg button{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;min-height:38px;padding:6px 8px;border-radius:var(--ir);
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);font-size:var(--fs-sm);cursor:pointer;line-height:1.3;}
  .sp-opt:hover,.sp-seg button:hover{border-color:var(--border-strong);color:var(--text);}
  .sp-opt[aria-checked="true"],.sp-seg button[aria-checked="true"]{background:color-mix(in srgb,var(--gold) 22%,var(--surface-2));border-color:var(--gold);color:var(--gold-lt);font-weight:600;}
  .sp-opt[aria-disabled="true"]{opacity:.45;cursor:default;}
  .sp-opt:focus-visible,.sp-seg button:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
  .sp-desc{font-size:var(--fs-xs);color:var(--text-muted);margin:8px 2px 0;line-height:1.6;min-height:1.6em;}
  .sp-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .sp-seg button{flex-direction:column;gap:1px;}
  .sp-seg button small{font-size:var(--fs-xs);font-weight:400;color:var(--text-muted);}
  .sp-none{font-size:var(--fs-sm);color:var(--text-muted);padding:10px 2px;}
  .sp-done{all:unset;box-sizing:border-box;display:none;width:100%;margin-top:16px;min-height:48px;border-radius:var(--ir);background:var(--gold-grad);color:var(--ink-on-gold);font-weight:700;font-size:var(--fs-base);text-align:center;line-height:48px;cursor:pointer;letter-spacing:1px;}
  .sort-scrim{position:absolute;left:0;top:0;width:100%;z-index:90;background:rgba(3,2,1,.8);opacity:0;transition:opacity .25s;}
  .sort-scrim.on{opacity:1;}
  @media (max-width:640px){
    .sort-panel{--R:28px;--p:16px;position:fixed;top:auto !important;left:10px !important;right:10px;bottom:14px;width:auto;max-width:none;z-index:95;}
    .sp-body{padding:18px var(--p) var(--p);max-height:calc(100vh - 120px);overflow-y:auto;overscroll-behavior:contain;}
    .sp-done{display:block;}
    .sp-opt,.sp-seg button{min-height:40px;}
  }


  /* 展開的排序列（分頁列置頂前看得到；捲到分頁列下面後收進「排序」鈕） */
  .sort-inline{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:16px 0 20px;}
  .si-sort{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border-strong);color:var(--text-2);font-family:inherit;font-size:var(--fs-sm);cursor:pointer;white-space:nowrap;}
  .si-sort b{color:var(--text);font-weight:600;}
  .si-sort svg{width:14px;height:14px;color:var(--gold);}
  .si-sort:hover,.si-sort[aria-expanded="true"]{border-color:var(--gold);}
  .si-view{margin-left:auto;}
  @media (min-width:1001px){ .sort-inline{margin-top:0;} }
  @media (max-width:640px){ .si-dir{order:3;flex-basis:100%;display:grid;grid-template-columns:1fr 1fr;} .si-dir button{justify-content:center;} }
  /* 分段控制：比照常見規範，高 32px */
  .seg button{min-height:32px;padding:0 14px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;}
  /* 香境：點圖就走進去 */
  a.bottle-frame{position:relative;display:block;text-decoration:none;cursor:pointer;}
  .bf-go{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:6px 12px 6px 14px;border-radius:999px;
    background:rgba(10,8,6,.62);border:1px solid rgba(236,214,162,.45);color:var(--gold-lt);font-size:var(--fs-sm);letter-spacing:1px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:background .2s;}
  .bf-go svg{width:14px;height:14px;}
  a.bottle-frame:hover .bf-go,a.bottle-frame:focus-visible .bf-go{background:rgba(201,169,106,.9);color:var(--ink-on-gold);}
  /* 香水詳細：3D 圖／商品圖切換 */
  .modal-bottle{flex-direction:column;gap:14px;}
  .bottle-frame{width:240px;height:320px;box-sizing:border-box;}
  .bottle-frame img{max-width:100%;max-height:100%;}
  .bottle-frame[hidden]{display:none;}
  .bottle-switch button{padding:0 16px;}

  /* 今日香氛：換一組／換地點移到地點那一列，不擠在圓角轉角 */
  .today-head{align-items:center;margin-top:8px;flex-wrap:wrap;}
  .today-head .today-place{margin-top:0;}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Yoyo 的<span class="ital">香調環</span></h1>
    <div class="subtitle" id="subtitle">30 支收藏，依主香調排成一圈；點節點瀏覽，點卡片看瓶身、香調金字塔與香材圖鑑</div>
  </header>

  <section class="today" id="today" aria-label="今日香氛"></section>

  <div class="toolbar">
    <div class="modeswitch" style="display:none">
      <button class="mode-btn active" id="mode-main">🌸 主收藏</button>
      <button class="mode-btn" id="mode-vial">🧪 試香櫃 <span id="vial-count"></span></button>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search-input" type="text" placeholder="搜尋香材、香調或品牌" aria-label="搜尋香材、香調或品牌" autocomplete="off">
      <button class="search-clear" id="search-clear">清除</button>
    </div>
    <div class="search-hint">例如 vetiver、茶、海鹽、木質、Le Labo；命中的香材以<b>金色</b>標示</div>
    <div class="viewbar" id="viewbar">
      <button type="button" class="vb-btn" id="vb-all">全部收藏 <b id="vb-count"></b></button>
    </div>
  </div>

  <div class="layout" id="layout">
    <div class="wheel-wrap" id="wheel-wrap">
      <div class="wheel-container" id="wheel">
        <div class="circle-bg"></div>
        <div class="center-hub" id="hub">
          <div class="hub-icon" id="hub-icon"></div>
          <div class="hub-title">探索香調</div>
          <div class="hub-sub">點擊周圍節點<br>檢視收藏香水</div>
        </div>
      </div>
    </div>
    <div class="detail-col">
      <div class="sort-inline" id="sort-inline"></div>
      <div class="detail-panel" id="detail">
        <div class="empty-state">← 點擊左側香調節點，或於上方搜尋香材</div>
      </div>
    </div>
  </div>
  <footer id="footer"></footer>

<script>
const database = JSON.parse(document.getElementById('wheel-data').textContent);
const sampleList = JSON.parse(document.getElementById('samples-data').textContent);
const noteMetaRaw = JSON.parse(document.getElementById('note-meta').textContent);
const familyColors = JSON.parse(document.getElementById('family-colors').textContent);
const familyIcons = JSON.parse(document.getElementById('family-icons').textContent);
const aliases = JSON.parse(document.getElementById('aliases').textContent);
const categories = Object.keys(database);

// case-insensitive note meta lookup
const noteMeta = {};
for (const k in noteMetaRaw) noteMeta[k.toLowerCase()] = noteMetaRaw[k];

const wheel = document.getElementById('wheel');
const hub = document.getElementById('hub');
const detail = document.getElementById('detail');
const modal = document.getElementById('modal');
const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
document.getElementById('vial-count').textContent = '('+sampleList.length+')';

// unified index for search: mains + samples
const perfIndex = {};
categories.forEach(fam => database[fam].forEach(p => {
  const key = p.brand+'|'+p.name_en;
  if(!perfIndex[key]) perfIndex[key]={p, families:[], is_sample:false};
  perfIndex[key].families.push(fam);
}));
sampleList.forEach(p => {
  const key = 'VIAL|'+p.brand+'|'+p.name_en;
  perfIndex[key]={p, families:[p.family], is_sample:true};
});

let activeFamily=null, mode='main';

const ACCORD_ZH = {'citrus':'柑橘','aquatic':'水生','marine':'海洋','ozonic':'臭氧','salty':'鹹','fresh':'清新','green':'綠葉',
    'herbal':'草本','tropical':'熱帶','aromatic':'芳香','lavender':'薰衣草','soapy':'皂感','fruity':'果香','aldehydic':'醛香',
    'fresh spicy':'清爽辛香','white floral':'白花','floral':'花香','yellow floral':'黃花','rose':'玫瑰','musky':'麝香',
    'iris':'鳶尾','conifer':'針葉','mossy':'苔蘚','powdery':'粉感','earthy':'土壤','woody':'木質','soft spicy':'柔和辛香',
    'patchouli':'廣藿香','animalic':'動物','sweet':'甜感','nutty':'堅果','warm spicy':'溫暖辛香','leather':'皮革',
    'smoky':'煙燻','cinnamon':'肉桂','amber':'琥珀','balsamic':'香脂','oud':'沉香','vanilla':'香草','chocolate':'巧克力','cacao':'可可'};
const ICON = {
  note:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  arrow:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  ext:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M19 5l-8 8M18 14v5H5V6h5"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const accordZh = a => ACCORD_ZH[a] || a;
const famName = f => f.replace(/^\d+\.\s*/,'');
const ALL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.2"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>';
const WARMTH = {
  'citrus':-2,'aquatic':-2,'marine':-2,'ozonic':-1.8,'salty':-1.5,'fresh':-1.5,'green':-1.2,'herbal':-1,
  'tropical':-0.6,'aromatic':-0.6,'lavender':-0.5,'soapy':-0.5,'fruity':-0.3,'aldehydic':-0.3,'fresh spicy':-0.3,
  'white floral':0,'floral':0,'yellow floral':0.2,'rose':0.2,'musky':0.2,'iris':0.3,'conifer':0.3,
  'mossy':0.5,'powdery':0.6,'earthy':0.6,'woody':0.7,'soft spicy':0.8,'patchouli':1,'animalic':1.2,'sweet':1.2,
  'nutty':1.3,'warm spicy':1.3,'leather':1.3,'smoky':1.4,'cinnamon':1.5,'amber':1.6,'balsamic':1.6,
  'oud':1.8,'vanilla':1.8,'chocolate':2,'cacao':2
};
function perfWarmth(p){
  let s=0,w=0; (p.accords||[]).forEach((a,i)=>{ const v=WARMTH[a]; if(v===undefined) return; const k=1/(1+i*0.35); s+=v*k; w+=k; });
  return w? s/w : 0;
}

// ===== 排序 =====
const SEASON_NOW = (m=>m<=1||m===11?'冬':m<=4?'春':m<=7?'夏':'秋')(new Date().getMonth());
const pkOf = p => p.brand+'|'+p.name_en;
function seasonShare(p){ const v=p.season_votes; if(!v) return null; const n=Object.values(v).reduce((a,b)=>a+b,0); return n? v[SEASON_NOW]/n : null; }
function weightWord(w){ return w<-0.9?'清爽':w<-0.25?'偏清爽':w<0.45?'輕重適中':w<1.1?'偏濃郁':'濃郁'; }
const todayRank = p => window.fwToday ? window.fwToday.get(pkOf(p)) : null;
// val：數字越大越前面（反向時相反）；沒有資料的永遠排最後
const SORTS = [
  {k:'default', label:'預設', desc:'依香調分類的順序'},
  {k:'today', label:'今日適合', desc:'依此刻的天氣，對每支香水打適合度', dir:['最適合','最不適合'], val:p=>{ const r=todayRank(p); return r?-r:null; }, need:()=>!!window.fwToday, needMsg:'天氣資料載入後可用'},
  {k:'season', label:'當季', desc:`Fragrantica 會員投給${SEASON_NOW}季的票數占比`, dir:[`${SEASON_NOW}季票多`,`${SEASON_NOW}季票少`], val:seasonShare},
  {k:'weight', label:'輕重', desc:'依主香調的輕重排列', dir:['清爽','濃郁'], val:p=>-perfWarmth(p)},
  {k:'rating', label:'評分', desc:'Fragrantica 會員平均分數', dir:['高分','低分'], val:p=>p.rating||null},
  {k:'votes', label:'評分人數', desc:'評分的人越多，口碑越有共識', dir:['票數多','票數少'], val:p=>p.votes||null},
  {k:'longevity', label:'持香', desc:'持香度投票平均（1 很短～5 非常持久）', dir:['持久','短暫'], val:p=>p.longevity??null},
  {k:'sillage', label:'擴香', desc:'擴香度投票平均（1 貼膚～4 非常強）', dir:['擴散強','貼膚'], val:p=>p.sillage??null},
  {k:'brand', label:'品牌', desc:'依品牌名稱字母', dir:['A','Z'], cmp:(a,b)=>a.brand.localeCompare(b.brand)||a.name_en.localeCompare(b.name_en)},
];
const SORT_BY = Object.fromEntries(SORTS.map(d=>[d.k,d]));
let sortKey = (()=>{ try{ const k=localStorage.getItem('fw-sort'); return SORT_BY[k]?k:'default'; }catch(e){ return 'default'; } })();
let sortRev = (()=>{ try{ return localStorage.getItem('fw-sort-rev')==='1'; }catch(e){ return false; } })();
function applySort(items){
  const d=SORT_BY[sortKey]; if(!d || (!d.val && !d.cmp)) return items;
  const arr=items.map((x,i)=>({x,i,v:d.val?d.val(x.p):0}));
  arr.sort((a,b)=>{
    if(d.cmp){ const c=d.cmp(a.x.p,b.x.p); return (sortRev?-c:c)||a.i-b.i; }
    const an=a.v==null||Number.isNaN(a.v), bn=b.v==null||Number.isNaN(b.v);
    if(an||bn) return an&&bn ? a.i-b.i : an?1:-1;
    const c=b.v-a.v; return (sortRev?-c:c)||a.i-b.i;
  });
  return arr.map(a=>a.x);
}
// 卡片上顯示目前排序依據的數值
function sortMeta(p){
  switch(sortKey){
    case 'votes': return p.votes?`${p.votes.toLocaleString()} 人評分`:'沒有投票資料';
    case 'longevity': return p.longevity!=null?`持香 ${p.longevity.toFixed(1)}・${perfWord('longevity',p.longevity)}`:'沒有持香資料';
    case 'sillage': return p.sillage!=null?`擴香 ${p.sillage.toFixed(1)}・${perfWord('sillage',p.sillage)}`:'沒有擴香資料';
    case 'season': { const v=seasonShare(p); return v!=null?`${SEASON_NOW}季票數 ${Math.round(v*100)}%`:'沒有季節投票'; }
    case 'today': { const r=todayRank(p); return r?`今日適合度第 ${r} 名`:'等天氣資料'; }
    case 'weight': return weightWord(perfWarmth(p));
    default: return p.rating?'★ '+p.rating.toFixed(2):'尚無評分';
  }
}
function sortSummary(){ const d=SORT_BY[sortKey]; if(!d.dir) return ''; const [a,b]=sortRev?[d.dir[1],d.dir[0]]:d.dir; return `${d.label}：${a} → ${b}`; }
const sortNote = () => sortKey==='default' ? '' : `<span class="sort-note">・${sortSummary()}</span>`;
const detailMeta = () => ['today','season','weight'].includes(sortKey);
function rerender(){ const q=searchInput.value.trim(); if(q) runSearch(q); else if(mode==='all') renderAll(); else if(mode==='vial') renderVials(); else renderFamily(activeFamily||categories[0]); }
let viewMode = (()=>{ try{ return localStorage.getItem('fw-view')==='grid'?'grid':'detail'; }catch(e){ return 'detail'; } })();
function thumbHtml(p){ const src=p.thumb||p.img; const fb=(p.img_fallback&&p.img_fallback!==src)?p.img_fallback:'';
  return `<div class="thumb${p.thumb?' is3d':''}">${src?`<img src="${src}" alt="" loading="lazy" data-fb="${fb}" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb='';}else{this.style.visibility='hidden';}">`:''}${p.model3d?'<span class="t3d">香境</span>':''}</div>`; }
function miniCardHtml(p,famColor,opts){ opts=opts||{}; const pkey=(opts.is_sample?'VIAL|':'')+p.brand+'|'+p.name_en;
  return `<div class="card mini" data-pkey="${pkey}" style="--fam-color:${famColor}">${thumbHtml(p)}<div class="brand">${p.brand}</div><div class="mini-name">${p.name_en}</div>${p.name_zh?`<div class="mini-zh">${p.name_zh}</div>`:''}<div class="mini-rate">${sortMeta(p)}</div></div>`; }
function cardsHtml(list){ return `<div class="cards${viewMode==='grid'?' compact':''}">${list.map(x=>viewMode==='grid'?miniCardHtml(x.p,x.famColor,x.opts):cardHtml(x.p,x.famColor,x.opts)).join('')}</div>`; }
function syncViewbar(){ syncFamBtn(); document.getElementById('vb-all').classList.toggle('active', mode==='all' && !searchInput.value.trim());
  const strip=document.getElementById('fam-strip'); if(strip){ const q=searchInput.value.trim(); strip.querySelectorAll('.fam-chip').forEach(c=>{ const on=!q && ((mode==='all'&&c.dataset.fam==='__all')||(mode==='main'&&c.dataset.fam===activeFamily)); c.classList.toggle('active',on); c.setAttribute('aria-pressed',on);
    if(on){ const l=c.offsetLeft-20, r=l+c.offsetWidth+40; if(l<strip.scrollLeft||r>strip.scrollLeft+strip.clientWidth) strip.scrollLeft=l; } }); }
  syncSortbar(); }

function starsHtml(rating){ if(!rating) return '<span class="no-rating">尚無評分</span>';
  const pct=(rating/5)*100; return `<span class="stars"><span class="stars-off">★★★★★</span><span class="stars-on" style="width:${pct}%">★★★★★</span></span><span class="rating-num">${rating.toFixed(2)}</span>`; }
function seasonCellsHtml(tags,votes,showNum){ const mx=votes?Math.max(1,...Object.values(votes)):1;
  return ['冬','春','夏','秋'].map(s=>{ const v=votes?votes[s]:null; const r=votes?v/mx:(tags&&tags.includes(s)?1:0);
    const style=votes?` style="--sv:${Math.round(r*100)}%"`:'';
    return `<div class="season-cell ${tags&&tags.includes(s)?'on':''}${votes?' voted':''}"${style} title="${v!==null?s+'季 '+v.toLocaleString()+' 票':''}">${s}${showNum&&v!==null?`<small>${v.toLocaleString()}</small>`:''}</div>`; }).join(''); }
function dayNightText(p,showNum){ if(!p.day_night) return ''; const v=p.day_night_votes;
  return showNum&&v?`${p.day_night}<span class="dn-num">日 ${v['日'].toLocaleString()} · 夜 ${v['夜'].toLocaleString()}</span>`:p.day_night; }
const PERF_SCALE={
  longevity:{max:5, words:['很短','短','中等','持久','非常持久']},
  sillage:{max:4, words:['貼膚','中等','強','非常強']}
};
function perfWord(kind,val){ const w=PERF_SCALE[kind].words; return w[Math.max(0,Math.min(w.length-1,Math.round(val)-1))]; }
function perfRowHtml(label,val,kind,dist,na){ if(val===null||val===undefined) return `<div class="perf-row"><div class="plabel">${label}</div><div class="perf-na">${na||'尚無資料'}</div></div>`;
  const sc=PERF_SCALE[kind]; const pct=Math.max(0,Math.min(100,(val-1)/(sc.max-1)*100));
  const n=dist?dist.reduce((a,b)=>a+b,0):0;
  const tip=dist?sc.words.map((w,i)=>`${w} ${dist[i]}`).join('、')+`（共 ${n} 票）`:'';
  return `<div class="perf-row" title="${tip}"><div class="plabel">${label}</div><div class="perf-bar-track"><div class="perf-bar-fill" style="width:${pct}%"></div></div><div class="perf-val"><span class="perf-word">${perfWord(kind,val)}</span>${val.toFixed(1)}</div></div>`; }
function perfDistHtml(kind,dist){ if(!dist) return ''; const sc=PERF_SCALE[kind]; const n=dist.reduce((a,b)=>a+b,0); if(!n) return '';
  return `<div class="perf-dist">${sc.words.map((w,i)=>`<span>${w}<b>${dist[i].toLocaleString()}</b></span>`).join('')}</div>`; }
function perfVotesText(p){ const a=p.longevity_votes?p.longevity_votes.reduce((x,y)=>x+y,0):0, b=p.sillage_votes?p.sillage_votes.reduce((x,y)=>x+y,0):0;
  return (a||b)?`（持香 ${a.toLocaleString()} 票、擴香 ${b.toLocaleString()} 票）`:''; }
function perfSourceText(src){ if(!src) return null; if(src==='fragrantica') return 'Fragrantica 會員投票'; if(src==='official') return '品牌官網';
  if(src.startsWith('fragrantica')) return 'Fragrantica 評價數據'+(src.includes('（')?' '+src.slice(src.indexOf('（')):'');
  if(src.startsWith('parfumo')) return 'Parfumo 輔助數據'+(src.includes('(')?' '+src.slice(src.indexOf('(')):''); return null; }

function noteChip(name, terms){
  const meta = noteMeta[name.toLowerCase()];
  const hit = terms && terms.some(t=>name.toLowerCase().includes(t) || (meta&&meta.zh&&meta.zh.includes(t)));
  const img = meta&&meta.img ? `<img src="${meta.img}" loading="lazy" alt="" onerror="this.style.visibility='hidden'">` : '';
  const zh = meta&&meta.zh ? meta.zh : name;
  const en = (meta&&meta.zh) ? `<span class="nc-en">${name}</span>` : '';
  return `<span class="note-chip ${hit?'hit':''}" title="${name}">${img}<span class="nc-txt"><span class="nc-zh">${zh}</span>${en}</span></span>`;
}
function flatNotes(notes){ if(!notes) return []; if(notes.top&&notes.top.length) return [...notes.top,...notes.middle,...notes.base]; return notes.flat||[]; }
function cardNoteChips(notes, terms){
  const all = flatNotes(notes); if(!all.length) return '';
  const shown = all.slice(0,6), more = all.length-shown.length;
  return `<div class="note-label">主要香材</div><div class="note-chips">${shown.map(n=>noteChip(n,terms)).join('')}${more>0?`<span class="note-chip more">＋${more}</span>`:''}</div>`;
}
function modalNotes(notes, terms){
  if(!notes) return '';
  if(notes.top&&notes.top.length){
    const tier=(tag,arr)=>arr.length?`<div class="tier-row"><span class="tier-tag">${tag}</span><div class="note-chips">${arr.map(n=>noteChip(n,terms)).join('')}</div></div>`:'';
    return tier('前調 TOP',notes.top)+tier('中調 HEART',notes.middle)+tier('後調 BASE',notes.base);
  }
  if(notes.flat&&notes.flat.length) return `<div class="note-chips">${notes.flat.map(n=>noteChip(n,terms)).join('')}</div>`;
  return `<div class="perf-na">香材資料缺漏</div>`;
}

function cardHtml(p, famColor, opts){
  opts=opts||{}; const terms=opts.terms||[];
  const votes=p.votes?`${p.votes.toLocaleString()} 人評分`:'';
  const accordTags=(p.accords||[]).slice(0,6).map(a=>`<span class="accord-tag ${terms.some(t=>a.toLowerCase().includes(t)||accordZh(a).includes(t))?'hit':''}">${accordZh(a)}</span>`).join('');
  const dn=p.day_night?`<span class="daynight">${dayNightText(p,false)}</span>`:'';
  const note=p.note?`<div class="card-note">${ICON.note}<span>${p.note}</span></div>`:'';
  const srcText=perfSourceText(p.perf_source);
  const vial = opts.is_sample?`<span class="vial-badge">🧪 SCENT VIAL 試香</span>`:'';
  let famBadges='';
  if(opts.families&&opts.families.length){ famBadges=`<div class="fam-badges">${vial}${opts.families.map(f=>`<span class="fam-badge" style="background:${familyColors[f]}">${f.split('. ')[1]}</span>`).join('')}</div>`; }
  else if(vial){ famBadges=`<div class="fam-badges">${vial}</div>`; }
  const pkey=(opts.is_sample?'VIAL|':'')+p.brand+'|'+p.name_en;
  const perfBlock = opts.is_sample ? '' : `<div class="perf-block">${perfRowHtml('持香度',p.longevity,'longevity',p.longevity_votes,p.perf_note&&'約 4 小時（官方）')}${perfRowHtml('擴香度',p.sillage,'sillage',p.sillage_votes)}${srcText?`<div class="perf-source">來源：${srcText}${perfVotesText(p)}</div>`:''}</div>`;
  const seasonBlock = (opts.is_sample||!p.season_votes) ? '' : `<div class="season-block"><div class="season-cells">${seasonCellsHtml(p.season_tags,p.season_votes,false)}</div>${dn}</div>`;
  return `<div class="card" data-pkey="${pkey}" style="--fam-color:${famColor}">
    <div class="card-head">${thumbHtml(p)}<div class="ch-info">
    <div class="brand">${p.brand}</div>
    <div class="names"><span class="name-en">${p.name_en}</span> ${p.name_zh?`<span class="name-zh">${p.name_zh}</span>`:''}</div>
    ${famBadges}
    <div class="row">${starsHtml(p.rating)}<span class="votes">${votes}</span></div>
    ${detailMeta()&&!opts.is_sample?`<div class="sort-metric">${sortMeta(p)}</div>`:''}
    </div></div>
    <div class="accord-tags">${accordTags}</div>
    ${cardNoteChips(p.notes,terms)}
    ${perfBlock}${seasonBlock}${note}
  </div>`;
}

function openModal(pkey){
  const entry=perfIndex[pkey]; if(!entry) return; modal.dataset.pkey=pkey;
  const p=entry.p, families=entry.families, isv=entry.is_sample;
  const famColor=familyColors[families[0]];
  const votes=p.votes?`${p.votes.toLocaleString()} 人評分`:'';
  const srcText=perfSourceText(p.perf_source);
  const fb = (p.img_fallback && p.img_fallback!==p.img) ? p.img_fallback : '';
  const photo = p.img ? `<div class="bottle-frame" data-v="photo"><img src="${p.img}" alt="${p.name_en} 商品圖" loading="lazy" data-fb="${fb}" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb='';}else{this.parentNode.remove();const m=document.querySelector('.modal-bottle');if(m&&!m.querySelector('.bottle-frame')){m.querySelector('.noimg').style.display='block';}const sw=document.querySelector('.bottle-switch');if(sw)sw.remove();const f=document.querySelector('.bottle-frame.is3d');if(f)f.hidden=false;}"></div>` : '';
  const m3d = p.thumb ? (p.model3d ? `<a class="bottle-frame is3d" data-v="3d" href="${p.model3d}" aria-label="走進 ${p.name_en} 的香境"><img src="${p.thumb}" alt=""><span class="bf-go">走進香境 ${ICON.arrow}</span></a>` : `<div class="bottle-frame is3d" data-v="3d"><img src="${p.thumb}" alt="${p.name_en} 香境"></div>`) : '';
  let bv = (()=>{ try{ return localStorage.getItem('fw-bottle')==='photo'?'photo':'3d'; }catch(e){ return '3d'; } })();
  if(!m3d) bv='photo'; if(!photo) bv='3d';
  const both = m3d && photo;

    ? m3d.replace('data-v="3d"', `data-v="3d"${bv==='3d'?'':' hidden'}`) + photo.replace('data-v="photo"', `data-v="photo"${bv==='photo'?'':' hidden'}`) + `<div class="noimg" style="display:none">瓶身圖暫時無法載入</div>`
      + (both ? `<div class="seg bottle-switch" role="group" aria-label="瓶身圖"><button type="button" data-bv="3d" class="${bv==='3d'?'active':''}" aria-pressed="${bv==='3d'}">香境</button><button type="button" data-bv="photo" class="${bv==='photo'?'active':''}" aria-pressed="${bv==='photo'}">商品照</button></div>` : '')
    : `<div class="noimg">暫無瓶身圖</div>`;
  const accords=(p.accords||[]).map(a=>`<span class="accord-tag" style="--fam-color:${famColor}" title="${a}">${accordZh(a)}</span>`).join('');
  const vial=isv?`<span class="vial-badge">🧪 SCENT VIAL 試香</span>`:'';
  const badges=vial+families.map(f=>`<span class="fam-badge" style="background:${familyColors[f]}">${f.split('. ')[1]}</span>`).join('');
  const dn=p.day_night?`<span class="daynight" style="margin-left:10px">${dayNightText(p,true)}</span>`:'';
  const perfSec = isv?'':`<div class="modal-block"><div class="m-section-label">表現 · Performance</div><div class="modal-perf-grid"><div>${perfRowHtml('持香度',p.longevity,'longevity',p.longevity_votes,p.perf_note)}${perfDistHtml('longevity',p.longevity_votes)}</div><div>${perfRowHtml('擴香度',p.sillage,'sillage',p.sillage_votes)}${perfDistHtml('sillage',p.sillage_votes)}</div></div>${srcText?`<div class="perf-source">來源：${srcText}${perfVotesText(p)}</div>`:''}</div>`;
  const seasonSec = isv?'':`<div class="modal-block"><div class="m-section-label">適用季節 · Season（Fragrantica 投票）</div><div class="season-block">${p.season_votes?`<div class="season-cells">${seasonCellsHtml(p.season_tags,p.season_votes,true)}</div>${dn}`:'<div class="perf-na">沒有投票資料</div>'}</div></div>`;
  modal.innerHTML=`<div class="modal-card" style="--fam-color:${famColor}" role="dialog" aria-modal="true" aria-label="${p.name_en}">
    <button class="modal-close" aria-label="關閉">${ICON.close}</button>
    <div class="modal-scroll">
    <div class="modal-top">
      <div class="modal-bottle">${bottle}</div>
      <div class="modal-info">
        <div class="m-brand">${p.brand}</div>
        <div class="m-name">${p.name_en}</div>
        ${p.name_zh?`<div class="m-zh">${p.name_zh}</div>`:'<div class="m-zh"></div>'}
        <div class="fam-badges">${badges}</div>
        <div class="modal-rating">${starsHtml(p.rating)}<span class="votes">${votes}</span></div>
        <div class="m-section-label">香調金字塔 · Scent Notes</div>
        ${modalNotes(p.notes,[])}
      </div>
    </div>
    ${perfSec}${seasonSec}
    <div class="modal-block"><div class="m-section-label">主香調 · Accords${p.accords_note?`（${p.accords_note}）`:''}</div><div class="accord-tags">${accords||'<span class="perf-na">資料缺漏</span>'}</div></div>
    ${p.note?`<div class="m-note">${ICON.note}<span>${p.note}</span></div>`:''}
    <div class="modal-actions">${p.model3d?`<a class="m-link" href="${p.model3d}">走進香境 ${ICON.arrow}</a>`:''}${p.url?`<a class="m-link m-ext" href="${p.url}" target="_blank" rel="noopener">查看 ${p.url_label||'Fragrantica 原文'} ${ICON.ext}</a>`:''}</div>
    </div>
  </div>`;
  clearTimeout(modal._hideT); modal.classList.add('show'); void modal.offsetWidth; modal.classList.add('open'); showDim(); document.body.style.overflow='hidden';
}
function closeModal(){ if(!modal.classList.contains('open')) return; modal.classList.remove('open'); document.body.style.overflow=''; hideDim(); modal._hideT=setTimeout(()=>modal.classList.remove('show'),280); }
modal.addEventListener('click',e=>{ if(e.target===modal||e.target.closest('.modal-close')) { closeModal(); return; }
  const sw=e.target.closest('.bottle-switch button'); if(!sw) return; const v=sw.dataset.bv; try{ localStorage.setItem('fw-bottle',v); }catch(err){}
  modal.querySelectorAll('.bottle-frame').forEach(f=>f.hidden=f.dataset.v!==v);
  modal.querySelectorAll('.bottle-switch button').forEach(b=>{ const on=b.dataset.bv===v; b.classList.toggle('active',on); b.setAttribute('aria-pressed',on); }); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
detail.addEventListener('click',e=>{ const c=e.target.closest('.card'); if(c&&c.dataset.pkey) openModal(c.dataset.pkey); });

function renderFamily(fam){
  mode='main'; activeFamily=fam; searchInput.value=''; searchClear.style.display='none';
  document.getElementById('mode-main').classList.add('active'); document.getElementById('mode-vial').classList.remove('active');
  document.getElementById('wheel-wrap').style.display='flex';
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));
  const node=document.getElementById('node-'+categories.indexOf(fam)); if(node) node.classList.add('active');
  const famColor=familyColors[fam];
  document.getElementById('hub-icon').innerHTML=familyIcons[fam];
  hub.style.setProperty('--hub-color',famColor);
  hub.querySelector('.hub-title').textContent=fam.split('. ')[1];
  hub.querySelector('.hub-sub').innerHTML=`${database[fam].length} 款收藏`;
  const items=applySort(database[fam].map(p=>({p,famColor})));
  detail.innerHTML=`<div class="detail-header" style="--fam-color:${famColor}"><span class="hdr-icon">${familyIcons[fam]}</span><h2>${famName(fam)}</h2><div class="fam-count">${items.length} 款香水</div></div>`+cardsHtml(items);
  syncViewbar();
}

function backToMain(){ document.getElementById('layout').style.gridTemplateColumns=''; if(mode==='all') renderAll(); else renderFamily(activeFamily||categories[0]); }

function runSearch(query){
  query=query.trim().toLowerCase();
  if(!query){ searchClear.style.display='none'; if(mode==='vial') renderVials(); else backToMain(); return; }
  searchClear.style.display='inline-flex';
  document.getElementById('layout').style.gridTemplateColumns='1fr';
  document.getElementById('wheel-wrap').style.display='none';
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));
  const terms=[query]; for(const [zh,en] of Object.entries(aliases)) if(query.includes(zh)) terms.push(en.toLowerCase());
  for(const k in noteMeta){ const z=noteMeta[k].zh; if(z && query.length>=1 && z.includes(query)) terms.push(k); }
  const results=Object.values(perfIndex).filter(({p})=>{
    const hay=[p.brand,p.name_en,p.name_zh||'',(p.accords||[]).join(' '),flatNotes(p.notes).join(' ')].join(' ').toLowerCase();
    return terms.some(t=>hay.includes(t));
  });
  if(!results.length){ detail.innerHTML=`<div class="detail-header"><h2>搜尋結果</h2></div><div class="empty-state">找不到含「${query}」的香水<br>試試 vetiver、rose、oud、tea 等香材</div>`; syncViewbar(); return; }
  detail.innerHTML=`<div class="detail-header"><h2>搜尋結果</h2><div class="fam-count">${results.length} 款符合「${query}」</div></div>`+cardsHtml(applySort(results.map(({p,families,is_sample})=>({p,famColor:familyColors[families[0]],opts:{terms,families,is_sample}}))));
  syncViewbar();
}

(function(){

  const CITIES = [

    ['台中',24.15,120.67],['彰化',24.08,120.54],['嘉義',23.48,120.45],['台南',22.99,120.21],['高雄',22.63,120.30],
    ['屏東',22.67,120.49],['宜蘭',24.76,121.75],['花蓮',23.99,121.60],['台東',22.76,121.14],['澎湖',23.57,119.58],['金門',24.43,118.32]

  function wcode(c){
    if(c===0) return '晴朗'; if(c<=2) return '晴時多雲'; if(c===3) return '陰天';
    if(c===45||c===48) return '有霧'; if(c>=51&&c<=57) return '毛毛雨'; if(c>=61&&c<=67) return '下雨';

  }

  function season(m){ return m<=1||m===11?'冬':m<=4?'春':m<=7?'夏':'秋'; }

  function recommend(wx){
    const feel = wx.isDay ? Math.max(wx.feels, wx.feelsMax ?? wx.feels) : wx.feels;
    const target = Math.max(-1.6, Math.min(1.6, (24 - feel) / 5));   // 32°C → -1.6、24°C → 0、16°C → +1.6

  try{ localStorage.removeItem('fw-recent'); }catch(e){}
  function remember(keys){ try{ const h=readHist().filter(v=>v&&v.id!==visitId&&Date.now()-v.t<5*864e5); h.push({id:visitId,t:Date.now(),k:keys}); h.sort((a,b)=>a.t-b.t); localStorage.setItem('fw-hist',JSON.stringify(h.slice(-8))); }catch(e){} }
  function recentFactor(key){ let f=1; pastVisits.forEach((v,i)=>{ const d=Math.pow(0.72,i); if(v.k[0]===key) f*=1-0.92*d; else if(v.k.includes(key)) f*=1-0.6*d; }); return f; }
  const seenThisVisit = new Set();
  function pickRecs(wx, place){
    const all = recommend(wx); if(!all.length) return [];
    const best = all[0].score;
    const rand = seededRand(visitId+'|'+place+'|'+reroll);
    let pool = all.filter(r=>r.score>=best-1.6).slice(0,14); if(pool.length<6) pool = all.slice(0,6);
    const fresh = pool.filter(r=>!seenThisVisit.has(rkey(r)));
    if(reroll>0 && fresh.length>=3) pool = fresh;
    const cand = pool.map(r=>({r, w:Math.exp((r.score-best)/0.8)*recentFactor(rkey(r))}));
    const out=[];
    while(out.length<3 && cand.length){ const tot=cand.reduce((a,c)=>a+c.w,0); let x=rand()*tot, i=0; for(;i<cand.length-1;i++){ x-=cand[i].w; if(x<=0) break; } out.push(cand.splice(i,1)[0].r); }
    if(out.length<3) out.push(...all.filter(r=>!out.includes(r)).slice(0,3-out.length));
    out.forEach(r=>seenThisVisit.add(rkey(r)));
    remember(out.map(rkey));
    return out;
  }

  function render(wx, place){
    const recs = pickRecs(wx, place);
    window.fwToday = new Map(recommend(wx).map((r,i)=>[rkey(r), i+1]));
    if(sortKey==='today') rerender();
    const feel = Math.round(wx.feels);
    box.innerHTML = `
      <h2 class="today-title">今日香氛</h2>
      <div class="today-head">
        <div class="today-place">${place}<span class="today-time">${wx.isDay?'白天':'夜晚'} ${new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</span></div>
        <div class="today-btns"><button class="today-btn" id="today-shuffle" type="button">換一組</button><button class="today-btn" id="today-change" type="button">換地點</button></div>
      </div>
      <div class="wx-row">
        <div class="wx-big">${Math.round(wx.temp)}°<span>${wx.desc}</span></div>
        <div class="wx-stats">
          <div><span>體感</span><b>${feel}°</b></div>
          <div><span>今日</span><b>${Math.round(wx.min)}–${Math.round(wx.max)}°</b></div>
          <div><span>濕度</span><b>${Math.round(wx.humidity)}%</b></div>
          <div><span>${wx.rainLabel}</span><b>${wx.rainText}</b></div>
        </div>
      </div>
      <div class="picks">${recs.length?pickCard(recs[0],wx,0):''}${recs.length>1?`<div class="picks-more"><div class="picks-cap">也適合</div>${recs.slice(1).map((r,i)=>pickCard(r,wx,i+1)).join('')}</div>`:''}</div>
      <div class="city-picker" id="city-picker" hidden>
        <button class="city" type="button" data-geo="1">目前位置</button>
        ${CITIES.map(c=>`<button class="city" type="button" data-city="${c[0]}">${c[0]}</button>`).join('')}
      </div>`;
    box.querySelectorAll('.pick').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.pkey)));
    document.getElementById('today-change').addEventListener('click',()=>{ const cp=document.getElementById('city-picker'); cp.hidden=!cp.hidden; });
    document.getElementById('today-shuffle').addEventListener('click',()=>{ reroll++; window.fwVisit.reroll=reroll; render(wx, place); });
    box.querySelectorAll('.city').forEach(b=>b.addEventListener('click',()=>{
      if(b.dataset.geo){ save(null); locate(); return; }
      const c=CITIES.find(x=>x[0]===b.dataset.city); save(c[0]); load(c[1],c[2],c[0]);
    }));
  }

  function msg(t){ box.innerHTML = `<h2 class="today-title">今日香氛</h2><div class="today-msg">${t}</div>
    <div class="city-picker">${CITIES.map(c=>`<button class="city" type="button" data-city="${c[0]}">${c[0]}</button>`).join('')}</div>`;
    box.querySelectorAll('.city').forEach(b=>b.addEventListener('click',()=>{ const c=CITIES.find(x=>x[0]===b.dataset.city); save(c[0]); load(c[1],c[2],c[0]); }));
  }

  function save(v){ try{ v?localStorage.setItem('fw-city',v):localStorage.removeItem('fw-city'); }catch(e){} }
  function saved(){ try{ return localStorage.getItem('fw-city'); }catch(e){ return null; } }

  async function placeName(lat,lon){
    try{
      const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh-Hant`);
      const j = await r.json(); return [j.principalSubdivision, j.city||j.locality].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(' ') || '目前位置';
    }catch(e){ return '目前位置'; }
  }

  function getJSON(url, ms){
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), ms);
    return fetch(url,{signal:ctl.signal}).then(r=>{ clearTimeout(t); if(!r.ok) throw new Error(r.status); return r.json(); });
  }

  // 主要來源：Open-Meteo
  async function fromOpenMeteo(lat,lon){
    const res = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
      `&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,is_day`+
      `&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,precipitation_probability_max&timezone=auto&forecast_days=1`, 6000);
    const c=res.current, d=res.daily;
    return { src:'Open-Meteo',
      temp:c.temperature_2m, feels:c.apparent_temperature, humidity:c.relative_humidity_2m, desc:wcode(c.weather_code),
      isDay:c.is_day===1, rainNow:c.precipitation>0.1 || isRainCode(c.weather_code),
      min:d.temperature_2m_min[0], max:d.temperature_2m_max[0], feelsMax:d.apparent_temperature_max[0],
      rainProb:d.precipitation_probability_max[0], rainLabel:'降雨機率', rainText:(d.precipitation_probability_max[0] ?? '–')+'%' };
  }

  // 備援來源：挪威氣象局 MET Norway
  const MET_ZH = [['thunder','雷雨'],['sleet','雨夾雪'],['snow','下雪'],['heavyrainshowers','大陣雨'],['rainshowers','陣雨'],
    ['lightrain','小雨'],['heavyrain','大雨'],['rain','下雨'],['fog','有霧'],['partlycloudy','多雲時晴'],['fair','晴時多雲'],
    ['clearsky','晴朗'],['cloudy','陰天']];
  function feelsLike(t, rh, ws){ const e = rh/100*6.105*Math.exp(17.27*t/(237.7+t)); return t + 0.33*e - 0.70*ws - 4.00; }
  async function fromMet(lat,lon){
    const res = await getJSON(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${(+lat).toFixed(2)}&lon=${(+lon).toFixed(2)}`, 10000);
    const ts = res.properties.timeseries;
    const now = ts[0], d = now.data.instant.details;
    const sym = (now.data.next_1_hours||now.data.next_6_hours||{}).summary?.symbol_code || 'cloudy';
    const today = new Date().toDateString();
    const todays = ts.filter(x=>new Date(x.time).toDateString()===today).map(x=>x.data.instant.details);
    const temps = (todays.length?todays:[d]).map(x=>x.air_temperature);
    const feelsAll = (todays.length?todays:[d]).map(x=>feelsLike(x.air_temperature,x.relative_humidity,x.wind_speed));
    const next12 = ts.slice(0,12).map(x=>x.data.next_1_hours?.details?.precipitation_amount ?? 0);
    const rain12 = next12.reduce((a,b)=>a+b,0);
    const hr = new Date().getHours();
    return { src:'挪威氣象局 MET Norway',
      temp:d.air_temperature, feels:feelsLike(d.air_temperature,d.relative_humidity,d.wind_speed), humidity:d.relative_humidity,
      desc:(MET_ZH.find(([k])=>sym.includes(k))||[,'多雲'])[1],
      isDay: sym.includes('_night') ? false : sym.includes('_day') ? true : (hr>=6 && hr<18),
      rainNow:/rain|sleet|thunder|snow/.test(sym) || (next12[0]||0)>0.1,
      min:Math.min(...temps), max:Math.max(...temps), feelsMax:Math.max(...feelsAll),
      rainProb: Math.round(next12.filter(v=>v>0.1).length/12*100), rainLabel:'12 小時雨量', rainText:rain12.toFixed(1)+' mm' };
  }

  async function load(lat,lon,label){
    box.innerHTML = `<h2 class="today-title">今日香氛</h2><div class="today-msg">正在讀取${label||'所在地'}的天氣…</div>`;
    const placeP = label?Promise.resolve(label):placeName(lat,lon);
    let wx=null;
    try{ wx = await fromOpenMeteo(lat,lon); }catch(e){}
    if(!wx){ try{ wx = await fromMet(lat,lon); }catch(e){} }
    if(!wx){ msg('天氣資料暫時讀不到，請確認網路後重新整理，或直接選城市。'); return; }
    render(wx, await placeP);
  }

  function locate(){
    const city = saved();
    if(city){ const c=CITIES.find(x=>x[0]===city); if(c) return load(c[1],c[2],c[0]); }
    if(!navigator.geolocation){ return msg('這個瀏覽器無法定位，請選城市：'); }
    box.innerHTML = `<h2 class="today-title">今日香氛</h2><div class="today-msg">正在取得你的位置…（請允許瀏覽器使用位置）</div>`;
    navigator.geolocation.getCurrentPosition(
      pos=>load(pos.coords.latitude.toFixed(3), pos.coords.longitude.toFixed(3)),
      ()=>msg('沒有取得位置權限，請選城市：'),
      {timeout:10000, maximumAge:600000}
    );
  }

  window.__fwRecommend = recommend; // 供測試
  locate();
})();

</script>
