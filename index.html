<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoyo 的香調環</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0806; --surface:#14100b; --surface-2:#1d1811; --border:rgba(201,169,106,0.16);
    --border-strong:rgba(201,169,106,0.36); --gold:#c9a96a; --gold-lt:#ecd6a2; --gold-dk:#9c7b3c;
    --gold-grad:linear-gradient(135deg,#f2dfae 0%,#c9a96a 52%,#a8823f 100%);
    --text:#f4efe4; --text-2:#b3a892; --text-muted:#7c7360;
    --serif:"Playfair Display","Noto Serif TC",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","微軟正黑體",sans-serif;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text-2);font-family:var(--sans);margin:0;padding:0 20px 70px;
    background-image:radial-gradient(900px 420px at 50% -120px,rgba(201,169,106,0.14),transparent 70%),radial-gradient(600px 300px at 85% 8%,rgba(201,169,106,0.05),transparent 70%);
    background-repeat:no-repeat;}
  .page{max-width:1320px;margin:0 auto;}
  header{text-align:center;padding:38px 0 8px;}
  .wordmark{font-family:var(--serif);letter-spacing:6px;font-size:12px;color:var(--gold);text-transform:uppercase;margin-bottom:14px;font-weight:500;}
  h1{font-family:var(--serif);font-weight:600;color:var(--text);margin:0 0 10px;font-size:34px;letter-spacing:1px;}
  h1 .ital{font-style:italic;color:var(--gold-lt);font-weight:500;}
  .flourish{width:70px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 12px;}
  .subtitle{color:var(--text-muted);font-size:12.5px;letter-spacing:0.3px;margin-bottom:22px;}

  .toolbar{max-width:720px;margin:0 auto 28px;}
  .modeswitch{display:flex;gap:8px;justify-content:center;margin-bottom:16px;}
  .mode-btn{background:var(--surface);border:1px solid var(--border-strong);color:var(--text-2);border-radius:30px;
    padding:8px 20px;font-size:13px;font-family:inherit;cursor:pointer;letter-spacing:1px;display:flex;align-items:center;gap:7px;}
  .mode-btn.active{background:var(--gold-grad);color:#150f06;font-weight:700;border-color:var(--gold);}
  .search-box{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,rgba(29,24,17,0.9),rgba(20,16,11,0.9));
    border:1px solid var(--border-strong);border-radius:40px;padding:13px 20px;transition:box-shadow .25s,border-color .25s;}
  .search-box:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,106,0.14);}
  .search-box svg{width:18px;height:18px;color:var(--gold);flex-shrink:0;}
  .search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;font-family:inherit;}
  .search-box input::placeholder{color:var(--text-muted);}
  .search-clear{background:transparent;border:1px solid var(--border-strong);color:var(--text-2);border-radius:20px;padding:4px 14px;font-size:12px;cursor:pointer;display:none;letter-spacing:1px;}
  .search-clear:hover{color:var(--gold);border-color:var(--gold);}
  .search-hint{text-align:center;font-size:11.5px;color:var(--text-muted);margin-top:10px;letter-spacing:0.3px;}
  .search-hint b{color:var(--gold);font-weight:600;}

  .layout{display:grid;grid-template-columns:500px 1fr;gap:40px;align-items:start;}
  @media (max-width:1000px){.layout{grid-template-columns:1fr;gap:26px;}.wheel-wrap{position:static !important;}}
  .layout.novial .wheel-wrap{display:flex;}
  .wheel-wrap{display:flex;flex-direction:column;align-items:center;position:sticky;top:18px;}
  .wheel-container{position:relative;width:clamp(320px,92vw,470px);height:clamp(320px,92vw,470px);border-radius:50%;display:flex;justify-content:center;align-items:center;margin:0 auto;}
  .circle-bg{position:absolute;width:100%;height:100%;border:1px dashed var(--border-strong);border-radius:50%;z-index:0;}
  .circle-bg::after{content:"";position:absolute;inset:26px;border:1px solid var(--border);border-radius:50%;}
  .node{position:absolute;width:clamp(66px,17vw,84px);height:clamp(66px,17vw,84px);
    background:radial-gradient(circle at 50% 35%,#211b13,#100c08);border:1.5px solid var(--node-color,var(--gold));
    border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;z-index:2;
    transition:transform .22s ease,box-shadow .22s ease,background .22s ease;box-shadow:0 6px 16px rgba(0,0,0,0.6);user-select:none;}
  .node-icon{line-height:0;}
  .node-icon svg{width:clamp(18px,4.4vw,23px);height:clamp(18px,4.4vw,23px);color:var(--node-color);}
  .node-name{font-size:clamp(10.5px,2.5vw,12px);font-weight:700;color:var(--text);margin-top:3px;line-height:1.15;letter-spacing:0.5px;}
  .node-count{font-size:9px;font-weight:400;color:var(--text-muted);margin-top:1px;}
  .node:hover{transform:scale(1.12);box-shadow:0 0 20px var(--node-glow);}
  .node.active{background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--node-color) 88%,#000),color-mix(in srgb,var(--node-color) 62%,#000));border-color:var(--gold-lt);transform:scale(1.13);box-shadow:0 0 24px var(--node-glow);}
  .node.active .node-icon svg{color:#120d07;}
  .node.active .node-name{color:#fff;}
  .node.active .node-count{color:rgba(255,255,255,0.7);}
  .center-hub{position:absolute;width:clamp(120px,31vw,168px);height:clamp(120px,31vw,168px);
    background:radial-gradient(circle at 50% 40%,#1a140d,#0b0805);border-radius:50%;z-index:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;border:1px solid var(--border-strong);padding:12px;box-shadow:inset 0 0 30px rgba(0,0,0,0.85),0 0 0 6px rgba(10,8,6,0.6);}
  .center-hub .hub-icon{line-height:0;margin-bottom:7px;}
  .center-hub .hub-icon svg{width:32px;height:32px;color:var(--hub-color,var(--gold));}
  .center-hub .hub-title{font-family:var(--serif);font-size:18px;color:var(--text);font-weight:600;}
  .center-hub .hub-sub{font-size:10px;color:var(--text-muted);margin-top:6px;line-height:1.5;letter-spacing:0.5px;}
  .legend-note{margin-top:24px;font-size:11.5px;color:var(--text-muted);text-align:center;max-width:430px;line-height:1.9;}

  .detail-panel{min-height:420px;}
  .detail-header{display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:22px;}
  .detail-header .hdr-icon{line-height:0;}
  .detail-header .hdr-icon svg{width:28px;height:28px;color:var(--fam-color,var(--gold));}
  .detail-header h2{font-family:var(--serif);font-size:25px;color:var(--text);font-weight:600;margin:0;letter-spacing:0.5px;}
  .detail-header .fam-count{font-size:12px;color:var(--text-muted);letter-spacing:1px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(345px,1fr));gap:18px;}
  .card{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-radius:14px;padding:18px 20px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--fam-color,var(--gold));opacity:0.85;}
  .card:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,0.5);}
  .card .brand{font-size:10.5px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;}
  .card .names{margin:4px 0 8px;}
  .card .name-en{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--text);}
  .card .name-zh{font-size:13px;color:var(--text-2);margin-left:3px;}
  .fam-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center;}
  .fam-badge{font-size:10px;padding:2px 9px;border-radius:10px;color:#fff;font-weight:600;letter-spacing:0.5px;}
  .vial-badge{font-size:9.5px;padding:2px 9px;border-radius:10px;color:#150f06;font-weight:700;letter-spacing:1px;background:var(--gold-grad);display:inline-flex;align-items:center;gap:4px;}
  .stars{position:relative;display:inline-block;font-size:13px;letter-spacing:1px;line-height:1;}
  .stars-off{color:#3a3225;}
  .stars-on{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold);}
  .rating-num{color:var(--gold-lt);font-weight:700;font-size:13px;}
  .row{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap;}
  .votes{font-size:11px;color:var(--text-muted);}
  .no-rating{color:var(--text-muted);font-size:12px;}
  .accord-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px;}
  .accord-tag{font-size:10.5px;padding:2px 9px;border-radius:11px;background:color-mix(in srgb,var(--fam-color,var(--gold)) 20%,var(--surface-2));color:var(--text-2);border:1px solid color-mix(in srgb,var(--fam-color,var(--gold)) 42%,transparent);white-space:nowrap;}
  .accord-tag.hit{background:var(--gold-grad);color:#150f06;font-weight:700;border-color:var(--gold);}

  /* note chips with image + chinese */
  .note-label{font-size:10.5px;color:var(--gold);letter-spacing:0.5px;margin:2px 0 6px;}
  .note-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
  .note-chip{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 10px 3px 3px;}
  .note-chip img{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#241d13;}
  .note-chip .nc-zh{font-size:11.5px;color:var(--text);line-height:1.1;}
  .note-chip .nc-en{font-size:9px;color:var(--text-muted);line-height:1.1;}
  .note-chip.hit{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--surface-2));}
  .note-chip .nc-txt{display:flex;flex-direction:column;}
  .tier-row{margin-bottom:9px;}
  .tier-tag{display:inline-block;font-size:9.5px;letter-spacing:1px;color:#150f06;font-weight:700;background:var(--gold-grad);padding:2px 8px;border-radius:5px;margin-bottom:6px;}

  .perf-block{margin-bottom:11px;}
  .perf-row{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--text-muted);margin-bottom:5px;}
  .perf-row .plabel{width:46px;flex-shrink:0;letter-spacing:0.5px;}
  .perf-bar-track{flex:1;height:6px;background:#2a2117;border-radius:3px;overflow:hidden;}
  .perf-bar-fill{height:100%;background:var(--gold-grad);border-radius:3px;}
  .perf-val{width:30px;text-align:right;font-size:11px;color:var(--gold-lt);flex-shrink:0;font-weight:600;}
  .perf-na{font-size:10.5px;color:var(--text-muted);font-style:italic;}
  .perf-source{font-size:9.5px;color:var(--text-muted);margin-top:3px;}
  .season-block{display:flex;align-items:center;gap:10px;font-size:11px;margin-bottom:4px;}
  .season-cells{display:flex;gap:4px;}
  .season-cell{width:27px;height:23px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);}
  .season-cell.on{background:color-mix(in srgb,var(--gold) 30%,var(--surface-2));color:var(--gold-lt);border-color:var(--gold-dk);font-weight:700;}
  .daynight{font-size:10.5px;color:var(--text-muted);letter-spacing:0.5px;}
  .card-note{margin-top:11px;padding:9px 11px;background:rgba(201,169,106,0.07);border:1px solid rgba(201,169,106,0.28);border-radius:8px;font-size:10.5px;color:var(--gold-lt);line-height:1.65;}
  .card-cta{margin-top:12px;font-size:11px;color:var(--gold);letter-spacing:1px;display:flex;align-items:center;gap:6px;}
  .empty-state{display:flex;align-items:center;justify-content:center;height:320px;color:var(--text-muted);font-size:14px;text-align:center;line-height:1.9;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(3,2,1,0.82);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .25s;}
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .modal-card{background:linear-gradient(180deg,#191309,#0d0a06);border:1px solid var(--border-strong);border-radius:20px;max-width:900px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,0.7);position:relative;overflow:hidden;transform:translateY(14px) scale(0.985);transition:transform .28s;}
  .modal-backdrop.open .modal-card{transform:none;}
  .modal-close{position:absolute;top:16px;right:18px;z-index:5;width:34px;height:34px;border-radius:50%;border:1px solid var(--border-strong);background:rgba(10,8,6,0.6);color:var(--gold);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .modal-close:hover{background:var(--gold);color:#120d07;}
  .modal-top{display:grid;grid-template-columns:300px 1fr;gap:4px;}
  @media (max-width:720px){.modal-top{grid-template-columns:1fr;}}
  .modal-bottle{position:relative;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:radial-gradient(closest-side at 50% 46%,rgba(201,169,106,0.22),rgba(201,169,106,0.05) 60%,transparent 78%);min-height:320px;}
  .modal-bottle img{max-height:320px;max-width:230px;object-fit:contain;filter:drop-shadow(0 18px 30px rgba(0,0,0,0.6));border-radius:6px;background:#fff2;}
  .modal-bottle .noimg{color:var(--text-muted);font-size:12px;text-align:center;line-height:1.8;}
  .modal-info{padding:40px 34px 30px 8px;}
  @media (max-width:720px){.modal-info{padding:6px 26px 30px;}}
  .modal-info .m-brand{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;}
  .modal-info .m-name{font-family:var(--serif);font-size:26px;color:var(--text);font-weight:600;margin:6px 0 2px;line-height:1.2;}
  .modal-info .m-zh{font-size:15px;color:var(--text-2);margin-bottom:12px;}
  .modal-rating{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .m-section-label{font-size:10.5px;letter-spacing:2.5px;color:var(--gold);text-transform:uppercase;margin:20px 0 10px;display:flex;align-items:center;gap:10px;}
  .m-section-label::after{content:"";flex:1;height:1px;background:var(--border);}
  .modal-block{padding:0 34px 8px 34px;}
  @media (max-width:720px){.modal-block{padding:0 26px 8px;}}
  .modal-perf-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  @media (max-width:500px){.modal-perf-grid{grid-template-columns:1fr;gap:10px;}}
  .m-link{display:inline-flex;align-items:center;gap:8px;margin:8px 34px 34px;padding:11px 22px;background:var(--gold-grad);color:#150f06;font-weight:700;font-size:12.5px;letter-spacing:1px;border-radius:30px;text-decoration:none;}
  .m-link:hover{filter:brightness(1.07);}
  .m-note{margin:4px 34px 20px;padding:11px 14px;background:rgba(201,169,106,0.08);border:1px solid rgba(201,169,106,0.3);border-radius:10px;font-size:11px;color:var(--gold-lt);line-height:1.7;}
  footer{max-width:1320px;margin:54px auto 0;padding-top:22px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-muted);line-height:2;}
  footer b{color:var(--gold);font-weight:600;letter-spacing:1px;}
  /* 今日香氛 */
  .today{max-width:720px;margin:0 auto 30px;background:linear-gradient(180deg,rgba(29,24,17,0.92),rgba(20,16,11,0.92));
    border:1px solid var(--border-strong);border-radius:18px;padding:20px 22px;}
  .today-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .today-label{font-family:var(--serif);font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
  .today-place{color:var(--text);font-size:17px;margin-top:6px;font-weight:600;}
  .today-time{color:var(--text-muted);font-size:12px;font-weight:400;margin-left:10px;}
  .today-btn{background:transparent;border:1px solid var(--border-strong);color:var(--text-2);border-radius:20px;padding:5px 14px;font-size:12px;font-family:inherit;cursor:pointer;flex-shrink:0;}
  .today-btn:hover,.today-btn:focus-visible{color:var(--gold);border-color:var(--gold);outline:none;}
  .today-msg{color:var(--text-2);font-size:13.5px;margin-top:10px;line-height:1.7;}
  .wx-row{display:flex;align-items:center;gap:22px;margin:16px 0 18px;flex-wrap:wrap;}
  .wx-big{font-family:var(--serif);font-size:46px;color:var(--text);line-height:1;display:flex;align-items:baseline;gap:10px;}
  .wx-big span{font-family:var(--sans);font-size:14px;color:var(--gold-lt);}
  .wx-stats{display:grid;grid-template-columns:repeat(4,auto);gap:4px 18px;flex:1;min-width:0;}
  .wx-stats div{display:flex;flex-direction:column;gap:2px;}
  .wx-stats span{font-size:11px;color:var(--text-muted);letter-spacing:.5px;}
  .wx-stats b{font-size:15px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
  @media (max-width:480px){.wx-stats{grid-template-columns:repeat(2,auto);}}
  .picks{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;}
  @media (max-width:700px){.picks{grid-template-columns:1fr;}}
  .pick{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;
    background:var(--surface);border:1px solid var(--border);transition:border-color .2s;min-width:0;}
  .pick:hover,.pick:focus-visible{border-color:var(--gold);}
  .pick-main{border-color:var(--border-strong);background:linear-gradient(160deg,rgba(201,169,106,0.14),var(--surface) 60%);}
  .pick-rank{font-size:10.5px;letter-spacing:2px;color:var(--gold);}
  .pick-brand{font-size:11px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-top:2px;}
  .pick-name{font-family:var(--serif);font-size:17px;color:var(--text);line-height:1.3;}
  .pick-main .pick-name{font-size:20px;}
  .pick-zh{font-family:var(--sans);font-size:12.5px;color:var(--text-2);}
  .pick-why{font-size:12.5px;color:var(--text-2);line-height:1.65;margin-top:4px;}
  .pick-why b{color:var(--gold-lt);font-weight:500;}
  .today-src{font-size:11px;color:var(--text-muted);margin-top:14px;line-height:1.7;}
  .city-picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .city{background:var(--surface);border:1px solid var(--border);color:var(--text-2);border-radius:16px;padding:5px 12px;font-size:12.5px;font-family:inherit;cursor:pointer;}
  .city:hover,.city:focus-visible{border-color:var(--gold);color:var(--gold);outline:none;}
  .city-picker[hidden]{display:none;}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="wordmark">Yoyo · Fragrance Collection</div>
    <h1>我的香水<span class="ital"> 香調環</span></h1>
    <div class="flourish"></div>
    <div class="subtitle">27 支收藏，依主香調排成一圈；點節點瀏覽，點卡片看瓶身、香調金字塔與香材圖鑑</div>
  </header>

  <section class="today" id="today" aria-live="polite"></section>

  <div class="toolbar">
    <div class="modeswitch" style="display:none">
      <button class="mode-btn active" id="mode-main">🌸 主收藏</button>
      <button class="mode-btn" id="mode-vial">🧪 試香櫃 <span id="vial-count"></span></button>
    </div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search-input" type="text" placeholder="搜尋香材、香調或香水名稱，例如：vetiver、茶、海鹽、木質、Le Labo" autocomplete="off">
      <button class="search-clear" id="search-clear">清除</button>
    </div>
    <div class="search-hint">支援中英文香材名與品牌，命中的香材以<b>金色</b>標示。</div>
  </div>

  <div class="layout" id="layout">
    <div class="wheel-wrap" id="wheel-wrap">
      <div class="wheel-container" id="wheel">
        <div class="circle-bg"></div>

"10.8\" height=\"10.8\" rx=\"2.2\" fill=\"none\" stroke=\"#0a0806\" stroke-width=\"0.9\" stroke-dasharray=\"2 1.6\" opacity=\"0.55\"/></svg>", "9. 木質調": "<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\" fill=\"currentColor\"/><circle cx=\"12\" cy=\"12\" r=\"5.8\" fill=\"none\" stroke=\"#0a0806\" stroke-width=\"1\" opacity=\"0.4\"/><circle cx=\"12\" cy=\"12\" r=\"2.8\" fill=\"none\" stroke=\"#0a0806\" stroke-width=\"1\" opacity=\"0.4\"/></svg>", "10. 東方調": "<svg viewBox=\"0 0 24 24\"><path d=\"M6 4h12l3 5-9 11L3 9z\" fill=\"currentColor\"/><path d=\"M3 9h18M9 4l3 16M15 4l-3 16\" stroke=\"#0a0806\" stroke-width=\"0.8\" fill=\"none\" opacity=\"0.4\"/></svg>", "11. 美食調": "<svg viewBox=\"0 0 24 24\"><path d=\"M6.5 11h11l-1.6 8.2h-7.8z\" fill=\"currentColor\"/><path d=\"M6 11a6 4.2 0 0 1 12 0z\" fill=\"currentColor\"/><circle cx=\"12\" cy=\"4.8\" r=\"1.7\" fill=\"currentColor\"/></svg>", "12. 花香調": "<svg viewBox=\"0 0 24 24\"><g fill=\"currentColor\"><circle cx=\"12\" cy=\"6\" r=\"3.1\"/><circle cx=\"6\" cy=\"12\" r=\"3.1\"/><circle cx=\"18\" cy=\"12\" r=\"3.1\"/><circle cx=\"9\" cy=\"17.2\" r=\"3.1\"/><circle cx=\"15\" cy=\"17.2\" r=\"3.1\"/></g><circle cx=\"12\" cy=\"12\" r=\"2.5\" fill=\"#0a0806\" opacity=\"0.5\"/></svg>", "13. 果香調": "<svg viewBox=\"0 0 24 24\"><path d=\"M7 8.5c4.2-3.2 8-3.2 10.4-4.4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><circle cx=\"7\" cy=\"15.2\" r=\"4.1\" fill=\"currentColor\"/><circle cx=\"16\" cy=\"14.2\" r=\"4.1\" fill=\"currentColor\"/></svg>"}</script>
<script type="application/json" id="aliases">{"玫瑰": "rose", "茉莉": "jasmine", "香根草": "vetiver", "岩蘭草": "vetiver", "檀香": "sandalwood", "雪松": "cedar", "香柏": "cedar", "沉香": "oud", "烏木": "oud", "香草": "vanilla", "廣藿香": "patchouli", "佛手柑": "bergamot", "香檸檬": "bergamot", "皮革": "leather", "琥珀": "amber", "麝香": "musk", "薰衣草": "lavender", "茶": "tea", "伯爵茶": "earl grey", "綠茶": "green tea", "瑪黛": "mate", "菸草": "tobacco", "煙": "smoke", "焚香": "incense", "乳香": "incense", "柑橘": "citrus", "檸檬": "lemon", "柳橙": "orange", "橙": "orange", "葡萄柚": "grapefruit", "無花果": "fig", "薄荷": "mint", "胡椒": "pepper", "生薑": "ginger", "薑": "ginger", "荳蔻": "cardamom", "豆蔻": "cardamom", "鳶尾": "iris", "橡木苔": "oakmoss", "苔": "moss", "紫羅蘭": "violet", "桃": "peach", "蘋果": "apple", "鳳梨": "pineapple", "海": "marine", "鹽": "salt", "水": "aquatic", "木": "woody", "花": "floral", "果": "fruit", "甜": "sweet", "柚": "grapefruit", "香料": "spicy", "樹脂": "balsamic", "柏": "cypress", "橙花": "orange blossom", "茴香": "anise", "咖啡": "coffee", "焦糖": "caramel", "椰": "coconut", "菸": "tobacco", "茶香": "tea", "晚香玉": "tuberose"}</script>
<script>
const database = JSON.parse(document.getElementById('wheel-data').textContent);
const sampleList = JSON.parse(document.getElementById('samples-data').textContent);
const noteMetaRaw = JSON.parse(document.getElementById('note-meta').textContent);
const familyColors = JSON.parse(document.getElementById('family-colors').textContent);
const familyIcons = JSON.parse(document.getElementById('family-icons').textContent);
const aliases = JSON.parse(document.getElementById('aliases').textContent);
const categories = Object.keys(database);

// case-insensitive note meta lookup
const noteMeta = {};
for (const k in noteMetaRaw) noteMeta[k.toLowerCase()] = noteMetaRaw[k];

const wheel = document.getElementById('wheel');
const hub = document.getElementById('hub');
const detail = document.getElementById('detail');
const modal = document.getElementById('modal');
const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
document.getElementById('vial-count').textContent = '('+sampleList.length+')';

// unified index for search: mains + samples
const perfIndex = {};
categories.forEach(fam => database[fam].forEach(p => {
  const key = p.brand+'|'+p.name_en;
  if(!perfIndex[key]) perfIndex[key]={p, families:[], is_sample:false};
  perfIndex[key].families.push(fam);
}));
sampleList.forEach(p => {
  const key = 'VIAL|'+p.brand+'|'+p.name_en;
  perfIndex[key]={p, families:[p.family], is_sample:true};
});

let activeFamily=null, mode='main';

function starsHtml(rating){ if(!rating) return '<span class="no-rating">尚無評分</span>';
  const pct=(rating/5)*100; return `<span class="stars"><span class="stars-off">★★★★★</span><span class="stars-on" style="width:${pct}%">★★★★★</span></span><span class="rating-num">${rating.toFixed(2)}</span>`; }
function seasonCellsHtml(tags){ return ['冬','春','夏','秋'].map(s=>`<div class="season-cell ${tags&&tags.includes(s)?'on':''}">${s}</div>`).join(''); }
function perfRowHtml(label,val){ if(val===null||val===undefined) return `<div class="perf-row"><div class="plabel">${label}</div><div class="perf-na">尚無資料</div></div>`;
  const pct=Math.max(0,Math.min(100,val*10)); return `<div class="perf-row"><div class="plabel">${label}</div><div class="perf-bar-track"><div class="perf-bar-fill" style="width:${pct}%"></div></div><div class="perf-val">${val.toFixed(1)}</div></div>`; }
function perfSourceText(src){ if(!src) return null; if(src==='fragrantica') return 'Fragrantica 評價數據';
  if(src.startsWith('fragrantica')) return 'Fragrantica 評價數據'+(src.includes('（')?' '+src.slice(src.indexOf('（')):'');
  if(src.startsWith('parfumo')) return 'Parfumo 輔助數據'+(src.includes('(')?' '+src.slice(src.indexOf('(')):''); return null; }

function noteChip(name, terms){
  const meta = noteMeta[name.toLowerCase()];
  const hit = terms && terms.some(t=>name.toLowerCase().includes(t) || (meta&&meta.zh&&meta.zh.includes(t)));
  const img = meta&&meta.img ? `<img src="${meta.img}" loading="lazy" alt="" onerror="this.style.visibility='hidden'">` : '';
  const zh = meta&&meta.zh ? meta.zh : name;
  const en = (meta&&meta.zh) ? `<span class="nc-en">${name}</span>` : '';
  return `<span class="note-chip ${hit?'hit':''}" title="${name}">${img}<span class="nc-txt"><span class="nc-zh">${zh}</span>${en}</span></span>`;
}
function flatNotes(notes){ if(!notes) return []; if(notes.top&&notes.top.length) return [...notes.top,...notes.middle,...notes.base]; return notes.flat||[]; }
function cardNoteChips(notes, terms){
  const all = flatNotes(notes); if(!all.length) return '';
  return `<div class="note-label">主要香材</div><div class="note-chips">${all.slice(0,14).map(n=>noteChip(n,terms)).join('')}</div>`;
}
function modalNotes(notes, terms){
  if(!notes) return '';
  if(notes.top&&notes.top.length){
    const tier=(tag,arr)=>arr.length?`<div class="tier-row"><span class="tier-tag">${tag}</span><div class="note-chips">${arr.map(n=>noteChip(n,terms)).join('')}</div></div>`:'';
    return tier('前調 TOP',notes.top)+tier('中調 HEART',notes.middle)+tier('後調 BASE',notes.base);
  }
  if(notes.flat&&notes.flat.length) return `<div class="note-chips">${notes.flat.map(n=>noteChip(n,terms)).join('')}</div>`;
  return `<div class="perf-na">香材資料缺漏</div>`;
}

function cardHtml(p, famColor, opts){
  opts=opts||{}; const terms=opts.terms||[];
  const votes=p.votes?`${p.votes.toLocaleString()} 人評分`:'';
  const accordTags=(p.accords||[]).slice(0,6).map(a=>`<span class="accord-tag ${terms.some(t=>a.toLowerCase().includes(t))?'hit':''}">${a}</span>`).join('');
  const dn=p.day_night?`<span class="daynight">${p.day_night}</span>`:'';
  const note=p.note?`<div class="card-note">⚑ ${p.note}</div>`:'';
  const srcText=perfSourceText(p.perf_source);
  const vial = opts.is_sample?`<span class="vial-badge">🧪 SCENT VIAL 試香</span>`:'';
  let famBadges='';
  if(opts.families&&opts.families.length){ famBadges=`<div class="fam-badges">${vial}${opts.families.map(f=>`<span class="fam-badge" style="background:${familyColors[f]}">${f.split('. ')[1]}</span>`).join('')}</div>`; }
  else if(vial){ famBadges=`<div class="fam-badges">${vial}</div>`; }
  const pkey=(opts.is_sample?'VIAL|':'')+p.brand+'|'+p.name_en;
  const perfBlock = opts.is_sample ? '' : `<div class="perf-block">${perfRowHtml('持香度',p.longevity)}${perfRowHtml('擴香度',p.sillage)}${srcText?`<div class="perf-source">來源：${srcText}</div>`:''}</div>`;
  const seasonBlock = opts.is_sample ? '' : `<div class="season-block"><div class="season-cells">${seasonCellsHtml(p.season_tags)}</div>${dn}</div>`;
  return `<div class="card" data-pkey="${pkey}" style="--fam-color:${famColor}">
    <div class="brand">${p.brand}</div>
    <div class="names"><span class="name-en">${p.name_en}</span> ${p.name_zh?`<span class="name-zh">${p.name_zh}</span>`:''}</div>
    ${famBadges}
    <div class="row">${starsHtml(p.rating)}<span class="votes">${votes}</span></div>
    <div class="accord-tags">${accordTags}</div>
    ${cardNoteChips(p.notes,terms)}
    ${perfBlock}${seasonBlock}${note}
    <div class="card-cta">點擊查看瓶身與香材圖鑑 →</div>
  </div>`;
}

function openModal(pkey){
  const entry=perfIndex[pkey]; if(!entry) return;
  const p=entry.p, families=entry.families, isv=entry.is_sample;
  const famColor=familyColors[families[0]];
  const votes=p.votes?`${p.votes.toLocaleString()} 人評分`:'';
  const srcText=perfSourceText(p.perf_source);
  const fb = (p.img_fallback && p.img_fallback!==p.img) ? p.img_fallback : '';
  const bottle=p.img?`<img src="${p.img}" alt="${p.name_en}" loading="lazy" data-fb="${fb}" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb='';}else{this.style.display='none';this.parentNode.querySelector('.noimg').style.display='block';}"><div class="noimg" style="display:none">瓶身圖暫時無法載入</div>`:`<div class="noimg">暫無瓶身圖</div>`;
  const accords=(p.accords||[]).map(a=>`<span class="accord-tag" style="--fam-color:${famColor}">${a}</span>`).join('');
  const vial=isv?`<span class="vial-badge">🧪 SCENT VIAL 試香</span>`:'';
  const badges=vial+families.map(f=>`<span class="fam-badge" style="background:${familyColors[f]}">${f.split('. ')[1]}</span>`).join('');
  const dn=p.day_night?`<span class="daynight" style="margin-left:10px">${p.day_night}</span>`:'';
  const perfSec = isv?'':`<div class="modal-block"><div class="m-section-label">表現 · Performance</div><div class="modal-perf-grid"><div>${perfRowHtml('持香度',p.longevity)}</div><div>${perfRowHtml('擴香度',p.sillage)}</div></div>${srcText?`<div class="perf-source">來源：${srcText}</div>`:''}</div>`;
  const seasonSec = isv?'':`<div class="modal-block"><div class="m-section-label">適用季節 · Season（依香調推估）</div><div class="season-block"><div class="season-cells">${seasonCellsHtml(p.season_tags)}</div>${dn}</div></div>`;
  modal.innerHTML=`<div class="modal-card" style="--fam-color:${famColor}">
    <button class="modal-close" aria-label="關閉">&times;</button>
    <div class="modal-top">
      <div class="modal-bottle">${bottle}</div>
      <div class="modal-info">
        <div class="m-brand">${p.brand}</div>
        <div class="m-name">${p.name_en}</div>
        ${p.name_zh?`<div class="m-zh">${p.name_zh}</div>`:'<div class="m-zh"></div>'}
        <div class="fam-badges">${badges}</div>
        <div class="modal-rating">${starsHtml(p.rating)}<span class="votes">${votes}</span></div>
        <div class="m-section-label">香調金字塔 · Scent Notes</div>
        ${modalNotes(p.notes,[])}
      </div>
    </div>
    ${perfSec}${seasonSec}
    <div class="modal-block"><div class="m-section-label">主香調 · Accords</div><div class="accord-tags">${accords||'<span class="perf-na">資料缺漏</span>'}</div></div>
    ${p.note?`<div class="m-note">⚑ ${p.note}</div>`:''}
    ${p.url?`<a class="m-link" href="${p.url}" target="_blank" rel="noopener">查看 Fragrantica 原文 ↗</a>`:''}
  </div>`;
  modal.classList.add('open'); document.body.style.overflow='hidden';
}
function closeModal(){ modal.classList.remove('open'); document.body.style.overflow=''; }
modal.addEventListener('click',e=>{ if(e.target===modal||e.target.classList.contains('modal-close')) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
detail.addEventListener('click',e=>{ const c=e.target.closest('.card'); if(c&&c.dataset.pkey) openModal(c.dataset.pkey); });

function renderFamily(fam){
  mode='main'; activeFamily=fam; searchInput.value=''; searchClear.style.display='none';
  document.getElementById('mode-main').classList.add('active'); document.getElementById('mode-vial').classList.remove('active');
  document.getElementById('wheel-wrap').style.display='flex';
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));
  const node=document.getElementById('node-'+categories.indexOf(fam)); if(node) node.classList.add('active');
  const famColor=familyColors[fam];
  document.getElementById('hub-icon').innerHTML=familyIcons[fam];
  hub.style.setProperty('--hub-color',famColor);
  hub.querySelector('.hub-title').textContent=fam.split('. ')[1];
  hub.querySelector('.hub-sub').innerHTML=`${database[fam].length} 款收藏`;
  const items=database[fam];
  detail.innerHTML=`<div class="detail-header" style="--fam-color:${famColor}"><span class="hdr-icon">${familyIcons[fam]}</span><h2>${fam}</h2><div class="fam-count">${items.length} 款香水</div></div><div class="cards">${items.map(p=>cardHtml(p,famColor)).join('')}</div>`;
}

function renderVials(){
  mode='vial'; activeFamily=null; searchInput.value=''; searchClear.style.display='none';
  document.getElementById('mode-vial').classList.add('active'); document.getElementById('mode-main').classList.remove('active');
  document.getElementById('wheel-wrap').style.display='none';
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));
  document.getElementById('layout').style.gridTemplateColumns='1fr';
  const cards=sampleList.map(p=>cardHtml(p,familyColors[p.family],{is_sample:true,families:[p.family]})).join('');
  detail.innerHTML=`<div class="detail-header" style="--fam-color:var(--gold)"><span class="hdr-icon" style="font-size:24px">🧪</span><h2>試香櫃 Scent Vials</h2><div class="fam-count">${sampleList.length} 支試香小香</div></div><div class="cards">${cards}</div>`;
}
function backToMain(){ document.getElementById('layout').style.gridTemplateColumns=''; renderFamily(activeFamily||categories[0]); }

function runSearch(query){
  query=query.trim().toLowerCase();
  if(!query){ searchClear.style.display='none'; if(mode==='vial') renderVials(); else backToMain(); return; }
  searchClear.style.display='block';
  document.getElementById('layout').style.gridTemplateColumns='1fr';
  document.getElementById('wheel-wrap').style.display='none';
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('active'));
  const terms=[query]; for(const [zh,en] of Object.entries(aliases)) if(query.includes(zh)) terms.push(en.toLowerCase());
  for(const k in noteMeta){ const z=noteMeta[k].zh; if(z && query.length>=1 && z.includes(query)) terms.push(k); }
  const results=Object.values(perfIndex).filter(({p})=>{
    const hay=[p.brand,p.name_en,p.name_zh||'',(p.accords||[]).join(' '),flatNotes(p.notes).join(' ')].join(' ').toLowerCase();
    return terms.some(t=>hay.includes(t));
  });
  if(!results.length){ detail.innerHTML=`<div class="detail-header"><h2>搜尋結果</h2></div><div class="empty-state">找不到含「${query}」的香水<br>試試 vetiver、rose、oud、tea 等香材</div>`; return; }
  const cards=results.map(({p,families,is_sample})=>cardHtml(p,familyColors[families[0]],{terms,families,is_sample})).join('');
  detail.innerHTML=`<div class="detail-header"><h2>搜尋結果</h2><div class="fam-count">${results.length} 款符合「${query}」</div></div><div class="cards">${cards}</div>`;
}

function currentRadius(){ return wheel.clientWidth/2-46; }
function positionNodes(){ const r=currentRadius(); categories.forEach((cat,i)=>{ const node=document.getElementById('node-'+i); const ang=(i*(360/categories.length))-90, rad=ang*Math.PI/180; node.style.transform=`translate(${Math.round(r*Math.cos(rad))}px,${Math.round(r*Math.sin(rad))}px)`; }); }
categories.forEach((cat,i)=>{ const node=document.createElement('div'); node.className='node'; node.id='node-'+i;
  node.style.setProperty('--node-color',familyColors[cat]); node.style.setProperty('--node-glow',familyColors[cat]+'80');
  node.innerHTML=`<span class="node-icon">${familyIcons[cat]}</span><span class="node-name">${cat.split('. ')[1]}</span><span class="node-count">${database[cat].length} 款</span>`;
  node.addEventListener('click',()=>{document.getElementById('layout').style.gridTemplateColumns='';renderFamily(cat);}); wheel.appendChild(node); });
positionNodes(); window.addEventListener('resize',positionNodes);
searchInput.addEventListener('input',e=>runSearch(e.target.value));
searchClear.addEventListener('click',()=>{ searchInput.value=''; runSearch(''); });
document.getElementById('mode-main').addEventListener('click',()=>{document.getElementById('layout').style.gridTemplateColumns='';renderFamily(activeFamily||categories[0]);});
document.getElementById('mode-vial').addEventListener('click',renderVials);

document.getElementById('footer').innerHTML=`
  <div><b>資料製作說明</b></div>
  <div>· 收藏清單依 Fragrantica 衣櫃「Perfumes I Have」（27 支）整理。</div>
  <div>· 香調、香材、評分與投票數、瓶身圖：取自 Fragrantica.com（瓶身圖與香材小圖需連線載入）。</div>
  <div>· 持香度／擴香度：取自 Parfumo.com 社群評分（10 分制），查無足夠評分者顯示「尚無資料」。</div>
  <div>· 適用季節與日夜：依主香調推估，非實測，可依個人體驗調整。</div>
  <div>· 一支香水可同時歸屬多個香調。　·　資料整理日期：2026-10-17</div>`;

renderFamily(categories[0]);
// ===== 今日香氛：依所在地即時天氣推薦 =====
(function(){
  const box = document.getElementById('today');
  if(!box) return;

  // 收藏去重（一支香水可能在多個香調）
  const uniq = Object.values(perfIndex).filter(e=>!e.is_sample);

  // 香調「重量」：負值清爽、正值厚重
  const WARMTH = {
    'citrus':-2,'aquatic':-2,'marine':-2,'ozonic':-1.8,'salty':-1.5,'fresh':-1.5,'green':-1.2,'herbal':-1,
    'tropical':-0.6,'aromatic':-0.6,'lavender':-0.5,'soapy':-0.5,'fruity':-0.3,'aldehydic':-0.3,'fresh spicy':-0.3,
    'white floral':0,'floral':0,'yellow floral':0.2,'rose':0.2,'musky':0.2,'iris':0.3,'conifer':0.3,
    'mossy':0.5,'powdery':0.6,'earthy':0.6,'woody':0.7,'soft spicy':0.8,'patchouli':1,'animalic':1.2,'sweet':1.2,
    'nutty':1.3,'warm spicy':1.3,'leather':1.3,'smoky':1.4,'cinnamon':1.5,'amber':1.6,'balsamic':1.6,
    'oud':1.8,'vanilla':1.8,'chocolate':2,'cacao':2
  };
  const RAINY = {'earthy':1,'mossy':1,'woody':0.6,'smoky':0.8,'conifer':0.8,'patchouli':0.6};
  const HEAVY_SWEET = {'sweet':1,'vanilla':1,'chocolate':1,'cacao':1,'amber':0.6,'oud':0.6,'balsamic':0.6};
  const ZH = {'citrus':'柑橘','aquatic':'水生','marine':'海洋','ozonic':'臭氧','salty':'鹹','fresh':'清新','green':'綠葉',
    'herbal':'草本','tropical':'熱帶','aromatic':'芳香','lavender':'薰衣草','soapy':'皂感','fruity':'果香','aldehydic':'醛香',
    'fresh spicy':'清爽辛香','white floral':'白花','floral':'花香','yellow floral':'黃花','rose':'玫瑰','musky':'麝香',
    'iris':'鳶尾','conifer':'針葉','mossy':'苔蘚','powdery':'粉感','earthy':'土壤','woody':'木質','soft spicy':'柔和辛香',
    'patchouli':'廣藿香','animalic':'動物','sweet':'甜感','nutty':'堅果','warm spicy':'溫暖辛香','leather':'皮革',
    'smoky':'煙燻','cinnamon':'肉桂','amber':'琥珀','balsamic':'香脂','oud':'沉香','vanilla':'香草','chocolate':'巧克力','cacao':'可可'};

  const CITIES = [
    ['台北',25.04,121.56],['新北',25.01,121.46],['基隆',25.13,121.74],['桃園',24.99,121.31],['新竹',24.80,120.97],
    ['台中',24.15,120.67],['彰化',24.08,120.54],['嘉義',23.48,120.45],['台南',22.99,120.21],['高雄',22.63,120.30],
    ['屏東',22.67,120.49],['宜蘭',24.76,121.75],['花蓮',23.99,121.60],['台東',22.76,121.14],['澎湖',23.57,119.58],['金門',24.43,118.32]
  ];

  function wcode(c){
    if(c===0) return '晴朗'; if(c<=2) return '晴時多雲'; if(c===3) return '陰天';
    if(c===45||c===48) return '有霧'; if(c>=51&&c<=57) return '毛毛雨'; if(c>=61&&c<=67) return '下雨';
    if(c>=71&&c<=77) return '下雪'; if(c>=80&&c<=82) return '陣雨'; if(c>=95) return '雷雨'; return '多雲';
  }
  const isRainCode = c => (c>=51&&c<=67)||(c>=80&&c<=82)||c>=95;

  function perfWarmth(p){
    let s=0,w=0; (p.accords||[]).forEach((a,i)=>{ const v=WARMTH[a]; if(v===undefined) return; const k=1/(1+i*0.35); s+=v*k; w+=k; });
    return w? s/w : 0;
  }
  function accordSum(p,map){
    let s=0; (p.accords||[]).forEach((a,i)=>{ if(map[a]) s+=map[a]/(1+i*0.35); }); return s;
  }
  const hasTea = p => flatNotes(p.notes).some(n=>/tea/i.test(n));

  function season(m){ return m<=1||m===11?'冬':m<=4?'春':m<=7?'夏':'秋'; }

  function recommend(wx){
    const feel = wx.isDay ? Math.max(wx.feels, wx.feelsMax ?? wx.feels) : wx.feels;
    const target = Math.max(-1.6, Math.min(1.6, (24 - feel) / 5));   // 32°C → -1.6、24°C → 0、16°C → +1.6
    const rainy = wx.rainNow || wx.rainProb >= 60;
    const muggy = wx.humidity >= 80 && feel >= 26;
    const nowSeason = season(new Date().getMonth());
    return uniq.map(({p})=>{
      const pw = perfWarmth(p);
      let score = 3 - Math.abs(pw - target) * 1.6;
      if(rainy){ score += accordSum(p,RAINY)*0.5 + (hasTea(p)?0.4:0); }
      if(muggy){ score -= accordSum(p,HEAVY_SWEET)*0.6; }
      if(p.day_night) score += (p.day_night==='日間') === wx.isDay ? 0.3 : -0.2;
      if(p.season_tags && p.season_tags.includes(nowSeason)) score += 0.2;
      return {p, score, pw};
    }).sort((a,b)=>b.score-a.score);
  }

  function reason(r, wx){
    const top = (r.p.accords||[]).slice(0,3).map(a=>ZH[a]||a).join('、');
    const feel = Math.round(wx.isDay ? Math.max(wx.feels, wx.feelsMax ?? wx.feels) : wx.feels);
    const rainy = wx.rainNow || wx.rainProb >= 60;
    let why;
    if(feel>=28) why = r.pw<0 ? '天氣熱，清爽的調性不悶' : '天氣熱，這支相對輕盈';
    else if(feel>=22) why = r.pw<0.4 ? '溫度舒適，清新到中性的調性剛好' : '溫度舒適，木質感穩重不厚重';
    else if(feel>=16) why = '天氣微涼，木質辛香更有存在感';
    else why = '天冷，溫暖厚重的調性擴散得開';
    if(rainy && accordSum(r.p,RAINY)>0.5) why += '；雨天的潮濕感跟土壤、木質很搭';
    else if(rainy && hasTea(r.p)) why += '；雨天配茶香很安靜';
    if(wx.humidity>=80 && feel>=26) why += '；濕度高，避開甜膩';
    return `<b>${top}</b>，${why}。`;
  }

  function pickCard(r, wx, rank){
    const p=r.p; const key=p.brand+'|'+p.name_en;
    return `<button class="pick ${rank===0?'pick-main':''}" data-pkey="${key}">
      <span class="pick-rank">${rank===0?'今日首選':'也適合'}</span>
      <span class="pick-brand">${p.brand}</span>
      <span class="pick-name">${p.name_en}${p.name_zh?` <span class="pick-zh">${p.name_zh}</span>`:''}</span>
      <span class="pick-why">${reason(r,wx)}</span>
    </button>`;
  }

  function render(wx, place){
    const recs = recommend(wx).slice(0,3);
    const feel = Math.round(wx.feels);
    box.innerHTML = `
      <div class="today-head">
        <div>
          <div class="today-label">今日香氛 · Today's Scent</div>
          <div class="today-place">${place}<span class="today-time">${wx.isDay?'白天':'夜晚'} ${new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</span></div>
        </div>
        <button class="today-btn" id="today-change" type="button">換地點</button>
      </div>
      <div class="wx-row">
        <div class="wx-big">${Math.round(wx.temp)}°<span>${wx.desc}</span></div>
        <div class="wx-stats">
          <div><span>體感</span><b>${feel}°</b></div>
          <div><span>今日</span><b>${Math.round(wx.min)}–${Math.round(wx.max)}°</b></div>
          <div><span>濕度</span><b>${Math.round(wx.humidity)}%</b></div>
          <div><span>${wx.rainLabel}</span><b>${wx.rainText}</b></div>
        </div>
      </div>
      <div class="picks">${recs.map((r,i)=>pickCard(r,wx,i)).join('')}</div>
      <div class="today-src">天氣：${wx.src}（每次打開即時更新）· 推薦依主香調輕重、體感溫度、濕度、降雨與日夜計算</div>
      <div class="city-picker" id="city-picker" hidden>
        <button class="city" type="button" data-geo="1">目前位置</button>
        ${CITIES.map(c=>`<button class="city" type="button" data-city="${c[0]}">${c[0]}</button>`).join('')}
      </div>`;
    box.querySelectorAll('.pick').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.pkey)));
    document.getElementById('today-change').addEventListener('click',()=>{ const cp=document.getElementById('city-picker'); cp.hidden=!cp.hidden; });
    box.querySelectorAll('.city').forEach(b=>b.addEventListener('click',()=>{
      if(b.dataset.geo){ save(null); locate(); return; }
      const c=CITIES.find(x=>x[0]===b.dataset.city); save(c[0]); load(c[1],c[2],c[0]);
    }));
  }

  function msg(t){ box.innerHTML = `<div class="today-label">今日香氛 · Today's Scent</div><div class="today-msg">${t}</div>
    <div class="city-picker">${CITIES.map(c=>`<button class="city" type="button" data-city="${c[0]}">${c[0]}</button>`).join('')}</div>`;
    box.querySelectorAll('.city').forEach(b=>b.addEventListener('click',()=>{ const c=CITIES.find(x=>x[0]===b.dataset.city); save(c[0]); load(c[1],c[2],c[0]); }));
  }

  function save(v){ try{ v?localStorage.setItem('fw-city',v):localStorage.removeItem('fw-city'); }catch(e){} }
  function saved(){ try{ return localStorage.getItem('fw-city'); }catch(e){ return null; } }

  async function placeName(lat,lon){
    try{
      const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh-Hant`);
      const j = await r.json(); return [j.principalSubdivision, j.city||j.locality].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(' ') || '目前位置';
    }catch(e){ return '目前位置'; }
  }

  function getJSON(url, ms){
    const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), ms);
    return fetch(url,{signal:ctl.signal}).then(r=>{ clearTimeout(t); if(!r.ok) throw new Error(r.status); return r.json(); });
  }

  // 主要來源：Open-Meteo
  async function fromOpenMeteo(lat,lon){
    const res = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
      `&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,is_day`+
      `&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,precipitation_probability_max&timezone=auto&forecast_days=1`, 6000);
    const c=res.current, d=res.daily;
    return { src:'Open-Meteo',
      temp:c.temperature_2m, feels:c.apparent_temperature, humidity:c.relative_humidity_2m, desc:wcode(c.weather_code),
      isDay:c.is_day===1, rainNow:c.precipitation>0.1 || isRainCode(c.weather_code),
      min:d.temperature_2m_min[0], max:d.temperature_2m_max[0], feelsMax:d.apparent_temperature_max[0],
      rainProb:d.precipitation_probability_max[0], rainLabel:'降雨機率', rainText:(d.precipitation_probability_max[0] ?? '–')+'%' };
  }

  // 備援來源：挪威氣象局 MET Norway
  const MET_ZH = [['thunder','雷雨'],['sleet','雨夾雪'],['snow','下雪'],['heavyrainshowers','大陣雨'],['rainshowers','陣雨'],
    ['lightrain','小雨'],['heavyrain','大雨'],['rain','下雨'],['fog','有霧'],['partlycloudy','多雲時晴'],['fair','晴時多雲'],
    ['clearsky','晴朗'],['cloudy','陰天']];
  function feelsLike(t, rh, ws){ const e = rh/100*6.105*Math.exp(17.27*t/(237.7+t)); return t + 0.33*e - 0.70*ws - 4.00; }
  async function fromMet(lat,lon){
    const res = await getJSON(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${(+lat).toFixed(2)}&lon=${(+lon).toFixed(2)}`, 10000);
    const ts = res.properties.timeseries;
    const now = ts[0], d = now.data.instant.details;
    const sym = (now.data.next_1_hours||now.data.next_6_hours||{}).summary?.symbol_code || 'cloudy';
    const today = new Date().toDateString();
    const todays = ts.filter(x=>new Date(x.time).toDateString()===today).map(x=>x.data.instant.details);
    const temps = (todays.length?todays:[d]).map(x=>x.air_temperature);
    const feelsAll = (todays.length?todays:[d]).map(x=>feelsLike(x.air_temperature,x.relative_humidity,x.wind_speed));
    const next12 = ts.slice(0,12).map(x=>x.data.next_1_hours?.details?.precipitation_amount ?? 0);
    const rain12 = next12.reduce((a,b)=>a+b,0);
    const hr = new Date().getHours();
    return { src:'挪威氣象局 MET Norway',
      temp:d.air_temperature, feels:feelsLike(d.air_temperature,d.relative_humidity,d.wind_speed), humidity:d.relative_humidity,
      desc:(MET_ZH.find(([k])=>sym.includes(k))||[,'多雲'])[1],
      isDay: sym.includes('_night') ? false : sym.includes('_day') ? true : (hr>=6 && hr<18),
      rainNow:/rain|sleet|thunder|snow/.test(sym) || (next12[0]||0)>0.1,
      min:Math.min(...temps), max:Math.max(...temps), feelsMax:Math.max(...feelsAll),
      rainProb: Math.round(next12.filter(v=>v>0.1).length/12*100), rainLabel:'12 小時雨量', rainText:rain12.toFixed(1)+' mm' };
  }

  async function load(lat,lon,label){
    box.innerHTML = `<div class="today-label">今日香氛 · Today's Scent</div><div class="today-msg">正在讀取${label||'所在地'}的天氣…</div>`;
    const placeP = label?Promise.resolve(label):placeName(lat,lon);
    let wx=null;
    try{ wx = await fromOpenMeteo(lat,lon); }catch(e){}
    if(!wx){ try{ wx = await fromMet(lat,lon); }catch(e){} }
    if(!wx){ msg('天氣資料暫時讀不到，請確認網路後重新整理，或直接選城市。'); return; }
    render(wx, await placeP);
  }

  function locate(){
    const city = saved();
    if(city){ const c=CITIES.find(x=>x[0]===city); if(c) return load(c[1],c[2],c[0]); }
    if(!navigator.geolocation){ return msg('這個瀏覽器無法定位，請選城市：'); }
    box.innerHTML = `<div class="today-label">今日香氛 · Today's Scent</div><div class="today-msg">正在取得你的位置…（請允許瀏覽器使用位置）</div>`;
    navigator.geolocation.getCurrentPosition(
      pos=>load(pos.coords.latitude.toFixed(3), pos.coords.longitude.toFixed(3)),
      ()=>msg('沒有取得位置權限，請選城市：'),
      {timeout:10000, maximumAge:600000}
    );
  }

  window.__fwRecommend = recommend; // 供測試
  locate();
})();

</script>
</body>
</html>
