<style>
  /* 單一深色場景：香水展示櫃的暗金調 */
  :root{
    color-scheme:dark;
    --bg:#0a0806; --ink:#f4efe4; --ink-2:#b9ae97; --muted:#7c7360;
    --gold:#c9a96a; --gold-lt:#ecd6a2; --line:rgba(201,169,106,.28); --panel:rgba(20,16,11,.78);
    --serif:"Playfair Display","Noto Serif TC",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
  }
  /* iOS 26 Safari 會拿貼邊、滿版的 fixed 元素顏色把狀態列／網址列塗成色塊；這頁不用 fixed，
     改成上下各多畫一段（--bt／--bb）、開場捲到 --bt，讓狀態列與網址列底下透出真正的場景 */
  html,body{margin:0;background:var(--bg);color:var(--ink-2);font-family:var(--sans);overflow:hidden;}
  body{position:relative;height:calc(var(--vh,100vh) + var(--bt,0px) + var(--bb,0px));}
  #stage{position:absolute;left:0;top:0;width:100%;height:100%;}
  #stage canvas{display:block;touch-action:none;}
  .hud{position:absolute;pointer-events:none;z-index:5;}
  .hud *{pointer-events:auto;}
  .top{top:var(--bt,0px);left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 16px) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;}
  .back{white-space:nowrap;font-size:12.5px;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:6px 14px;background:var(--panel);backdrop-filter:blur(6px);}
  .back:hover,.back:focus-visible{color:var(--gold);border-color:var(--gold);outline:none;}
  .title{text-align:right;text-shadow:0 1px 10px rgba(0,0,0,.55);}
  .brand{font-family:var(--serif);font-size:10.5px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;}
  .name{font-family:var(--serif);font-size:30px;color:var(--ink);line-height:1.1;margin-top:4px;}
  .meta{font-size:11.5px;color:#efe6d2;line-height:1.6;margin-top:4px;letter-spacing:.5px;}
  .tiers{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(var(--bb,0px) + env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:6px;}
  .tier{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);padding:6px 12px 6px 8px;border-radius:18px;border:1px solid transparent;background:var(--panel);backdrop-filter:blur(6px);}
  .tier b{font-family:var(--serif);font-weight:500;color:var(--ink);font-size:13px;letter-spacing:1px;}
  .tier .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);}
  .tier.on{border-color:var(--c);}
  .tier:focus-visible{outline:1px solid var(--gold);}
  .hint{right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--bb,0px) + env(safe-area-inset-bottom,0px) + 22px);font-size:11px;color:var(--muted);text-align:right;line-height:1.7;max-width:46vw;}
  .card{position:absolute;left:50%;bottom:calc(var(--bb,0px) + env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,20px);opacity:0;transition:opacity .25s,transform .25s;
    width:min(360px,calc(100vw - 36px));background:rgba(20,16,11,.9);border:1px solid var(--line);border-radius:16px;padding:16px 18px;z-index:6;backdrop-filter:blur(8px);pointer-events:none;}
  .card.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  .card .k{font-size:10.5px;letter-spacing:3px;color:var(--c,var(--gold));}
  .card .n{font-family:var(--serif);font-size:22px;color:var(--ink);margin-top:4px;}
  .card .n span{font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-left:8px;}
  .card p{margin:8px 0 0;font-size:13px;line-height:1.7;color:var(--ink-2);}
  .card button{all:unset;position:absolute;top:10px;right:12px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:4px;}
  .card.show ~ .tiers,.card.show ~ .hint{opacity:0;pointer-events:none;}
  .lbl{font-family:var(--sans);text-align:center;white-space:nowrap;transition:opacity .3s;pointer-events:auto;cursor:pointer;background:rgba(18,13,8,.52);padding:5px 11px 6px;border-radius:10px;backdrop-filter:blur(3px);}
  .lbl .z{font-size:12.5px;color:var(--ink);letter-spacing:1px;}
  .lbl .e{font-size:9.5px;color:var(--gold-lt);letter-spacing:1.5px;text-transform:uppercase;opacity:.8;}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:9;background:var(--bg);transition:opacity .6s;}
  #loading .brand{font-size:11px}
  #loading .bar{width:120px;height:1px;background:var(--line);overflow:hidden;position:relative;}
  #loading .bar::after{content:"";position:absolute;inset:0;width:40%;background:var(--gold);animation:ld 1.2s ease-in-out infinite;}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  #err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;background:var(--bg);color:var(--ink-2);font-size:14px;line-height:1.8;}
  @media (max-width:520px){ .name{font-size:24px} .hint{display:none} }
  @media (prefers-reduced-motion:reduce){ #loading .bar::after{animation:none} }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const C = (h)=>new THREE.Color(h);
const TEX = { label:'__TEX_LABEL__', labelBump:'__TEX_LABEL_BUMP__', cap:'__TEX_CAP__', capBump:'__TEX_CAP_BUMP__' };

// ---------- 場景設定：依香水的季節、時段與香材產地 ----------
// Summer BCN：夏季・白天｜佛手柑、橙花、百里香、迷迭香等地中海香材 → 黃昏前的地中海山丘露台
const SCENE_CFG = {
  sunDir: new THREE.Vector3(.52,.58,-.63).normalize(),
  sunColor: C('#ffd9a3'), sunIntensity: 3.4,
  zenith: C('#3c7cc8'), horizon: C('#f6d2a2'), sunGlow: C('#ffc477'),
  seaDeep: C('#0b4466'), seaShallow: C('#1e7d93'),
  haze: C('#e9d2ad'), ground: C('#a88b52'), grassA: C('#b49a4e'), grassB: C('#dcc27c'), grassC: C('#7f8a45'),
};

// ---------- 基礎 ----------
const stage = document.getElementById('stage');
let renderer;
try{
  renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
  if(!renderer.capabilities.isWebGL2) throw new Error('webgl2');
}catch(e){ document.getElementById('err').style.display='flex'; document.getElementById('loading').remove(); throw e; }
const DPR = Math.min(window.devicePixelRatio, 2);
renderer.setPixelRatio(DPR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.shadowMap.autoUpdate = false;
stage.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;z-index:2';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(SCENE_CFG.haze, 70, 520);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 3000);
const clockU = { value:0 };

// ---------- 小工具 ----------
const loader = new THREE.TextureLoader();
function tex(src, srgb=true){ const t = loader.load(src); if(srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; }
function canvasTex(w,h,draw,srgb=true){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
function rng(seed){ let s=seed>>>0||1; return ()=>{ s=Math.imul(s^(s>>>15),2246822507); s=Math.imul(s^(s>>>13),3266489909); s^=s>>>16; return (s>>>0)/4294967296; }; }
function hash3(x,y,z){ let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(z,1274126177); h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967295; }
function noise3(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z); const xf=x-xi,yf=y-yi,zf=z-zi;
  const s=t=>t*t*(3-2*t); const u=s(xf),v=s(yf),w=s(zf); let r=0;
  for(let a=0;a<2;a++)for(let b=0;b<2;b++)for(let c=0;c<2;c++){ r+=hash3(xi+a,yi+b,zi+c)*(a?u:1-u)*(b?v:1-v)*(c?w:1-w); }
  return r*2-1;
}
function fbm(x,y,z,o=4){ let a=.5,f=1,r=0; for(let i=0;i<o;i++){ r+=a*noise3(x*f,y*f,z*f); f*=2.03; a*=.5; } return r; }
function displace(geo, amp, freq, oct=4, seed=0, mask){
  const p=geo.attributes.position, n=new THREE.Vector3(), v=new THREE.Vector3();
  geo.computeVertexNormals(); const nr=geo.attributes.normal;
  for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); n.fromBufferAttribute(nr,i);
    const k = mask?mask(v):1; const d = fbm(v.x*freq+seed, v.y*freq+seed*1.7, v.z*freq-seed, oct)*amp*k;
    p.setXYZ(i, v.x+n.x*d, v.y+n.y*d, v.z+n.z*d); }
  p.needsUpdate=true; geo.computeVertexNormals(); return geo;
}
function noiseCanvas(w,h,{base='#888',dots=0,dotCol='#000',dotR=[1,3],alpha=.3,seed=1}={}){
  return (g)=>{ g.fillStyle=base; g.fillRect(0,0,w,h); const r=rng(seed);
    for(let i=0;i<dots;i++){ g.globalAlpha=alpha*r(); g.fillStyle=dotCol; g.beginPath(); g.arc(r()*w,r()*h,dotR[0]+r()*(dotR[1]-dotR[0]),0,7); g.fill(); } g.globalAlpha=1; };
}

// 花瓣（沿 +X 生長，花瓣面朝 +Y）
function petalGeometry(o){
  const { len=1, wid=.4, segL=16, segW=8, profile=(t)=>Math.pow(Math.sin(Math.PI*Math.min(1,t*.92+.08)),.75),
    cup=.15, curl=.15, droop=0, frill=0, frillFreq=10, frillTip=false, twist=0, base='#ffffff', tip='#ffffff', edge=null, seed=1 } = o;
  const pos=[], col=[], uv=[], idx=[]; const cb=C(base), ct=C(tip), ce=edge?C(edge):null, tmp=new THREE.Color();
  for(let i=0;i<=segL;i++){ const t=i/segL; const w=wid*profile(t);
    for(let j=0;j<=segW;j++){ const u=j/segW-.5;
      let x=t*len, z=u*w, y=cup*w*(4*u*u) + curl*len*t*t - droop*len*t*t;
      if(frill){ const e=frillTip ? Math.pow(t,3)*(.6+.4*Math.abs(2*u)) : Math.pow(Math.abs(2*u),2)*.7 + Math.pow(t,6); y += frill*Math.sin(frillFreq*(u*3.1+t*1.7)+seed)*e + frill*.6*noise3(u*9,t*9,seed)*e; }
      if(twist){ const a=twist*t; const yy=y*Math.cos(a)-z*Math.sin(a), zz=y*Math.sin(a)+z*Math.cos(a); y=yy; z=zz; }
      pos.push(x,y,z); uv.push(j/segW,t);
      tmp.copy(cb).lerp(ct, Math.pow(t,.8)); if(ce) tmp.lerp(ce, Math.pow(Math.abs(2*u),3)*.6*t);
      col.push(tmp.r,tmp.g,tmp.b);
    } }
  for(let i=0;i<segL;i++)for(let j=0;j<segW;j++){ const a=i*(segW+1)+j, b=a+segW+1; idx.push(a,b,a+1, b,b+1,a+1); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
function petalMat(o={}){ return new THREE.MeshPhysicalMaterial(Object.assign({ vertexColors:true, side:THREE.DoubleSide, roughness:.5, sheen:1, sheenRoughness:.5, sheenColor:C('#ffffff'), }, o)); }
function place(mesh, {yaw=0, elev=0, roll=0, x=0, y=0}={}){ const g=new THREE.Group(); g.rotation.y=yaw; g.position.y=y; mesh.rotation.z=elev; mesh.rotation.x=roll; mesh.position.x=x; g.add(mesh); return g; }
function stemCurve(pts){ return new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p))); }
function tube(curve, r, mat, seg=48){ return new THREE.Mesh(new THREE.TubeGeometry(curve, seg, r, 8, false), mat); }
// 沿莖生長的葉片（InstancedMesh）
function leavesAlong(curve, geo, mat, { count=20, perNode=2, elev=.9, yawStep=Math.PI/2, from=.1, to=.98, scale=(t)=>1, jitter=.1, seed=3 }={}){
  const n=count*perNode, im=new THREE.InstancedMesh(geo, mat, n); const r=rng(seed);
  const up=new THREE.Vector3(0,1,0), q=new THREE.Quaternion(), m=new THREE.Matrix4(), e=new THREE.Euler(), qq=new THREE.Quaternion(), s=new THREE.Vector3();
  let k=0;
  for(let i=0;i<count;i++){ const t=from+(to-from)*i/(count-1||1); const p=curve.getPointAt(t), tg=curve.getTangentAt(t);
    q.setFromUnitVectors(up, tg);
    for(let j=0;j<perNode;j++){ const yaw=i*yawStep + j*2*Math.PI/perNode + (r()-.5)*jitter*3;
      e.set(0,yaw,0); qq.setFromEuler(e); const q2=q.clone().multiply(qq);
      e.set(0,0,elev+(r()-.5)*jitter); qq.setFromEuler(e); q2.multiply(qq);
      const sc=scale(t)*(1+(r()-.5)*jitter); s.set(sc,sc,sc); m.compose(p,q2,s); im.setMatrixAt(k++,m); } }
  im.instanceMatrix.needsUpdate=true; return im;
}
function fitTo(group, size){ const b=new THREE.Box3().setFromObject(group), s=new THREE.Vector3(), c=new THREE.Vector3(); b.getSize(s); b.getCenter(c);
  const k=size/Math.max(s.x,s.y,s.z); const wrap=new THREE.Group(); group.position.sub(c); wrap.add(group); wrap.scale.setScalar(k); return wrap; }



const windU = { value:0 };
function windMaterial(opts){
  const m=new THREE.MeshStandardMaterial(Object.assign({ color:0xffffff, vertexColors:true, roughness:.75, side:THREE.DoubleSide }, opts));
  m.onBeforeCompile=(sh)=>{ sh.uniforms.uWind=windU; sh.vertexShader='uniform float uWind;\n'+sh.vertexShader.replace('#include <begin_vertex>',
    `#include <begin_vertex>
     vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
     float gust = sin(uWind*.6 + ip.x*.05)*.5+.5;
     float sway = (sin(uWind*1.7 + ip.x*.35 + ip.z*.22) * .6 + sin(uWind*3.1 + ip.z*.7 + ip.x*.2)*.25) * (.5+gust);
     float hh = max(position.y,0.); transformed.x += sway * hh*hh * .28; transformed.z += sway*hh*hh*.12;`); };
  return m;
}

// ---------- 天空（共用 GLSL） ----------
const SKY_GLSL = `
uniform vec3 uZenith, uHorizon, uSunGlow, uSunDir, uSunCol;
float h3(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm3(vec3 p){ float a=.5,r=0.; for(int i=0;i<5;i++){ r+=a*vn(p); p*=2.02; a*=.5; } return r; }
vec3 skyColor(vec3 d){
  float h = max(d.y, -0.05);
  vec3 c = mix(uHorizon, uZenith, pow(smoothstep(-.02, .3, h), .55));
  float s = max(dot(d, uSunDir), 0.);
  c += uSunGlow * (pow(s, 6.)*.55 + pow(s, 60.)*.9);
  c += uSunCol * smoothstep(.9994, .9998, s) * 30.;
  // 地平線附近的薄雲
  vec2 q = d.xz/(d.y+.12);
  float cl = smoothstep(.55, .85, fbm3(vec3(q*1.6, 3.))) * smoothstep(.0,.08,d.y) * (1.-smoothstep(.25,.5,d.y));
  vec3 cloud = mix(vec3(1.,.95,.88), uSunGlow*1.2+.4, pow(s,4.));
  c = mix(c, cloud, cl*.7);
  return c;
}`;
function skyMaterial(){
  return new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{ uZenith:{value:SCENE_CFG.zenith}, uHorizon:{value:SCENE_CFG.horizon}, uSunGlow:{value:SCENE_CFG.sunGlow}, uSunDir:{value:SCENE_CFG.sunDir}, uSunCol:{value:SCENE_CFG.sunColor} },
    vertexShader:`varying vec3 vD; void main(){ vD = normalize(position); vec4 p = projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position = p.xyww; }`,
    fragmentShader: SKY_GLSL + `varying vec3 vD; void main(){ gl_FragColor = vec4(skyColor(normalize(vD)),1.); }`
  });
}

// ---------- 地中海海面 ----------
function seaMaterial(){
  return new THREE.ShaderMaterial({
    fog:false,
    uniforms:{ uTime:clockU, uZenith:{value:SCENE_CFG.zenith}, uHorizon:{value:SCENE_CFG.horizon}, uSunGlow:{value:SCENE_CFG.sunGlow}, uSunDir:{value:SCENE_CFG.sunDir}, uSunCol:{value:SCENE_CFG.sunColor},
      uDeep:{value:SCENE_CFG.seaDeep}, uShallow:{value:SCENE_CFG.seaShallow}, uHaze:{value:SCENE_CFG.haze} },
    vertexShader:`varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
    fragmentShader: SKY_GLSL + `uniform float uTime; uniform vec3 uDeep, uShallow, uHaze; varying vec3 vW;
      void main(){
        vec2 p = vW.xz*.045; float t=uTime*.35;
        float e=.01;
        float hA = fbm3(vec3(p*1.0+vec2(t,t*.6), t*.3)) + .5*fbm3(vec3(p*3.1-vec2(t*.8,0.), t*.5));
        float hX = fbm3(vec3((p+vec2(e,0.))*1.0+vec2(t,t*.6), t*.3)) + .5*fbm3(vec3((p+vec2(e,0.))*3.1-vec2(t*.8,0.), t*.5));
        float hZ = fbm3(vec3((p+vec2(0.,e))*1.0+vec2(t,t*.6), t*.3)) + .5*fbm3(vec3((p+vec2(0.,e))*3.1-vec2(t*.8,0.), t*.5));
        vec3 n = normalize(vec3(-(hX-hA)/e*.035, 1., -(hZ-hA)/e*.035));
        vec3 v = normalize(cameraPosition - vW);
        float fres = .02 + .98*pow(1.-max(dot(n,v),0.),5.);
        vec3 r = reflect(-v,n); r.y=abs(r.y);
        vec3 refl = skyColor(r);
        vec3 water = mix(uDeep, uShallow, .35+.3*hA);
        vec3 c = mix(water, refl, fres);
        float sp = pow(max(dot(r, uSunDir),0.), 900.); c += uSunCol*sp*18.;
        float dist = length(vW.xz - cameraPosition.xz);
        c = mix(c, uHaze*.92, smoothstep(250., 1400., dist));
        gl_FragColor = vec4(c,1.);
      }`
  });
}

// ---------- 地形與高度 ----------
function terrainH(x,z){
  const d=Math.hypot(x,z);
  const drop = Math.pow(Math.max(0,d-30)/66, 2.2)*44;
  return -0.7 + fbm(x*.04,0,z*.04,4)*2.4*Math.min(1,d/14) - drop;
}

// ---------- 環境（同時用於畫面、反射探針與 PMREM） ----------
function buildWorld(target, detailed){
  const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 64, 32), skyMaterial()); sky.renderOrder=-10; sky.frustumCulled=false; target.add(sky);
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(6000,6000,1,1), seaMaterial()); sea.rotation.x=-Math.PI/2; sea.position.y=-58; target.add(sea);
  // 地形：山丘露台往四周落向海面
  const col=[]; const cA=SCENE_CFG.ground, cB=SCENE_CFG.grassC, cR=C('#b9a07a'), tmp=new THREE.Color();
  // 加密：圓盤幾何只有放射狀頂點，用多段環提高細節
  const ring = new THREE.RingGeometry(0, 170, detailed?160:60, detailed?90:30); ring.rotateX(-Math.PI/2);
  const rp=ring.attributes.position;
  for(let i=0;i<rp.count;i++){ const x=rp.getX(i), z=rp.getZ(i); const y=terrainH(x,z); rp.setY(i,y);
    const slope = Math.min(1, Math.max(0, -y/30)); const n=fbm(x*.08,1,z*.08,3);
    tmp.copy(cA).lerp(cB, .5+.5*n).lerp(cR, slope*.8); col.push(tmp.r,tmp.g,tmp.b); }
  ring.setAttribute('color', new THREE.Float32BufferAttribute(col,3)); ring.computeVertexNormals();
  const gTex=canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#bfb08a'; g.fillRect(0,0,w,h); const r=rng(12);
    for(let i=0;i<9000;i++){ const v=r(); g.fillStyle= v<.4?`rgba(120,98,60,${r()*.35})`: v<.7?`rgba(150,150,90,${r()*.3})`:`rgba(235,220,180,${r()*.35})`; g.fillRect(r()*w,r()*h,1+r()*3,1+r()*2); }
    for(let i=0;i<500;i++){ g.strokeStyle=`rgba(${200+r()*40|0},${180+r()*30|0},120,${r()*.35})`; g.lineWidth=1; g.beginPath(); const x=r()*w,y=r()*h,a=r()*6.28; g.moveTo(x,y); g.lineTo(x+Math.cos(a)*8,y+Math.sin(a)*8); g.stroke(); } });
  gTex.wrapS=gTex.wrapT=THREE.RepeatWrapping; gTex.repeat.set(70,70);
  const ground = new THREE.Mesh(ring, new THREE.MeshStandardMaterial({ vertexColors:true, map:gTex, bumpMap:gTex, bumpScale:1.5, roughness:.95 }));
  ground.receiveShadow=true; target.add(ground);
  // 遠方海岸：層疊山稜與巴塞隆納天際線（含聖家堂剪影）
  const ridge=(dist,az0,az1,height,color,seed)=>{ const pts=[]; const N=90;
    for(let i=0;i<=N;i++){ const a=az0+(az1-az0)*i/N; const h=height*(.45+.55*Math.abs(fbm(i*.09+seed,seed,0,4)+.35));
      pts.push([Math.cos(a)*dist, Math.sin(a)*dist, h]); }
    const g=new THREE.BufferGeometry(); const v=[], idx=[];
    pts.forEach(([x,z,h])=>{ v.push(x,-60,z, x,-60+h,z); });
    for(let i=0;i<N;i++){ const a=i*2; idx.push(a,a+2,a+1, a+1,a+2,a+3); }
    g.setAttribute('position',new THREE.Float32BufferAttribute(v,3)); g.setIndex(idx); g.computeVertexNormals();
    const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({ color, fog:false, side:THREE.DoubleSide })); target.add(m); };
  ridge(900,-2.6,-.5,95,C('#b9b7b4').lerp(SCENE_CFG.haze,.55),3);
  ridge(700,-2.2,-1.0,70,C('#9aa0a2').lerp(SCENE_CFG.haze,.4),7);
  ridge(820, .8, 2.4, 60, C('#b0aea8').lerp(SCENE_CFG.haze,.6), 11);
  { // 城市剪影，位於海灣對岸
    const city=new THREE.Group(); const cm=new THREE.MeshBasicMaterial({ color:C('#a8a4a0').lerp(SCENE_CFG.haze,.5), fog:false }); const r=rng(91);
    const baseA=-1.75, dist=690;
    for(let i=0;i<70;i++){ const a=baseA+(r()-.5)*.55; const w=3+r()*7, h=4+r()*14; const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),cm);
      b.position.set(Math.cos(a)*dist, -60+h/2+8, Math.sin(a)*dist); city.add(b); }
    const sf=new THREE.Group(); const spire=(x,h,r0)=>{ const s=new THREE.Mesh(new THREE.ConeGeometry(r0,h,8),cm); s.position.set(x,h/2,0); sf.add(s); };
    [[-6,46,2.4],[-2,52,2.6],[2,52,2.6],[6,46,2.4],[0,64,3.2],[-11,34,2],[11,34,2]].forEach(a=>spire(...a));
    const body=new THREE.Mesh(new THREE.BoxGeometry(28,18,14),cm); body.position.y=9; sf.add(body);
    sf.position.set(Math.cos(baseA)*dist, -52, Math.sin(baseA)*dist); sf.lookAt(0,-52,0); city.add(sf);
    target.add(city);
  }
  // 地中海樹木：有樹幹、分枝與一片片樹葉（橄欖、檸檬、地中海柏樹）
  if(detailed){
    const r=rng(5); const V=THREE.Vector3;
    const barkTex=canvasTex(256,512,(g,w,h)=>{ g.fillStyle='#6a5d4e'; g.fillRect(0,0,w,h); const rr=rng(9);
      for(let i=0;i<160;i++){ g.strokeStyle=`rgba(${rr()<.5?'35,28,22':'150,140,120'},${.2+rr()*.4})`; g.lineWidth=1+rr()*4; g.beginPath(); let x=rr()*w; g.moveTo(x,0); for(let y=0;y<=h;y+=20){ x+=(rr()-.5)*8; g.lineTo(x,y);} g.stroke(); }
      for(let i=0;i<2500;i++){ g.fillStyle=`rgba(${rr()<.5?'30,25,20':'170,160,140'},${rr()*.2})`; g.fillRect(rr()*w,rr()*h,1+rr()*2,1+rr()*3); } });
    barkTex.wrapS=barkTex.wrapT=THREE.RepeatWrapping; barkTex.repeat.set(1,3);
    const barkM=new THREE.MeshStandardMaterial({ map:barkTex, bumpMap:barkTex, bumpScale:2, roughness:.95 });
    const species={
      olive:{ leaf:petalGeometry({ len:.55, wid:.1, cup:.1, curl:-.04, base:'#ffffff', tip:'#ffffff', segL:5, segW:2 }), cols:['#7c8762','#8f9873','#6a7752','#a3a98a'], xf:[], cl:[] },
      lemon:{ leaf:petalGeometry({ len:.6, wid:.28, cup:.12, curl:.03, base:'#ffffff', tip:'#ffffff', segL:5, segW:3 }), cols:['#2f5a26','#3c6b2e','#284d20','#4a7a36'], xf:[], cl:[] },
      cypress:{ leaf:petalGeometry({ len:.7, wid:.16, cup:-.2, curl:.06, frill:.02, frillFreq:14, base:'#ffffff', tip:'#ffffff', segL:6, segW:3 }), cols:['#24391f','#2f4a28','#1d3019','#3b5631'], xf:[], cl:[] },
    };
    const branches=[], fruits=[];
    const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler(), sc=new V();
    const addLeaf=(sp,p,dirUp,size)=>{ const S=species[sp]; e.set((r()-.5)*2.2, r()*6.28, (r()-.5)*1.6 + (dirUp?.6:0)); q.setFromEuler(e); const k=size*(.75+r()*.5); sc.set(k,k,k);
      S.xf.push(m4.clone().compose(p,q,sc)); S.cl.push(C(S.cols[(r()*S.cols.length)|0]).offsetHSL(0,0,(r()-.5)*.06)); };
    const tubeTaper=(pts,rad,tipK)=>{ const cv=new THREE.CatmullRomCurve3(pts); const seg=8, rs=7; const g=new THREE.TubeGeometry(cv,seg,rad,rs,false); const p=g.attributes.position;
      for(let i=0;i<=seg;i++){ const c=cv.getPointAt(i/seg); const k=1-(1-tipK)*(i/seg); for(let j=0;j<=rs;j++){ const idx=i*(rs+1)+j; p.setXYZ(idx, c.x+(p.getX(idx)-c.x)*k, c.y+(p.getY(idx)-c.y)*k, c.z+(p.getZ(idx)-c.z)*k); } }
      g.computeVertexNormals(); branches.push(g); return cv; };
    // 一般闊葉樹（橄欖、檸檬）：遞迴分枝，末梢長葉
    const grow=(sp,p0,dir,len,rad,lvl,o)=>{ const pts=[p0.clone()]; let p=p0.clone(); const d=dir.clone();
      for(let i=1;i<=4;i++){ d.add(new V((r()-.5)*o.gnarl,(r()-.5)*o.gnarl*.4+o.up,(r()-.5)*o.gnarl)).normalize(); p=p.clone().addScaledVector(d,len/4); pts.push(p); }
      const cv=tubeTaper(pts,rad,.62);
      if(lvl>=o.maxL){ for(let k=0;k<o.leaves;k++){ const t=.25+.75*r(); const c=cv.getPointAt(t); const off=new V(r()-.5,r()-.5,r()-.5).normalize().multiplyScalar(r()*o.spread); addLeaf(sp,c.add(off),true,o.leafSize); }
        if(o.fruit && r()<o.fruit){ const c=cv.getPointAt(.7+r()*.3).add(new V(0,-.25,0)); fruits.push(c); } return; }
      const n=o.kids(lvl); for(let c=0;c<n;c++){ const t=lvl===0?.65+r()*.35:.55+r()*.45; const sp0=cv.getPointAt(t);
        const axis=new V(r()-.5,0,r()-.5).normalize(); const nd=d.clone().applyAxisAngle(axis,o.angle*(.7+r()*.6)).applyAxisAngle(new V(0,1,0),c/n*6.28+r());
        grow(sp,sp0,nd,len*o.lenK*(.8+r()*.4),rad*o.radK,lvl+1,o); } };
    const olive={ gnarl:.55, up:.05, maxL:4, kids:(l)=>l===0?3:2+(r()<.5?1:0), angle:.75, lenK:.68, radK:.6, leaves:34, spread:.75, leafSize:1.0 };
    const lemon={ gnarl:.35, up:.12, maxL:4, kids:(l)=>l===0?3:2+(r()<.6?1:0), angle:.7, lenK:.66, radK:.6, leaves:26, spread:.6, leafSize:1.0, fruit:.35 };
    const place=(minD,maxD,count,fn)=>{ for(let i=0;i<count;i++){ for(let tries=0;tries<20;tries++){ const a=r()*6.28, d=minD+r()*(maxD-minD); const x=Math.cos(a)*d, z=Math.sin(a)*d; const y=terrainH(x,z); if(y>-30){ fn(new V(x,y-.2,z), r()); break; } } } };
    place(36,70,7,(p,k)=>grow('olive',p,new V(0,1,0),3.4+k*1.2,.38+k*.12,0,olive));
    place(34,62,5,(p,k)=>grow('lemon',p,new V(0,1,0),2.6+k*.8,.22+k*.06,0,lemon));
    // 地中海柏樹：細長圓柱樹冠，枝條向上貼近主幹，鱗片狀枝葉成簇
    place(42,95,9,(p,k)=>{ const H=14+k*8; tubeTaper([p.clone(), p.clone().add(new V(.05,H*.5,.05)), p.clone().add(new V(-.04,H,0))], .45+k*.15, .15);
      const n=Math.floor(46+k*20); for(let i=0;i<n;i++){ const t=.08+.9*(i/n); const y=p.y+H*t; const prof=Math.sin(Math.PI*Math.min(1,t*1.05))*.85+.15; const R=(1.1+k*.5)*prof;
        const a=r()*6.28; const b0=new V(p.x,y,p.z), b1=b0.clone().add(new V(Math.cos(a)*R*.7, R*.9, Math.sin(a)*R*.7));
        tubeTaper([b0,b0.clone().lerp(b1,.5).add(new V(0,.2,0)),b1],.06,.3);
        for(let j=0;j<26;j++){ const c=b0.clone().lerp(b1,.3+.7*r()).add(new V((r()-.5)*R*.6,(r()-.5)*R*.5,(r()-.5)*R*.6)); addLeaf('cypress',c,true,1.1); } } });
    const bm=new THREE.Mesh(mergeGeometries(branches), barkM); bm.castShadow=true; target.add(bm);
    Object.values(species).forEach(S=>{ const im=new THREE.InstancedMesh(S.leaf, windMaterial({ roughness:.62 }), S.xf.length);
      S.xf.forEach((m,i)=>{ im.setMatrixAt(i,m); im.setColorAt(i,S.cl[i]); }); im.castShadow=true; target.add(im); });
    if(fruits.length){ const fg=new THREE.SphereGeometry(.22,14,10); fg.scale(1,1.25,1); const fi=new THREE.InstancedMesh(fg,new THREE.MeshPhysicalMaterial({ color:C('#f1cf35'), roughness:.38, clearcoat:.5 }),fruits.length);
      fruits.forEach((p,i)=>{ fi.setMatrixAt(i, m4.makeTranslation(p.x,p.y,p.z)); }); target.add(fi); }
  }
  return { sky, sea, ground };
}

// 台座：地中海橄欖木樹幹切片（年輪、深色紋理、琥珀樹脂填縫、深裂樹皮）
const SLICE_R = 6.8, SLICE_H = 1.7;
const outline = (a)=> 1 + .045*noise3(Math.cos(a)*1.6, Math.sin(a)*1.6, 4.2) + .02*noise3(Math.cos(a)*5, Math.sin(a)*5, 9.1);
{
  const S=1536, cx=S*.515, cy=S*.49, R=S*.5;

  const cracks=[]; const crackA=[1.35,1.95,3.2,5.1,.4]; for(let i=0;i<5;i++){ const a0=crackA[i]; const pts=[]; let a=a0; const len=.35+rr()*.5;

      if(mode==='color') g.strokeStyle=`rgba(${78+rs()*30|0},${44+rs()*18|0},${22},${late?.6:.2+rs()*.2})`;

      if(mode==='bump'){ g.strokeStyle='rgba(0,0,0,.9)'; g.lineWidth=c.w+2.5; g.stroke(); g.strokeStyle='rgba(120,120,120,1)'; g.lineWidth=c.w; g.stroke(); }

      let xx=x; for(let y=0;y<=h;y+=20){ xx+=(r()-.5)*7; g.lineTo(xx+ww*(.6+.4*Math.sin(y*.05)),y);} for(let y=h;y>=0;y-=20){ g.lineTo(x+(r()-.5)*4,y);} g.fill(); }
    for(let i=0;i<5000;i++){ g.fillStyle=`rgba(${r()<.5?'30,24,18':'170,160,140'},${r()*.18})`; g.fillRect(r()*w,r()*h,1+r()*3,1+r()*2); }
    for(let i=0;i<60;i++){ g.fillStyle=`rgba(${90+r()*40|0},${110+r()*40|0},${60},${.2+r()*.3})`; g.beginPath(); g.ellipse(r()*w,h*(.6+r()*.4),4+r()*14,2+r()*6,0,0,7); g.fill(); } });
  barkMap.wrapS=THREE.RepeatWrapping; barkMap.repeat.set(3,1);
  const sg=new THREE.CylinderGeometry(SLICE_R, SLICE_R*1.04, SLICE_H, 256, 10, true);
  { const p=sg.attributes.position; for(let i=0;i<p.count;i++){ const x=p.getX(i), y=p.getY(i), z=p.getZ(i); const a=Math.atan2(z,x); const k=outline(-a);
      const furrow = Math.pow(Math.abs(Math.sin(a*34 + noise3(a*3, y*.6, 2)*2.2)), .35)*.16 + fbm(Math.cos(a)*6, y*1.5, Math.sin(a)*6, 3)*.08;

const MSAA = Math.min(4, renderer.capabilities.maxSamples||4);

const LIQK = (()=>{ const m=liquid.material, c=m.attenuationColor, d=m.attenuationDistance; return new THREE.Vector3(-Math.log(Math.max(c.r,1e-3))/d, -Math.log(Math.max(c.g,1e-3))/d, -Math.log(Math.max(c.b,1e-3))/d); })();

const sceneRT = new THREE.WebGLRenderTarget(2,2,{ type:THREE.HalfFloatType, samples:MSAA, depthTexture:new THREE.DepthTexture(2,2) });
const uViewProj = { value:new THREE.Matrix4() };
const glassMat = new THREE.ShaderMaterial({
  uniforms:{ tScene:{value:sceneRT.texture}, tEnv:{value:cubeRT.texture}, uViewProj, uSunDir:{value:SCENE_CFG.sunDir}, uSunCol:{value:SCENE_CFG.sunColor},
    uHalf:{value:new THREE.Vector3(W/2,GH/2,D/2)}, uWall:{value:WALL}, uBase:{value:BASE}, uLiqTop:{value:LIQ_TOP}, tDepth:{value:sceneRT.depthTexture}, uLiqK:{value:LIQK} },
  vertexShader:`varying vec3 vW, vN, vL; void main(){ vL=position; vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; vN=normalize(mat3(modelMatrix)*normal); gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader:`uniform sampler2D tScene, tDepth; uniform vec3 uLiqK; uniform samplerCube tEnv; uniform mat4 uViewProj; uniform vec3 uSunDir, uSunCol, uHalf; uniform float uWall, uBase, uLiqTop;
    varying vec3 vW, vN, vL;
    float h3(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    float vn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
      return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }
    float fbm(vec3 p){ float a=.5,r=0.; for(int i=0;i<4;i++){ r+=a*vn(p); p*=2.03; a*=.5; } return r; }

    void main(){
      vec3 v = normalize(cameraPosition - vW);
      vec3 L = vL; vec3 n = normalize(vN);

      vec3 q = L*1.3; float e=.08;
      vec3 g = vec3(fbm(q+vec3(e,0,0))-fbm(q-vec3(e,0,0)), fbm(q+vec3(0,e,0))-fbm(q-vec3(0,e,0)), fbm(q+vec3(0,0,e))-fbm(q-vec3(0,0,e)))/(2.*e);
      vec3 q2 = L*vec3(9.,2.2,9.);
      vec3 g2 = vec3(vn(q2+vec3(.5,0,0))-vn(q2-vec3(.5,0,0)), 0., vn(q2+vec3(0,0,.5))-vn(q2-vec3(0,0,.5)));
      n = normalize(n + (g*.045 + g2*.012) * (1.-abs(n)));
      // 指紋與霧面
      float smudge = smoothstep(.45,.8, fbm(L*vec3(.9,.7,.9)+7.)) ;
      float sx = (L.x*1.7+L.y*.4+L.z*1.3)*6. + fbm(L*3.)*1.2; float fw = fwidth(sx)*1.5+1e-4;
      float scratch = (1.-smoothstep(0., .015+fw, abs(fract(sx)-.5))) * smoothstep(.55,.75, fbm(L*1.1+3.)) * .6;
      float rough = .015 + smudge*.16 + scratch*.25;
      // 依位置判斷光線在玻璃中走的距離：瓶底厚玻璃、側壁長路徑、液體區的薄壁
      vec3 a = abs(L);
      float frontFace = step(.5, abs(n.z)), sideFace = step(.5, abs(n.x));
      float inWallBand = frontFace*smoothstep(uHalf.x-uWall-.06, uHalf.x-uWall+.04, a.x) + sideFace*smoothstep(uHalf.z-uWall-.06, uHalf.z-uWall+.04, a.z);
      float y = L.y + uHalf.y;
      float inBase = 1.-smoothstep(uBase-.05, uBase+.05, y);
      float inHead = smoothstep(uLiqTop-.03, uLiqTop+.05, y);
      float thick = mix(2.*uWall, uHalf.x*2., clamp(inWallBand+inBase,0.,1.));
      thick = mix(thick, 2.*uWall, inHead*(1.-inWallBand));
      // 折射 + 色散（R/G/B 不同折射率）
      vec3 col;
      float iors[3]; iors[0]=1.48; iors[1]=1.50; iors[2]=1.525;
      // 香水水體區：不是瓶壁、厚瓶底與液面上方的空氣
      float inLiq = (1.-clamp(inWallBand+inBase,0.,1.)) * (1.-smoothstep(uLiqTop-.05, uLiqTop+.02, y)) * max(frontFace, sideFace);
      float liqLen = mix((uHalf.x-uWall)*2., (uHalf.z-uWall)*2., frontFace);
      vec2 uv0 = toUV(vW); float fz = gl_FragCoord.z; float Lpath = 0.;
      float liqIor[3]; liqIor[0]=1.352; liqIor[1]=1.36; liqIor[2]=1.371;
      for(int k=0;k<3;k++){ vec3 r = refract(-v, n, 1./iors[k]);
        // 雙層折射：玻璃 → 香水（不同折射率、三色略有差異）→ 穿過水體
        vec3 r2 = refract(r, n, iors[k]/liqIor[k]); float L = liqLen / max(dot(-r2, n), .35); if(k==1) Lpath = L;
        vec3 exitP = mix(vW + r*thick, vW + r*(2.*uWall) + r2*L, inLiq); vec2 uv = toUV(exitP);
        uv = clamp(uv, vec2(.001), vec2(.999));
        // 只取玻璃後方的景物：取樣點比玻璃表面更靠近鏡頭（前景）時，沿原路往回找
        for(int j=0;j<4;j++){ if(texture2D(tDepth, uv).x >= fz - 1e-6) break; uv = mix(uv0, uv, .55); }
        if(texture2D(tDepth, uv).x < fz - 1e-6) uv = uv0;
        vec3 s = texture2D(tScene, uv).rgb;
        vec2 o=vec2(.02*rough); s = s*.4 + (texture2D(tScene,uv+o).rgb + texture2D(tScene,uv-o).rgb + texture2D(tScene,uv+vec2(o.x,-o.y)).rgb + texture2D(tScene,uv+vec2(-o.x,o.y)).rgb)*.15;
        col[k] = s[k]; }
      // 厚玻璃的淡綠吸收（路徑越長越綠）
      float cosT = max(dot(n,v), .15);
      vec3 absorb = exp(-vec3(.016,.009,.013) * thick / cosT * .7);
      col *= absorb;
      col *= mix(vec3(1.), exp(-uLiqK * Lpath), inLiq); // 香水的顏色：依光在水體中走的距離吸收
      // 反射：環境探針（依霧面粗糙度模糊）
      vec3 R = reflect(-v, n);

      float F = .04 + .96*pow(1.-max(dot(n,v),0.), 5.);
      F = mix(F, max(F,.12), smudge*.5);
      vec3 c = mix(col, refl, F);
      // 太陽高光（刮痕處散開）
      float sp = pow(max(dot(R, uSunDir), 0.), mix(1400., 80., rough*4.));
      c += uSunCol * sp * mix(14., 1.6, clamp(rough*4.,0.,1.));
      // 邊緣的稜線亮光
      float edge = smoothstep(.0,.35, 1.-max(max(abs(n.x),abs(n.y)),abs(n.z)));
      c += refl * edge * .35;
      gl_FragColor = vec4(c, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});

{

const outRT = new THREE.WebGLRenderTarget(2,2,{ type:THREE.HalfFloatType, samples:MSAA });
const outQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), new THREE.ShaderMaterial({ depthTest:false, depthWrite:false,
  uniforms:{ tColor:{value:outRT.texture}, uRes:{value:new THREE.Vector2(2,2)} },

  // 色調映射後再做 FXAA：處理樹葉、草葉、高光等 MSAA 抓不到的細碎鋸齒
  fragmentShader:`uniform sampler2D tColor; uniform vec2 uRes; varying vec2 vUv;
    vec3 T(vec2 uv){ vec3 c=texture2D(tColor,uv).rgb;
      #ifdef TONE_MAPPING
      c=toneMapping(c);
      #endif
      return linearToOutputTexel(vec4(c,1.)).rgb; }
    void main(){
      vec2 inv=1./uRes; vec2 uv=vUv;
      vec3 rgbNW=T(uv+vec2(-1.,-1.)*inv), rgbNE=T(uv+vec2(1.,-1.)*inv), rgbSW=T(uv+vec2(-1.,1.)*inv), rgbSE=T(uv+vec2(1.,1.)*inv), rgbM=T(uv);

      vec2 dir=vec2(-((lNW+lNE)-(lSW+lSE)), (lNW+lSW)-(lNE+lSE));
      float red=max((lNW+lNE+lSW+lSE)*(.25/8.), 1./128.);
      float rcp=1./(min(abs(dir.x),abs(dir.y))+red);
      dir=clamp(dir*rcp, vec2(-8.), vec2(8.))*inv;

      vec3 B=A*.5+.25*(T(uv-dir*.5)+T(uv+dir*.5));

    for(let k=0;k<seeds;k++){ const a=(k+.5)/seeds*Math.PI*2, rr=R*.3; g.fillStyle='#f5f0d6'; g.beginPath(); g.ellipse(c+Math.cos(a)*rr,c+Math.sin(a)*rr,R*.05,R*.025,a,0,7); g.fill(); }

  renderer.setRenderTarget(outRT); renderer.render(blitScene, blitCam);
  renderer.autoClear=false; camera.layers.set(1); renderer.render(scene,camera); renderer.autoClear=true; camera.layers.set(0);
  // 4) 多重取樣畫布 → 螢幕（色調映射 + FXAA 在這一步）
  renderer.setRenderTarget(null); renderer.render(outScene, blitCam);
  labelRenderer.render(scene,camera);
  if(first){ first=false; const L=document.getElementById('loading'); setTimeout(()=>{ L.style.opacity=0; setTimeout(()=>L.remove(),700); },250); }
});

</script>
</body>
</html>
