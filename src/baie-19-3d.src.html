<style>
  /* 單一深色場景：雨雲的灰藍、冷杉林的墨綠與乾草的暖金 */
  :root{
    color-scheme:dark;
    --bg:#090b0d; --ink:#f1f0eb; --ink-2:#c2c8cc; --muted:#8a9298;
    --gold:#d6c290; --gold-lt:#ece2c4; --line:rgba(214,194,144,.3); --panel:rgba(10,13,16,.74);
    --serif:"Playfair Display","Noto Serif TC",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
  }
  /* iOS 26 Safari 會拿貼邊、滿版的 fixed 元素顏色把狀態列／網址列塗成色塊；這頁不用 fixed，
     改成上下各多畫一段（--bt／--bb）、開場捲到 --bt，讓狀態列與網址列底下透出真正的場景 */
  html,body{margin:0;background:var(--bg);color:var(--ink-2);font-family:var(--sans);overflow:hidden;}
  body{position:relative;height:calc(var(--vh,100vh) + var(--bt,0px) + var(--bb,0px));}
  #stage{position:absolute;left:0;top:0;width:100%;height:100%;}
  #stage canvas{display:block;touch-action:none;}
  .hud{position:absolute;pointer-events:none;z-index:5;}
  .hud *{pointer-events:auto;}
  .top{top:var(--bt,0px);left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 16px) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;}
  .back{white-space:nowrap;font-size:12.5px;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:6px 14px;background:var(--panel);backdrop-filter:blur(6px);}
  .back:hover,.back:focus-visible{color:var(--gold);border-color:var(--gold);outline:none;}
  .title{text-align:right;text-shadow:0 1px 12px rgba(0,0,0,.7),0 0 3px rgba(0,0,0,.45);}
  .brand{font-family:var(--serif);font-size:10.5px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;}
  .name{font-family:var(--serif);font-size:30px;color:var(--ink);line-height:1.1;margin-top:4px;max-width:min(430px,62vw);margin-left:auto;}
  .meta{font-size:11.5px;color:#efe6d2;line-height:1.6;margin-top:4px;letter-spacing:.5px;}
  .tiers{left:max(18px,env(safe-area-inset-left,0px));bottom:calc(var(--bb,0px) + env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:6px;}
  .tier{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);padding:6px 12px 6px 8px;border-radius:18px;border:1px solid transparent;background:var(--panel);backdrop-filter:blur(6px);}
  .tier b{font-family:var(--serif);font-weight:500;color:var(--ink);font-size:13px;letter-spacing:1px;}
  .tier .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);}
  .tier.on{border-color:var(--c);}
  .tier:focus-visible{outline:1px solid var(--gold);}
  .hint{right:max(18px,env(safe-area-inset-right,0px));bottom:calc(var(--bb,0px) + env(safe-area-inset-bottom,0px) + 22px);font-size:11px;color:var(--muted);text-align:right;line-height:1.7;max-width:46vw;}
  .card{position:absolute;left:50%;bottom:calc(var(--bb,0px) + env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,20px);opacity:0;transition:opacity .25s,transform .25s;
    width:min(360px,calc(100vw - 36px));background:rgba(10,13,16,.9);border:1px solid var(--line);border-radius:16px;padding:16px 18px;z-index:6;backdrop-filter:blur(8px);pointer-events:none;}
  .card.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  .card .k{font-size:10.5px;letter-spacing:3px;color:var(--c,var(--gold));}
  .card .n{font-family:var(--serif);font-size:22px;color:var(--ink);margin-top:4px;}
  .card .n span{font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-left:8px;}
  .card p{margin:8px 0 0;font-size:13px;line-height:1.7;color:var(--ink-2);}
  .card button{all:unset;position:absolute;top:10px;right:12px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:4px;}
  .card.show ~ .tiers,.card.show ~ .hint{opacity:0;pointer-events:none;}
  .lbl{font-family:var(--sans);text-align:center;white-space:nowrap;transition:opacity .3s;pointer-events:auto;cursor:pointer;background:rgba(10,13,16,.55);padding:5px 11px 6px;border-radius:10px;backdrop-filter:blur(3px);}
  .lbl .z{font-size:12.5px;color:var(--ink);letter-spacing:1px;}
  .lbl .e{font-size:9.5px;color:var(--gold-lt);letter-spacing:1.5px;text-transform:uppercase;opacity:.8;}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:9;background:var(--bg);transition:opacity .6s;}
  #loading .brand{font-size:11px}
  #loading .bar{width:120px;height:1px;background:var(--line);overflow:hidden;position:relative;}
  #loading .bar::after{content:"";position:absolute;inset:0;width:40%;background:var(--gold);animation:ld 1.2s ease-in-out infinite;}
  @keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  #err{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:10;background:var(--bg);color:var(--ink-2);font-size:14px;line-height:1.8;}
  @media (max-width:520px){ .name{font-size:24px} .hint{display:none} }
  @media (prefers-reduced-motion:reduce){ #loading .bar::after{animation:none} }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const C = (h)=>new THREE.Color(h);
const TEX = { label:'__TEX_B19_LABEL__' };

// ---------- 場景設定：依香水的季節、時段與品牌故事 ----------
// Le Labo BAIE 19（樹果19）。品牌的描述：「久旱之後，一場大雨落下，土地釋放出深沉、帶著磁性的氣味」——雨水打在乾土上的那股氣味（petrichor）。
// 品牌公布的香材圖：杜松漿果（燒杯裡的乾果、枝上帶白粉的藍果）、刺柏焦油（CADE OIL 的鋁罐與一瓶刺柏木屑）、廣藿香的乾葉、
// 冷杉的枝與針葉、棉花（白麝香）、兩種樹脂。中文名是「樹果」。
// Fragrantica 投票：春夏秋、日間 → 夏末午後的林間草地：一片久旱枯黃的草地被冷杉林圍起來，草地上長著掛滿藍色漿果的杜松，
// 幾棵早已乾死、被曬成銀白的老杜松。一陣過路的大雨：瓶子背後偏左的積雨雲垂下一道道雨柱落在林子上，
// 太陽從鏡頭右後方的雲縫照進來，雨幕前是一道彩虹（反日點的 42°，視角換了也在正確的位置）；雨點才剛打到瓶子這裡，
// 龜裂的乾土一點點變深、裂縫積水，林冠冒出水氣。
// 台座是一段被曬成銀白的老刺柏樹樁（刺柏焦油 cade 就是從這種木頭乾餾出來的）：年輪細密的切面、扭轉的銀白木紋、紅褐的心材，
// 被雨點打濕的地方變深，滲出琥珀色的樹脂珠，上面落著幾顆杜松漿果與冷杉針葉。
const dirAzAlt=(az,alt)=>{ const a=THREE.MathUtils.degToRad(az), e=THREE.MathUtils.degToRad(alt); return new THREE.Vector3(-Math.sin(a)*Math.cos(e), Math.sin(e), -Math.cos(a)*Math.cos(e)); };   // az：從 -Z 往 -X 量的方位角
const SCENE_CFG = {
  sunDir: dirAzAlt(-155,27),                                 // 午後的太陽在鏡頭的右後方（雲縫裡），照亮草地與瓶身正面；彩虹就在瓶子背後偏左的積雨雲前
  sunColor: C('#ffe0b2'), sunIntensity: 2.6,
  zenith: C('#2f64a2'), horizon: C('#c4d2da'), sunGlow: C('#ffe2b8'), horizonWarm: C('#f2dcb6'),
  stormDark: C('#262b33'), stormLit: C('#d2cec6'),
  haze: C('#a9b6bc'),
  glassAbsorb: new THREE.Vector3(.03,.018,.03),
};
const STORM = dirAzAlt(25,0);                                // 積雨雲與雨柱的方向（反日點的方位）
const sstep=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
// ---------- 基礎 ----------
const stage = document.getElementById('stage');
let renderer;
try{
  renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
  if(!renderer.capabilities.isWebGL2) throw new Error('webgl2');
}catch(e){ document.getElementById('err').style.display='flex'; document.getElementById('loading').remove(); throw e; }
const DPR = Math.min(window.devicePixelRatio, 2);
renderer.setPixelRatio(DPR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .95;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.shadowMap.autoUpdate = false;
stage.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;z-index:2';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(SCENE_CFG.haze, 160, 2600);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 3000);
const clockU = { value:0 };

// ---------- 小工具 ----------
const loader = new THREE.TextureLoader();
function tex(src, srgb=true){ const t = loader.load(src); if(srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; }
function canvasTex(w,h,draw,srgb=true){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); if(srgb) t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; }
function rng(seed){ let s=seed>>>0||1; return ()=>{ s=Math.imul(s^(s>>>15),2246822507); s=Math.imul(s^(s>>>13),3266489909); s^=s>>>16; return (s>>>0)/4294967296; }; }
function hash3(x,y,z){ let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(z,1274126177); h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967295; }
function noise3(x,y,z){
  const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z); const xf=x-xi,yf=y-yi,zf=z-zi;
  const s=t=>t*t*(3-2*t); const u=s(xf),v=s(yf),w=s(zf); let r=0;
  for(let a=0;a<2;a++)for(let b=0;b<2;b++)for(let c=0;c<2;c++){ r+=hash3(xi+a,yi+b,zi+c)*(a?u:1-u)*(b?v:1-v)*(c?w:1-w); }
  return r*2-1;
}
function fbm(x,y,z,o=4){ let a=.5,f=1,r=0; for(let i=0;i<o;i++){ r+=a*noise3(x*f,y*f,z*f); f*=2.03; a*=.5; } return r; }
function displace(geo, amp, freq, oct=4, seed=0, mask){
  const p=geo.attributes.position, n=new THREE.Vector3(), v=new THREE.Vector3();
  geo.computeVertexNormals(); const nr=geo.attributes.normal;
  for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); n.fromBufferAttribute(nr,i);
    const k = mask?mask(v):1; const d = fbm(v.x*freq+seed, v.y*freq+seed*1.7, v.z*freq-seed, oct)*amp*k;
    p.setXYZ(i, v.x+n.x*d, v.y+n.y*d, v.z+n.z*d); }
  p.needsUpdate=true; geo.computeVertexNormals(); return geo;
}
function noiseCanvas(w,h,{base='#888',dots=0,dotCol='#000',dotR=[1,3],alpha=.3,seed=1}={}){
  return (g)=>{ g.fillStyle=base; g.fillRect(0,0,w,h); const r=rng(seed);
    for(let i=0;i<dots;i++){ g.globalAlpha=alpha*r(); g.fillStyle=dotCol; g.beginPath(); g.arc(r()*w,r()*h,dotR[0]+r()*(dotR[1]-dotR[0]),0,7); g.fill(); } g.globalAlpha=1; };
}

// 花瓣（沿 +X 生長，花瓣面朝 +Y）
function petalGeometry(o){
  const { len=1, wid=.4, segL=16, segW=8, profile=(t)=>Math.pow(Math.sin(Math.PI*Math.min(1,t*.92+.08)),.75),
    cup=.15, curl=.15, droop=0, frill=0, frillFreq=10, frillTip=false, twist=0, base='#ffffff', tip='#ffffff', edge=null, seed=1 } = o;
  const pos=[], col=[], uv=[], idx=[]; const cb=C(base), ct=C(tip), ce=edge?C(edge):null, tmp=new THREE.Color();
  for(let i=0;i<=segL;i++){ const t=i/segL; const w=wid*profile(t);
    for(let j=0;j<=segW;j++){ const u=j/segW-.5;
      let x=t*len, z=u*w, y=cup*w*(4*u*u) + curl*len*t*t - droop*len*t*t;
      if(frill){ const e=frillTip ? Math.pow(t,3)*(.6+.4*Math.abs(2*u)) : Math.pow(Math.abs(2*u),2)*.7 + Math.pow(t,6); y += frill*Math.sin(frillFreq*(u*3.1+t*1.7)+seed)*e + frill*.6*noise3(u*9,t*9,seed)*e; }
      if(twist){ const a=twist*t; const yy=y*Math.cos(a)-z*Math.sin(a), zz=y*Math.sin(a)+z*Math.cos(a); y=yy; z=zz; }
      pos.push(x,y,z); uv.push(j/segW,t);
      tmp.copy(cb).lerp(ct, Math.pow(t,.8)); if(ce) tmp.lerp(ce, Math.pow(Math.abs(2*u),3)*.6*t);
      col.push(tmp.r,tmp.g,tmp.b);
    } }
  for(let i=0;i<segL;i++)for(let j=0;j<segW;j++){ const a=i*(segW+1)+j, b=a+segW+1; idx.push(a,b,a+1, b,b+1,a+1); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
function petalMat(o={}){ return new THREE.MeshPhysicalMaterial(Object.assign({ vertexColors:true, side:THREE.DoubleSide, roughness:.5, sheen:1, sheenRoughness:.5, sheenColor:C('#ffffff'), }, o)); }
function place(mesh, {yaw=0, elev=0, roll=0, x=0, y=0}={}){ const g=new THREE.Group(); g.rotation.y=yaw; g.position.y=y; mesh.rotation.z=elev; mesh.rotation.x=roll; mesh.position.x=x; g.add(mesh); return g; }
function stemCurve(pts){ return new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p))); }
function tube(curve, r, mat, seg=48){ return new THREE.Mesh(new THREE.TubeGeometry(curve, seg, r, 8, false), mat); }
// 沿莖生長的葉片（InstancedMesh）
function leavesAlong(curve, geo, mat, { count=20, perNode=2, elev=.9, yawStep=Math.PI/2, from=.1, to=.98, scale=(t)=>1, jitter=.1, seed=3 }={}){
  const n=count*perNode, im=new THREE.InstancedMesh(geo, mat, n); const r=rng(seed);
  const up=new THREE.Vector3(0,1,0), q=new THREE.Quaternion(), m=new THREE.Matrix4(), e=new THREE.Euler(), qq=new THREE.Quaternion(), s=new THREE.Vector3();
  let k=0;
  for(let i=0;i<count;i++){ const t=from+(to-from)*i/(count-1||1); const p=curve.getPointAt(t), tg=curve.getTangentAt(t);
    q.setFromUnitVectors(up, tg);
    for(let j=0;j<perNode;j++){ const yaw=i*yawStep + j*2*Math.PI/perNode + (r()-.5)*jitter*3;
      e.set(0,yaw,0); qq.setFromEuler(e); const q2=q.clone().multiply(qq);
      e.set(0,0,elev+(r()-.5)*jitter); qq.setFromEuler(e); q2.multiply(qq);
      const sc=scale(t)*(1+(r()-.5)*jitter); s.set(sc,sc,sc); m.compose(p,q2,s); im.setMatrixAt(k++,m); } }
  im.instanceMatrix.needsUpdate=true; return im;
}
function fitTo(group, size){ const b=new THREE.Box3().setFromObject(group), s=new THREE.Vector3(), c=new THREE.Vector3(); b.getSize(s); b.getCenter(c);
  const k=size/Math.max(s.x,s.y,s.z); const wrap=new THREE.Group(); group.position.sub(c); wrap.add(group); wrap.scale.setScalar(k); return wrap; }


const windU = { value:0 };
function windMaterial(opts, amp=1){
  const m=new THREE.MeshStandardMaterial(Object.assign({ color:0xffffff, vertexColors:true, roughness:.75, side:THREE.DoubleSide }, opts));
  m.onBeforeCompile=(sh)=>{ sh.uniforms.uWind=windU; sh.vertexShader='uniform float uWind;\n'+sh.vertexShader.replace('#include <begin_vertex>',
    `#include <begin_vertex>
     vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
     float gust = sin(uWind*.6 + ip.x*.05)*.5+.5;
     float sway = (sin(uWind*1.7 + ip.x*.35 + ip.z*.22) * .6 + sin(uWind*3.1 + ip.z*.7 + ip.x*.2)*.25) * (.5+gust) * ${amp.toFixed(3)};
     float hh = max(position.y,0.); transformed.x += sway * hh*hh * .28; transformed.z += sway*hh*hh*.12;`); };
  m.customProgramCacheKey=()=>'wind'+amp;
  return m;
}

// ---------- 天空（共用 GLSL）：一陣過路的夏日陣雨。太陽那側（右後方）是雨後的藍天與幾朵積雲；
// 左前方是一整座積雨雲：被背後的太陽照亮的雲塔、灰黑的雲底，雲底垂下一道道雨幕。雨幕前是彩虹：
// 以反日點為中心，主虹 40.5°～42.5°（外紅內紫），副虹 50°～53°（顏色顛倒、較淡），兩道虹之間的天空比較暗（亞歷山大暗帶），主虹裡面的天空比較亮 ----------
const SKY_GLSL = `
uniform vec3 uZenith, uHorizon, uSunGlow, uSunDir, uSunCol, uHorizonWarm, uStormDark, uStormLit, uStorm; uniform float uSkyT;
float h3(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);

          // 草地：乾黃的草，一道道被風吹順的條紋、一叢叢之間的暗縫
          vec2 wd=vec2(.8,.6); vec2 sp=vec2(dot(xz,wd), dot(xz,vec2(-wd.y,wd.x)));
          float st=gN(sp*vec2(.18,1.1)), st2=gN(sp*vec2(.6,3.2)+3.);
          vec3 straw=mix(sL(vec3(.5,.39,.2)), sL(vec3(.72,.58,.32)), st*.7+st2*.3*det);
          straw=mix(straw, sL(vec3(.44,.44,.22)), smoothstep(.55,.8,gF(xz*.07+2.))*.45);           // 一片片帶綠的草
          straw=mix(straw, sL(vec3(.8,.7,.48)), smoothstep(.6,.85,gF(xz*.25+9.))*.25*det);        // 枯白的草尖
          straw*=.8+.3*mix(gN(xz*4.+1.),.5,1.-det);                                           // 一叢叢之間的暗縫
          // 龜裂的乾土：淡赭色的泥塊，邊緣微微翹起、裂縫深；雨點打下去一點點變深，靠近水窪的地方整片濕透
          float c=gCell(xz*.85+vec2(gN(xz*.6),gN(xz*.6+5.))*.35); float cid=gId;
          float cw=.04+.05*gN(xz*.4);
          gCrk=(1.-smoothstep(cw*.5, cw*1.6, c))*det2;
          gPlate=smoothstep(0.,.3,c);
          vec3 clay=mix(sL(vec3(.6,.5,.38)), sL(vec3(.7,.6,.47)), cid*.6+gN(xz*2.)*.4);
          clay=mix(clay, sL(vec3(.52,.42,.31)), smoothstep(.55,.8,gF(xz*.5+4.))*.4);
          clay*=.9+.15*mix(gN(xz*9.),.5,1.-det);
          clay=mix(clay*.82, clay, gPlate);                                                     // 翹起的邊緣
          clay=mix(clay, sL(vec3(.16,.12,.09)), gCrk);
          // 土路：車轍裡是濕的泥，中間一條草
          vec3 mud=mix(sL(vec3(.32,.24,.17)), sL(vec3(.42,.33,.23)), gN(xz*1.3));
          mud=mix(mud, sL(vec3(.52,.45,.36)), smoothstep(.6,.85,gN(xz*3.+6.))*.4*det);                // 小石子
          // 林下：冷杉的落葉與苔
          vec3 litter=mix(sL(vec3(.24,.17,.11)), sL(vec3(.33,.24,.15)), gN(xz*2.2));
          litter=mix(litter, sL(vec3(.22,.3,.14)), smoothstep(.5,.8,gF(xz*.3+1.))*.6);
          // 遠方山丘的林冠：一團團冷杉的樹冠，團與團之間暗縫，遠處依螢幕上的大小淡成平均色
          float cl=mix(.5, smoothstep(.3,.75,gN(xz*.22+3.)), 1.-smoothstep(.8,3.,fw)), cl2=mix(.5, gN(xz*.7+7.), 1.-smoothstep(.3,1.2,fw));
          vec3 canopy=mix(sL(vec3(.09,.15,.1)), sL(vec3(.2,.27,.17)), cl*.75+cl2*.25)*mix(.85,1.15,gN(xz*.02));

          col=mix(col, canopy, vZ.w*smoothstep(.2,.6,N.y)+vZ.w*.6*(1.-smoothstep(.2,.6,N.y)));

      .replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\nroughnessFactor=mix(roughnessFactor, .32, gWet*(.5*vZ.x+.6*vZ.y+.25));')

        { vec2 xz=vGW.xz; float fw=length(fwidth(xz));
          float h = vZ.x*(gPlate*.04 - gCrk*.05)*(1.-smoothstep(.1,.6,fw)) + (1.-vZ.x)*(1.-vZ.w)*gN(xz*4.)*.03*(1.-smoothstep(.1,.5,fw));

  };
  m.customProgramCacheKey=()=>'b19ground'; return m; }
// 水窪：映著天空與雲（天空著色器），雨點落下一圈圈漣漪；邊緣一圈濕泥
function puddleMat(){
  return new THREE.ShaderMaterial({
    uniforms:Object.assign(skyUniforms(),{ uFogC:{value:SCENE_CFG.haze} }),
    transparent:true, depthWrite:false,
    vertexShader:`attribute vec2 aE; varying vec3 vW; varying vec2 vE; void main(){ vE=aE; vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: SKY_GLSL + `uniform vec3 uFogC; varying vec3 vW; varying vec2 vE;
      float ph(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      // 漣漪：每一格隨機時間落一滴雨，一圈往外擴散、越擴越淡
      vec2 ripple(vec2 p, float t){ vec2 g=vec2(0.); vec2 i=floor(p);
        for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){ vec2 c=i+vec2(float(x),float(y)); float per=.9+ph(c)*1.4; float tt=t+ph(c+3.1)*per; float k=fract(tt/per); float id=floor(tt/per);
          vec2 ctr=c+vec2(ph(c+id*1.7),ph(c+id*2.9+1.)); vec2 q=p-ctr; float r=length(q); float R=k*.9;
          float w=exp(-pow((r-R)*14.,2.))*(1.-k)*(1.-k);
          g += (r>1e-4 ? q/r : vec2(0.)) * w * sin((r-R)*40.); }
        return g; }
      void main(){
        float e=length(vE);                                    // 0 = 中心，1 = 邊緣
        vec2 p=vW.xz*2.2; float t=uSkyT;
        vec2 g=ripple(p, t)*.55 + ripple(p*1.7+5., t*1.1)*.35;
        float fw=length(fwidth(p)); g*=1.-smoothstep(.15,.6,fw);
        vec3 n=normalize(vec3(-g.x, 1., -g.y));
        vec3 v=normalize(cameraPosition-vW);
        vec3 r=reflect(-v,n); r.y=abs(r.y)+.01;
        vec3 refl=skyColor(r);
        float fres=.02+.98*pow(1.-max(dot(n,v),0.),5.);
        vec3 body=vec3(.07,.06,.05);                           // 混濁的泥水
        vec3 c=mix(body, refl, .35+.6*fres);
        float sp=max(dot(r,uSunDir),0.); c+=uSunCol*pow(sp,400.)*6.;
        float a=(1.-smoothstep(.82,1.,e));
        c=mix(c, vec3(.1,.08,.06), smoothstep(.6,1.,e)*.5);  // 邊緣淺、透出濕泥
        float d=length(vW-cameraPosition); c=mix(c, uFogC, smoothstep(150.,1800.,d));
        gl_FragColor=vec4(c, a);
        #include <colorspace_fragment>
      }`
  }); }
// 雨柱（3D）：遠處林子上方一道道從雲底垂到地面的雨幕，慢慢往下流動；上面也畫彩虹（彩虹就出現在雨裡）
function rainShaftMat(){
  return new THREE.ShaderMaterial({
    uniforms:Object.assign(skyUniforms(),{ uFogC:{value:SCENE_CFG.haze} }),
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    vertexShader:`varying vec2 vUv; varying vec3 vW; void main(){ vUv=uv; vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader: SKY_GLSL + `uniform vec3 uFogC; varying vec2 vUv; varying vec3 vW;
      void main(){
        float x=vUv.x, y=vUv.y; float t=uSkyT;
        float prof=exp(-pow((x-.5)/.26,2.)) * smoothstep(0.,.12,y) * (1.-smoothstep(.82,1.,y));
        float st=vn(vec3(x*38., y*3.+t*.6, 1.))*.6 + vn(vec3(x*90., y*7.+t*1.1, 2.))*.4;
        float sl=fbm3(vec3(x*5., y*1.2+t*.08, 3.));
        float a=prof*(.35+.65*smoothstep(.3,.8,sl))*(.55+.45*st)*.75;
        vec3 d=normalize(vW-cameraPosition);
        vec3 col=mix(vec3(.14,.16,.19), vec3(.28,.3,.33), st*.6+y*.3);
        vec4 rb=rainbow(d); col*=rb.a; col+=rb.rgb*.4;
        a=max(a, length(rb.rgb)*prof*.3);
        gl_FragColor=vec4(col, a);
        #include <colorspace_fragment>
      }`
  }); }

// 遠方低模樹冠的逐像素葉叢凹凸
function makeFoliageMat(k=1){ const m=new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.85 });
  m.onBeforeCompile=(sh)=>{
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vHW;').replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvHW=(modelMatrix*instanceMatrix*vec4(transformed,1.)).xyz;');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>',`#include <common>
      varying vec3 vHW;
      float fh(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
      float fn(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f); return mix(mix(mix(fh(i),fh(i+vec3(1,0,0)),f.x),mix(fh(i+vec3(0,1,0)),fh(i+vec3(1,1,0)),f.x),f.y),mix(mix(fh(i+vec3(0,0,1)),fh(i+vec3(1,0,1)),f.x),mix(fh(i+vec3(0,1,1)),fh(i+vec3(1,1,1)),f.x),f.y),f.z); }`)
      .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
        float lf = fn(vHW*${(3.2*k).toFixed(2)})*.6 + fn(vHW*${(8.*k).toFixed(2)})*.4;
        { vec2 dH=vec2(dFdx(lf),dFdy(lf)); vec3 sx=dFdx(-vViewPosition), sy=dFdy(-vViewPosition); vec3 R1=cross(sy,normal), R2=cross(normal,sx); float det=dot(sx,R1);
          normal=normalize(abs(det)*normal - sign(det)*(dH.x*R1+dH.y*R2)*2.2); }`)
      .replace('#include <color_fragment>','#include <color_fragment>\n        diffuseColor.rgb *= .55 + .65*smoothstep(.25,.75, fn(vHW*'+(3.2*k).toFixed(2)+')*.6 + fn(vHW*'+(8.*k).toFixed(2)+')*.4);');
  };
  m.customProgramCacheKey=()=>'foliage'+k; return m; }

function buildWorld(target, detailed){
  const sky = new THREE.Mesh(new THREE.SphereGeometry(2600, 64, 32), skyMaterial()); sky.renderOrder=-10; sky.frustumCulled=false; target.add(sky);
  // 地面：同心環網格（近處密、遠處疏），貼著地形；內圈 0.8 → 450、外圈 450 → 2400，交界的頂點完全重合
  const ringIn = new THREE.RingGeometry(.8, 450, detailed?480:90, detailed?320:44); ringIn.rotateX(-Math.PI/2);
  { const p=ringIn.attributes.position; for(let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i); const d=Math.hypot(x,z); const k=Math.pow(d/450,1.6)*450/Math.max(d,1e-3); p.setX(i,x*k); p.setZ(i,z*k); } }
  const ringOut = new THREE.RingGeometry(450, 2400, detailed?480:90, detailed?120:24); ringOut.rotateX(-Math.PI/2);
  { const p=ringOut.attributes.position; for(let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i); const d=Math.hypot(x,z); const dn=450*Math.pow(2400/450,(d-450)/1950), k=dn/d; p.setX(i,x*k); p.setZ(i,z*k); } }
  ringIn.deleteAttribute('uv'); ringOut.deleteAttribute('uv'); ringIn.deleteAttribute('normal'); ringOut.deleteAttribute('normal');
  const ring = mergeVertices(mergeGeometries([ringIn, ringOut]), 1e-3);
  const rp=ring.attributes.position, col=[], zone=[];
  for(let i=0;i<rp.count;i++){ const x=rp.getX(i), z=rp.getZ(i); const y=terrainH(x,z); rp.setY(i,y); const d=Math.hypot(x,z), cr=clearR(x,z);
    col.push(1,1,1);
    const ck=crackK(x,z), pd=pathD(x,z), pw=PATH_W(x,z);
    const pk=sstep(pw+.8,pw*.35,pd)*sstep(230,170,d);
    const fk=sstep(cr-2,cr+14,d);
    const ck2=sstep(cr+20,cr+55,d);
    zone.push(Math.max(ck, puddleK(x,z)*.8), pk, fk, ck2); }
  ring.setAttribute('color', new THREE.Float32BufferAttribute(col,3)); ring.setAttribute('aZone', new THREE.Float32BufferAttribute(zone,4)); ring.computeVertexNormals();
  { const nr=ring.attributes.normal; for(let i=0;i<nr.count;i++){ if(!(Math.abs(nr.getX(i))+Math.abs(nr.getY(i))+Math.abs(nr.getZ(i))>.5)) nr.setXYZ(i,0,1,0); } }
  const ground = new THREE.Mesh(ring, groundMat()); ground.receiveShadow=true; target.add(ground);

  const r=rng(5); const V=THREE.Vector3;
  const inst={}; const addI=(key,geo,m4,color)=>{ (inst[key]||(inst[key]={geo,xf:[],cl:[]})).xf.push(m4); inst[key].cl.push(color); };
  const m4=()=>new THREE.Matrix4(); const q=new THREE.Quaternion(), e=new THREE.Euler(), sc=new V();
  const withCol=(g,c=[1,1,1])=>{ if(g.attributes.uv) g.deleteAttribute('uv'); const a=new Float32Array(g.attributes.position.count*3); for(let i=0;i<a.length;i+=3){ a[i]=c[0]; a[i+1]=c[1]; a[i+2]=c[2]; } g.setAttribute('color',new THREE.BufferAttribute(a,3)); return g.index?g.toNonIndexed():g; };
  const tubeTaper=(pts,rad,tipK,seg=8,rs=7,list)=>{ const cv=new THREE.CatmullRomCurve3(pts); const g=new THREE.TubeGeometry(cv,seg,rad,rs,false); const p=g.attributes.position;
    for(let i=0;i<=seg;i++){ const c=cv.getPointAt(i/seg); const k=1-(1-tipK)*(i/seg); for(let j=0;j<=rs;j++){ const idx=i*(rs+1)+j; p.setXYZ(idx, c.x+(p.getX(idx)-c.x)*k, c.y+(p.getY(idx)-c.y)*k, c.z+(p.getZ(idx)-c.z)*k); } }
    g.computeVertexNormals(); list.push(g); return cv; };
  const Q=(x,y,z)=>new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z));
  const wc=[C('#ffffff'),C('#eef2e4'),C('#e2e8d4'),C('#f4f0e2')];

  // ---------- 冷杉（Abies）：筆直的樹幹，一輪輪水平伸出的枝，枝上是扁平的針葉小枝（兩列扁平的深綠針葉，背面帶銀白），整棵是尖尖的圓錐 ----------
  // 低模（反射探針與最遠處）：幾層下垂的圓錐
  const firLow=(()=>{ const parts=[]; for(let k=0;k<5;k++){ const y0=.12+k*.17, h=.34, rr=.27*(1-k*.17); const cg=new THREE.ConeGeometry(rr,h,9,1,true); cg.translate(0,y0+h/2,0); parts.push(cg.toNonIndexed()); }
    const tr=new THREE.CylinderGeometry(.015,.025,.2,5); tr.translate(0,.1,0); parts.push(tr.toNonIndexed());
    const g=mergeGeometries(parts.map(p=>{ p.deleteAttribute('uv'); return p; })); const p=g.attributes.position, c=new Float32Array(p.count*3);
    for(let i=0;i<p.count;i++){ const y=p.getY(i), rad=Math.hypot(p.getX(i),p.getZ(i)); const k=y<.13?.35:(.55+.45*Math.min(1,rad*5)); c[i*3]=.11*k; c[i*3+1]=.17*k; c[i*3+2]=.11*k; }
    g.setAttribute('color',new THREE.BufferAttribute(c,3)); g.computeVertexNormals(); return g; })();
  const firLowMat=makeFoliageMat(.35);

  if(!detailed){
    const fr=rng(77);
    for(let i=0;i<2600;i++){ const a=fr()*6.283, d=95+Math.pow(fr(),.6)*900; const x=Math.cos(a)*d, z=Math.sin(a)*d; if(d<clearR(x,z)+2) continue; const H=18+fr()*14;
      addI('firLow', firLow, m4().compose(new V(x,terrainH(x,z)-.4,z), q.setFromEuler(e.set(0,fr()*6.28,0)), sc.set(H,H,H)), C('#ffffff')); }
    Object.entries(inst).forEach(([k,v])=>{ const im=new THREE.InstancedMesh(v.geo, firLowMat, v.xf.length); v.xf.forEach((m,i)=>{ im.setMatrixAt(i,m); im.setColorAt(i,v.cl[i]); }); target.add(im); });
    return { sky, ground };
  }

  // ---------- 葉片卡：一張張帶透明的小卡片（canvas 畫的針葉、草、杜松小枝），組成看得到枝葉輪廓的樹冠與草叢，不用一團團的球 ----------
  const cardTex=(w,h,draw)=>canvasTex(w,h,(g,W,H)=>{ g.clearRect(0,0,W,H); draw(g,W,H); });
  // 冷杉的扁平小枝：中間一根枝，兩側密密的扁平短針葉（深綠，背面帶一點銀白），側枝再分一次
  const firTex=cardTex(512,256,(g)=>{ const r=rng(301);
    const cols=['#1c3620','#22401f','#284a26','#2f562c','#355e30','#3d6a36'];

      if(lvl<1){ for(let i=0;i<7;i++){ const t=.1+i*.12; spray(x+(x2-x)*t, y+(y2-y)*t, a+(i%2?-1:1)*(.62+r()*.2), L*(.46-.045*i), w*.6, lvl+1, nl0*.85); } } };
    spray(10,128,(r()-.5)*.06,480,3.4,0,15); });
  // 草叢：乾黃的細草從底部散開，幾支彎垂的草穗
  const grassTex=cardTex(256,256,(g)=>{ const r=rng(311);
    for(let i=0;i<70;i++){ const x=128+(r()-.5)*60, a=(r()-.5)*1.3, L=110+r()*130, bend=(r()-.5)*.8; const x2=x+Math.sin(a)*L, y2=256-Math.cos(a)*L;
      const c=r(); g.strokeStyle=c<.15?'#7a7a3e':(c<.55?'#c7a35c':(c<.85?'#b08a48':'#dcc28a')); g.lineWidth=1.3+r()*1.6;
      g.beginPath(); g.moveTo(x,256); g.quadraticCurveTo(x+Math.sin(a)*L*.5+bend*30, 256-Math.cos(a)*L*.55, x2+bend*40, y2+Math.abs(bend)*30); g.stroke(); }
    for(let i=0;i<6;i++){ const x=128+(r()-.5)*90, top=20+r()*60; g.strokeStyle='#cdb27a'; g.lineWidth=1.4; g.beginPath(); g.moveTo(x,256); g.quadraticCurveTo(x+(r()-.5)*20,140,x+(r()-.5)*30,top); g.stroke();
      for(let k=0;k<9;k++){ const sx=x+(r()-.5)*26, sy=top+k*6+r()*4; g.fillStyle=['#e4cc94','#d6ba7c','#ecd8a8'][(r()*3)|0]; g.beginPath(); g.ellipse(sx,sy,2.2,5.5,(r()-.5)*1.2,0,6.283); g.fill(); } } });
  // 杜松的小枝：短短的刺狀針葉三枚一輪（藍綠，上面一道銀白的氣孔帶），枝上掛著帶白粉的藍色漿果與幾顆青綠的未熟果
  const junTex=(berries)=>cardTex(256,256,(g)=>{ const r=rng(berries?321:322);
    const twig=(x,y,a,L,w,lvl)=>{ const x2=x+Math.sin(a)*L, y2=y-Math.cos(a)*L; g.strokeStyle='#5a4634'; g.lineWidth=w; g.beginPath(); g.moveTo(x,y); g.lineTo(x2,y2); g.stroke();

    const lg=petalGeometry({ len:1, wid:.8, profile:prof, cup:-.12, curl:-.04, droop:.12, frill:.016, frillFreq:9, base:'#3d6b2e', tip:'#55803a', edge:'#6a9346', segL:30, segW:12, seed:3 });
    { const p=lg.attributes.position; for(let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i); const u=z/(.8*prof(x)+1e-3); p.setY(i,p.getY(i)-Math.exp(-Math.pow(u*16,2))*.018-Math.pow(Math.max(0,Math.sin((x*7-Math.abs(u)*2.6)*Math.PI)),10)*.009); } lg.computeVertexNormals(); }
    const lm=new THREE.MeshPhysicalMaterial({ vertexColors:true, side:THREE.DoubleSide, roughness:.66, sheen:1, sheenRoughness:.4, sheenColor:C('#d6e6bc') });
    const pm=M.stem('#76804c');
    [[.08,1.05],[.28,1],[.48,.88],[.66,.7],[.82,.5]].forEach(([t,s],i)=>{ const p=stem.getPointAt(t); for(const side of [0,Math.PI]) g.add(leafStalk(lg,lm,pm,p,{ yaw:(i%2?Math.PI/2:0)+side+(r()-.5)*.25, elev:.12+i*.12, roll:(r()-.5)*.3, s, pet:.18 })); });
    const top=stem.getPointAt(.99); for(let i=0;i<4;i++) g.add(leafStalk(lg,lm,pm,top,{ yaw:i*Math.PI/2+.3, elev:1.0, s:.3, pet:.03 }));
    // 乾燥後的廣藿香葉（香料用的部位）：捲曲、深褐
    const dm=new THREE.MeshStandardMaterial({ vertexColors:true, side:THREE.DoubleSide, roughness:.85 });
    for(let i=0;i<4;i++){ const dg=petalGeometry({ len:.6, wid:.42, profile:prof, cup:.3+r()*.3, curl:.25, twist:(r()-.5)*1.4, base:'#4d3420', tip:'#6b4a2a', edge:'#3a2516', segL:16, segW:8, seed:i+9 });
      displace(dg,.05,4,3,i*3); const d=new THREE.Mesh(dg,dm); d.position.set(.35+(r()-.5)*.9,-1.15+r()*.12,.45+(r()-.5)*.5); d.rotation.set(r()*.8,r()*6,r()*.8); g.add(d); }
    return g;
  },
}, BUILD_B19);

// 香材：Fragrantica 列的 6 種（沒有分前中後調）＋品牌發表時另外寫的刺柏焦油；分層依 Basenotes 的金字塔
const NOTES = [
  { tier:0, key:'ozonic', zh:'臭氧調', en:'Ozonic Notes', d:'雷雨前後空氣裡那股清新、帶一點金屬感的氣味：閃電讓空氣裡的氧變成臭氧，雨就要來了。這支香水的開場——大雨落下的那一刻。' },
  { tier:0, key:'greenLeaves', zh:'綠葉', en:'Green Leaves', d:'被雨打濕的嫩葉，葉脈裡的汁液、青草般的苦與清涼；雨水打在葉子上，把綠色的氣味一起帶進空氣裡。' },
  { tier:1, key:'juniper', zh:'杜松漿果', en:'Juniper Berries', d:'覆著一層白粉的藍色球果（中文名「樹果」的那顆果子），揉開是松脂、胡椒與一點點琴酒的清冽；品牌說是「乾燥的杜松漿果」被久旱後的大雨浸透。' },
  { tier:2, key:'patchouli', zh:'廣藿香', en:'Patchouli', d:'葉子曬乾後蒸餾出的油，潮濕泥土、苔蘚與木頭的深沉氣味，是雨後土地的那股「磁性」。' },
  { tier:2, key:'cotton', zh:'白麝香', en:'White Musk', d:'乾淨、柔軟、像洗過曬乾的棉布；Le Labo 的香材照用一朵朵綻開的棉花代表它，讓雨的氣味貼著皮膚久一點。' },
  { tier:2, key:'ambroxan', zh:'龍涎酮', en:'Ambroxan', d:'龍涎香氣味的核心分子：礦物、帶一點鹹的木質麝香，像被雨洗過的石頭，讓整支香水有一股溫暖的擴散感。' },
  { tier:2, key:'cade', zh:'刺柏焦油', en:'Cade', d:'地中海的刺柏木乾餾出的深褐焦油，煙燻、焦土與皮革的氣味；Fragrantica 沒列，品牌發表時寫在香材裡，香材照裡那罐「CADE OIL」就是它——雨打在曬燙的土地上冒出的那股焦熱。' },
];
const TIERS = [
  { zh:'前調', en:'TOP', y:12.4, r:8.4, speed:.10, color:'#a8c8dc' },
  { zh:'中調', en:'HEART', y:7.6, r:9.0, speed:-.075, color:'#9cb0d6' },
  { zh:'後調', en:'BASE', y:2.9, r:9.2, speed:.06, color:'#c9a57e' },
];

const rings = TIERS.map(()=>{ const g=new THREE.Group(); scene.add(g); return g; });
const items = [];
NOTES.forEach((n)=>{
  const tierNotes = NOTES.filter(x=>x.tier===n.tier); const idx = tierNotes.indexOf(n); const T = TIERS[n.tier];
  const model = fitTo(BUILD[n.key](), 2.5);
  model.traverse(o=>{ if(o.isMesh){ o.userData.note=n; o.castShadow=!o.userData.noShadow; } });
  const holder = new THREE.Group(); const spin = new THREE.Group(); spin.add(model); holder.add(spin);
  const a = idx/tierNotes.length*Math.PI*2 + n.tier*.45; holder.userData.a=a;
  const el=document.createElement('div'); el.className='lbl'; el.innerHTML=`<div class="z">${n.zh}</div><div class="e">${n.en}</div>`;
  el.setAttribute('role','button'); el.tabIndex=0; el.addEventListener('click',(ev)=>{ ev.stopPropagation(); show(n); }); el.addEventListener('keydown',(ev)=>{ if(ev.key==='Enter') show(n); });
  const lbl=new CSS2DObject(el); lbl.position.set(0,-1.55,0); holder.add(lbl);
  rings[n.tier].add(holder);
  items.push({ n, holder, spin, el, phase:Math.random()*6.28, focus:1 });
});
TIERS.forEach((T)=>{
  const ring=new THREE.Mesh(new THREE.TorusGeometry(T.r, .014, 6, 220), new THREE.MeshBasicMaterial({ color:C(T.color), transparent:true, opacity:.35, depthWrite:true, fog:false }));
  ring.rotation.x=Math.PI/2; ring.position.y=T.y; scene.add(ring); T.ringMesh=ring;
});
// 材質的環境反射強度微調
scene.traverse(o=>{ if(!o.isMesh) return; (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(m.isMeshStandardMaterial && m.envMapIntensity===1) m.envMapIntensity=.85; }); });

// ---------- 相機與互動 ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.06; controls.enablePan=false;
controls.minDistance=14; controls.maxDistance=80; controls.minPolarAngle=.95; controls.maxPolarAngle=1.52;
controls.autoRotate=!matchMedia('(prefers-reduced-motion: reduce)').matches; controls.autoRotateSpeed=.4;
const TGT_Y=5.6; const target=new THREE.Vector3(0,TGT_Y,0), targetGoal=target.clone(); controls.target.copy(target);

function layout(k){
  items.forEach(it=>{ const T=TIERS[it.n.tier], a=it.holder.userData.a; it.holder.position.set(Math.cos(a)*T.r*k, T.y, Math.sin(a)*T.r*k); });
  TIERS.forEach(T=>T.ringMesh.scale.setScalar(k));
}
const RUNWAY = matchMedia('(pointer:coarse)').matches ? {t:110, b:150} : {t:0, b:0};   // 狀態列、網址列底下多畫的高度
function frame(){
  const w=innerWidth, h=innerHeight, H=h+RUNWAY.t+RUNWAY.b, rs=document.documentElement.style;
  rs.setProperty('--vh',h+'px'); rs.setProperty('--bt',RUNWAY.t+'px'); rs.setProperty('--bb',RUNWAY.b+'px');
  renderer.setSize(w,H); labelRenderer.setSize(w,H); camera.aspect=w/h;
  if(RUNWAY.t||RUNWAY.b) camera.setViewOffset(w,h,0,-RUNWAY.t,w,H); else camera.clearViewOffset();
  const dp=renderer.getPixelRatio(); sceneRT.setSize(Math.floor(w*dp), Math.floor(H*dp)); outRT.setSize(Math.floor(w*dp), Math.floor(H*dp)); outQuad.material.uniforms.uRes.value.set(Math.floor(w*dp), Math.floor(H*dp)); dofRT.setSize(Math.floor(w*dp), Math.floor(H*dp)); dofQuad.material.uniforms.uRes.value.set(Math.floor(w*dp), Math.floor(H*dp)); dofQuad.material.uniforms.uMaxR.value=DOF.maxR*dp;
  const k=THREE.MathUtils.clamp(camera.aspect*1.25,.6,1); layout(k);
  const vf=THREE.MathUtils.degToRad(camera.fov)/2, hf=Math.atan(Math.tan(vf)*camera.aspect);
  const dist=Math.max(9.8/Math.tan(vf), (8.7*k+1.3)/Math.tan(hf));
  camera.position.set(dist*.18, target.y+dist*.1, dist); camera.updateProjectionMatrix(); window.scrollTo(0,RUNWAY.t); controls.maxDistance=Math.max(56,dist*1.08); controls.minDistance=16;
}
frame(); addEventListener('resize', frame);
window.__dbg={camera,controls,target,targetGoal,THREE,items,bottle,rings,renderer,scene,glass,envScene,fx,world,pedestal};

// 香調圖例
const tiersEl=document.getElementById('tiers'); let focusTier=-1;
TIERS.forEach((T,i)=>{ const b=document.createElement('button'); b.type='button'; b.className='tier'; b.style.setProperty('--c',T.color);
  b.innerHTML=`<span class="dot"></span><b>${T.zh}</b><span>${NOTES.filter(n=>n.tier===i).map(n=>n.zh).join('・')}</span>`;
  b.addEventListener('click',()=>{ focusTier = focusTier===i?-1:i; [...tiersEl.children].forEach((c,k)=>c.classList.toggle('on',k===focusTier)); targetGoal.y = focusTier<0?TGT_Y:TIERS[i].y; });
  tiersEl.appendChild(b); });

// 點選香材
const card=document.getElementById('card'), ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let down=null, picked=null;
renderer.domElement.addEventListener('pointerdown',e=>{ down=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{ if(!down) return; const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]); down=null; if(moved>6) return;
  const cr=renderer.domElement.getBoundingClientRect(); ptr.set((e.clientX-cr.left)/cr.width*2-1, -((e.clientY-cr.top)/cr.height)*2+1); ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(rings,true).find(h=>h.object.userData.note);
  if(hit) show(hit.object.userData.note); else hide(); });
function show(n){ picked=n; const T=TIERS[n.tier]; card.style.setProperty('--c',T.color);
  document.getElementById('card-k').textContent=`${T.zh} ${T.en}`;
  document.getElementById('card-n').innerHTML=`${n.zh}<span>${n.en}</span>`;
  document.getElementById('card-p').textContent=n.d; card.classList.add('show'); }
function hide(){ picked=null; card.classList.remove('show'); }
document.getElementById('card-x').addEventListener('click',hide);

// ---------- 動畫與合成 ----------
const clock=new THREE.Clock(); const tmpV=new THREE.Vector3(), camDir=new THREE.Vector3();
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pp = pollen.geometry.attributes.position; const pBase = pp.array.slice();
let first=true;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  clockU.value=t; windU.value = still?0:t;
  rings.forEach((g,i)=>{ if(!still) g.rotation.y += TIERS[i].speed*dt; });
  if(!still){ for(let i=0;i<pp.count;i++){ pp.array[i*3]=pBase[i*3]+Math.sin(t*.13+i)*.6; pp.array[i*3+1]=pBase[i*3+1]+Math.sin(t*.21+i*1.7)*.4; pp.array[i*3+2]=pBase[i*3+2]+Math.cos(t*.11+i*1.3)*.6; } pp.needsUpdate=true; }
  if(!still) shafts.forEach(s=>{ s.m.opacity = s.base*(.7+.3*Math.sin(t*.35+s.ph)); });
  if(!still) fx.update(t,dt);
  target.lerp(targetGoal, .05); controls.target.copy(target);
  camera.getWorldDirection(camDir);
  items.forEach(it=>{
    if(!still){ it.spin.rotation.y += dt*.35; it.spin.position.y = Math.sin(t*.9+it.phase)*.18; }
    const on = (focusTier<0 || it.n.tier===focusTier) && (!picked || picked===it.n);
    it.focus += ((on?1:.55) - it.focus)*.08; it.spin.scale.setScalar(.75+.25*it.focus + (picked===it.n?.15:0));
    it.holder.getWorldPosition(tmpV); const behind = tmpV.clone().sub(target).dot(camDir) > 1.5;
    it.el.style.opacity = (behind?.2:1) * (on?1:.35);
  });
  TIERS.forEach((T,i)=>{ T.ringMesh.material.opacity = (focusTier<0||focusTier===i)?.35:.08; });
  controls.update();
  { const gy=terrainH(camera.position.x,camera.position.z)+2.5; if(camera.position.y<gy) camera.position.y=gy; }   // camera below terrain：轉到低角度時別鑽進地面
  camera.updateMatrixWorld(); uViewProj.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse); uInvVP.value.copy(uViewProj.value).invert();
  // 1) 不含玻璃的畫面 → 貼圖（香水水體在這一步已自行折射背景）
  renderer.shadowMap.needsUpdate = true; camera.layers.set(0); renderer.setRenderTarget(sceneRT); renderer.render(scene,camera);
  // 2) 貼回螢幕（含深度）  3) 玻璃取樣第 1 步的畫面做第二層折射
  renderer.setRenderTarget(outRT); renderer.render(blitScene, blitCam);
  renderer.autoClear=false; camera.layers.set(1); renderer.render(scene,camera); renderer.autoClear=true; camera.layers.set(0);
  // 4) 多重取樣畫布 → 螢幕（色調映射 + FXAA 在這一步）
  // 5) 景深：焦點 = 鏡頭到注視點的距離
  dofQuad.material.uniforms.uFocus.value = tmpV.copy(controls.target).sub(camera.position).dot(camDir);
  renderer.setRenderTarget(dofRT); renderer.render(dofScene, blitCam);
  renderer.setRenderTarget(null); renderer.render(outScene, blitCam);
  labelRenderer.render(scene,camera);
  if(first){ first=false; const L=document.getElementById('loading'); setTimeout(()=>{ L.style.opacity=0; setTimeout(()=>L.remove(),700); },250); }
});

</script>
